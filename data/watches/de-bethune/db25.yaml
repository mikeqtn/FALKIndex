id: de-bethune/db25
brand: de-bethune
model: DB25
route_label: manufacture caliber
notes: Handbook v0.2 §8 lists this record as "De Bethune — DB25 / manufacture caliber".
provenance:
  - dimension: MA
    component: Manufacture calibers (e.g. DB2324 perpetual calendar, DB3000 monopusher)
    performer: de-bethune
