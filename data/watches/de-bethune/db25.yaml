claims:
  - id: db25-almost-all-inhouse
    statement: A 2017 workshop visit report says De Bethune makes almost all components of its watches in-house, including balances and balance springs.
    excerpt: De Bethune makes almost all the components of its watches inhouse, including balance and balance springs!
    source: watchprosite-debethune-workshops
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-cnc-screws-dials
    statement: The same report says CNC machines in the workshop cut and mill components, including screws and dials.
    excerpt: the CNC machines cut and mill the components, including screws and dials.
    source: watchprosite-debethune-workshops
    dimensions:
      - MM
      - DH
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-hairspring-integration
    statement: A 2026 Europa Star report says De Bethune is integrating all hairspring production in-house, from wire drawing to colleting, and does final adjustment with its own balance wheel.
    excerpt: integrating the entire hairspring production in-house
    source: europastar-debethune-chronometrie
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-escapement-redesign
    statement: The same report says De Bethune redesigned the Swiss lever escapement and uses a silicon escape wheel.
    excerpt: De Bethune redesigned the Swiss lever escapement
    source: europastar-debethune-chronometrie
    dimensions:
      - MA
      - MM
      - PD
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-qp-dbcaliber
    statement: A hands-on review of the DB25 Perpetual Calendar identifies the in-house caliber DB2324 automatic movement.
    excerpt: There, you'll see the truly interesting-looking in-house De Bethune caliber DB2324 automatic movement.
    source: ablogtowatch-db25-qp
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-qp-balance
    statement: The same review says the balance wheel is titanium with platinum weights and the escapement uses silicon parts.
    excerpt: the balance wheel is produced from titanium with platinum weights.
    source: ablogtowatch-db25-qp
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-qp-guilloche
    statement: The same review says the dial's main section is engraved on a hand-operated guilloché machine, without saying where.
    excerpt: The main section is first engraved using a hand-operated guilloché machine and then hued green.
    source: ablogtowatch-db25-qp
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-mono-entirely-inhouse
    statement: A 2025 review of the DB25 Monopusher Chronograph (caliber DB3000) says De Bethune moved entirely to in-house movements.
    excerpt: De Bethune rapidly went entirely in-house with a large stable of movements.
    source: sjx-db25-monopusher
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-mono-hairspring
    statement: The same review describes a proprietary flat hairspring and a titanium balance with white gold weights.
    excerpt: proprietary flat hairspring that breathes like an overcoil
    source: sjx-db25-monopusher
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-mono-finishing
    statement: The same review says the movement decoration is finished by hand but likely machine-applied first.
    excerpt: The decoration is clearly finished off by hand, but likely applied by machine to begin with.
    source: sjx-db25-monopusher
    dimensions:
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-mono-case
    statement: The same review lists a titanium case and does not name its maker.
    excerpt: "Material: Titanium"
    source: sjx-db25-monopusher
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: db25-psky-bluing-setting
    statement: Launch text for the DB25 Perpetual Sky, reproduced by Timekeepers Club, says the titanium dial is polished and blued with a thermal oxidation process exclusive to the Manufacture, after which De Bethune's artisans set the white gold star pins.
    excerpt: After delicate polishing and bluing operations using a thermal oxidation process exclusive to the Manufacture, our artisans set each white gold pin into micro-perforations of varying sizes
    source: timekeepers-db25-perpetual-sky
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: db25-psky-dial
    statement: The same text describes the DB25 Perpetual Sky dial as flat, polished, blued titanium personalised to a chosen place and date.
    excerpt: Defined according to a specific geographical location and date, this pattern enables subtle personalisation of the flat polished blued titanium dial
    source: timekeepers-db25-perpetual-sky
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: db25-mpss-oxidation
    statement: De Bethune's page for the DB25 Moon Phase Starry Sky says its own exclusive oxidation process gives the titanium dial its blue colour.
    excerpt: De Bethune’s exclusive natural oxidation process transforms titanium into this radiant hue, a testament to the Manufacture’s unparalleled expertise
    source: debethune-db25-moon-phase-starry-sky
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: db25-qp-cases-dials-roof
    statement: A 2024 Quill & Pad review by a writer who says he works within a business group that owns De Bethune states that De Bethune produces cases, dials and movements, plus engraving and small parts, under its own roof.
    excerpt: While most brands producing cases, dials, and movements in-house are large industrial operations, DB localizes these crafts – and a few others like engraving and small parts manufacture – under its own roof
    source: quillandpad-db28xs-starry-seas
    dimensions:
      - EX
      - DH
      - MM
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: db25-qp-hairspring-alloy
    statement: The same review says De Bethune does not make its own hairspring alloy but applies its patented hairspring geometry in-house.
    excerpt: While DB does not create its own hairspring alloys, the company’s patented hairspring geometry is applied in-house
    source: quillandpad-db28xs-starry-seas
    dimensions:
      - MM
    date_checked: 2026-11-17
    editor: falk-index
    status: active
