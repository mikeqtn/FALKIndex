    change_note: "Adds F.P. Journe's Invenit et Fecit page (fpjourne-invenit-et-fecit) and further claims from the SJX manufacture visit report (sjx-fp-journe-manufacture) on finishing, design and prototyping. Changes from version 2: CF U → 3; PD U → 4; confidence stays C. None of seven dimensions remain U. EX, CF and WE rest only on a secondary source, so confidence does not rise to B."
    created_on: 2026-11-17
    scores:
      MA:
        value: 5
        rationale: F.P. Journe's technical sheet lists the exclusive manually wound calibre 1304, and its product page says the base plate and bridges are in 18K rose gold (fpjcs-calibre-1304, fpjcs-gold-plates). The calibre is the brand's own design.
        evidence:
          - claim: fpjcs-calibre-1304
            stance: supports
            note: Exclusive calibre.
          - claim: fpjcs-gold-plates
            stance: supports
            note: Gold plates and bridges.
      MM:
        value: 4
        rationale: The SJX report says the Geneva workshop turns rods into plates, bridges, wheels and pinions, and that about 95% of components are made in-house (fpjcs-movement-parts, fpjcs-95-percent). Springs, jewels and certain escapement parts, including the hairspring, are bought in (fpjcs-bought-in, fpjcs-balance-spring), so this is 4 rather than 5.
        evidence:
          - claim: fpjcs-movement-parts
            stance: supports
            note: In-house parts machining.
          - claim: fpjcs-95-percent
            stance: supports
            note: About 95% in-house.
          - claim: fpjcs-bought-in
            stance: context
            note: Bought-in springs and escapement parts.
          - claim: fpjcs-balance-spring
            stance: context
            note: Hairspring maker not named.
      EX:
        value: 4
        rationale: The SJX report says Les Boîtiers de Genève makes cases and bracelets exclusively for F.P. Journe (fpjcs-bdg-cases); the credit is in-group and disclosed. The source is general to the brand, not this reference, so this is not 5.
        evidence:
          - claim: fpjcs-bdg-cases
            stance: supports
            note: Owned case maker.
          - claim: fpjcs-95-percent
            stance: supports
            note: Components in-house.
      DH:
        value: 3
        rationale: The dial is made by Les Cadraniers de Genève, F.P. Journe's group-owned dial maker; the credit is in-group and disclosed (fpjcs-cadraniers-havana, fpjcs-cdg-dials). The SJX report saw CDG finishing applied numerals for this model's dial (fpjcs-sjx-cs-appliques). The hand maker is not named, so this stays at 3 rather than 4.
        evidence:
          - claim: fpjcs-cadraniers-havana
            stance: supports
            note: In-group dial maker.
          - claim: fpjcs-cdg-dials
            stance: supports
            note: Les Cadraniers de Genève makes the dials.
          - claim: fpjcs-sjx-cs-appliques
            stance: supports
            note: Names this model's dial appliques being finished at CDG.
      CF:
        value: 3
        rationale: The SJX report says all F.P. Journe watches are finished at the Geneva manufacture, where a seven-artisan department handles all manual finishing after a first automated stage (fpjcs-sjx-designed-finished, fpjcs-sjx-hand-finishing); the statement is universal, so it covers this model. The same report says perlage is done by hand only on complex models such as the Astronomic Souveraine and FFC (fpjcs-sjx-machine-perlage), and the technical sheet lists modest decoration for this calibre (fpjcs-decoration). Borderline 3/4. It is held at 3 because the evidence is a single secondary report and nothing places advanced hand finishing on this movement specifically.
        evidence:
          - claim: fpjcs-sjx-designed-finished
            stance: supports
            note: All watches finished at the Geneva manufacture.
          - claim: fpjcs-sjx-hand-finishing
            stance: supports
            note: In-house hand-finishing department.
          - claim: fpjcs-sjx-machine-perlage
            stance: context
            note: Hand perlage reserved for complex models; machine first stage.
          - claim: fpjcs-decoration
            stance: context
            note: Decoration specified for this calibre.
          - claim: fpjcs-sjx-case-hand-finishing
            stance: context
            note: In-group hand finishing of cases at Les Boîtiers de Genève; general to the brand.
      WE:
        value: 5
        rationale: The SJX report says each watch is assembled and adjusted by a single watchmaker (fpjcs-one-watchmaker), on a movement made almost entirely in-house. Adjustment work by the brand is described, which allows a score above 3.
        evidence:
          - claim: fpjcs-one-watchmaker
            stance: supports
            note: One watchmaker per watch.
      PD:
        value: 4
        rationale: F.P. Journe's own page says Journe breaks down every movement he invents so each component is made to his requirements, and that each watch results from an original conception (fpjcs-invenit-industrialise, fpjcs-invenit-original). The SJX report adds that all movements are designed at the manufacture and that Journe is the lead designer and builds the prototypes of all new movements (fpjcs-sjx-designed-finished, fpjcs-sjx-lead-designer, fpjcs-sjx-prototypes). These are universal statements, so they cover this calibre. Not 5, because no collected claim describes an invention that defines this watch.
        evidence:
          - claim: fpjcs-invenit-industrialise
            stance: supports
            note: Brand says components are made to Journe's specification for all his movements.
          - claim: fpjcs-invenit-original
            stance: supports
            note: Brand claims original conception for every watch.
          - claim: fpjcs-sjx-designed-finished
            stance: supports
            note: All movements designed at the manufacture.
          - claim: fpjcs-sjx-lead-designer
            stance: supports
            note: Journe is lead designer.
          - claim: fpjcs-sjx-prototypes
            stance: supports
            note: Journe builds prototypes of all new movements.
