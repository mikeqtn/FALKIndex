    change_note: "AI-drafted first evidenced profile. Proposed: EX 3 → 4 (wholly owned case maker, recorded as in-group); CF 5 → U (the decoration is specified, but no claim says where it is done); PD 5 → U (the calibre claim is tagged MA, not PD). Confidence stays B. Needs review."
