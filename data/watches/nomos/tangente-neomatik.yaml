id: nomos/tangente-neomatik
brand: nomos
model: Tangente neomatik
notes: Handbook v0.2 §8 lists this record as "NOMOS Glashütte — Tangente neomatik".
provenance:
  - dimension: MA
    component: Calibre DUW 3001 architecture
    performer: nomos
    relationship: internal
    note: NOMOS's page for Tangente neomatik ref. 175 (35 mm) names calibre DUW 3001.
    claims:
      - ntn-duw3001
      - ntn-model-duw3001
  - dimension: MM
    component: Plates, bridges, wheels and pinions
    performer: nomos
    relationship: internal
    claims:
      - ntn-onsite
      - ntn-95pct
      - ntn-schlottwitz
  - dimension: MM
    component: Swing system escapement and balance
    performer: nomos
    relationship: internal
    claims:
      - ntn-swing
      - ntn-escapement-2014
  - dimension: MM
    component: Balance spring
    relationship: external_specialist
