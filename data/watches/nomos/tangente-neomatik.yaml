id: nomos/tangente-neomatik
brand: nomos
model: Tangente neomatik
notes: Handbook v0.2 §8 lists this record as "NOMOS Glashütte — Tangente neomatik".
claims:
  - id: ntn-duw3001
    statement: The maker describes calibre DUW 3001 as an in-house built automatic neomatik calibre.
    excerpt: in-house built NOMOS neomatik caliber with automatic winding
    source: nomos-duw3001-page
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-swing
    statement: The maker calls the NOMOS swing system its proprietary escapement.
    excerpt: The NOMOS swing system, our proprietary escapement, also known as a caliber's heart
    source: nomos-duw3001-page
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-finish
    statement: The maker lists rhodium-plated surfaces with Glashütte ribbing and NOMOS perlage.
    excerpt: rhodium-plated surfaces with Glashütte ribbing and NOMOS perlage
    source: nomos-duw3001-page
    dimensions:
      - CF
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-six-positions
    statement: The maker says the calibre is adjusted in six positions.
    excerpt: adjusted in six positions
    source: nomos-duw3001-page
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-onsite
    statement: The maker says its watches are made almost entirely on site, from parts to final quality control.
    excerpt: Watches from NOMOS Glashütte are made almost entirely on site—from the first cog to the final quality control.
    source: nomos-production
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-assembly
    statement: The maker describes parts being pre-assembled, assembled, regulated and fitted with strap or bracelet.
    excerpt: "Step by step, the finest parts are turned into a mechanical watch: pre-assembled, assembled, regulated, and finally fitted with a bracelet or strap."
    source: nomos-production
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-95pct
    statement: A specialist magazine reports the brand cites an in-house rate of about 95 per cent for movement components.
    excerpt: an in-house manufacturing rate of approximately 95 percent
    source: nomos-swisswatches-visit
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-schlottwitz
    statement: The same article says the Schlottwitz facility produces turned parts such as wheels, pinions and shafts.
    excerpt: turned components such as wheels, pinions, and shafts
    source: nomos-swisswatches-visit
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-external
    statement: The same article says the case, hands, dial, strap and clasp are sourced externally.
    excerpt: everything outside of the movement – meaning the case, hands, dial, strap, and clasp – is sourced externally
    source: nomos-swisswatches-visit
    dimensions:
      - EX
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-berlinerblau
    statement: The same article describes an in-house design department, Berlinerblau.
    excerpt: The in-house creative department Berlinerblau is located in an old industrial loft that was once used for button production.
    source: nomos-swisswatches-visit
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-escapement-2014
    statement: At the swing system launch, a specialist site reported that all balance and escapement parts came from NOMOS except the balance spring.
    excerpt: all the parts of this new balance and escapement come from Nomos.
    source: nomos-quillandpad-2014
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: ntn-hairspring-2014
    statement: The same 2014 article reported the blued balance spring was supplied from within Germany.
    excerpt: the blued balance spring, which is supplied from inside Germany (and not Switzerland)
    source: nomos-quillandpad-2014
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
