id: atelier-wen/perception-v3
brand: atelier-wen
model: Perception
generation: V3
notes: Handbook v0.2 §8 lists this record as "Atelier Wen — Perception V3".
claims:
  - id: awv3-pequignet
    statement: A specialist site reports the V3 uses the Pequignet EPM03, heavily customised for Atelier Wen.
    excerpt: the new iteration of the Perception is powered by the Pequignet EPM03, which Atelier Wen has heavily customized.
    source: ablogtowatch-atelier-wen-v3
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-pequignet-morteau
    statement: The same article describes Pequignet as an independent movement maker in Morteau, France.
    excerpt: One of the last independent movement manufactures in France, Pequignet is based in Morteau, near the Swiss border.
    source: ablogtowatch-atelier-wen-v3
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-movement-design
    statement: The article reports the movement's decoration was designed in collaboration with Pequignet to bring Chinese motifs to the bridges.
    excerpt: brought traditional Chinese design to the movement itself.
    source: ablogtowatch-atelier-wen-v3
    dimensions:
      - PD
      - CF
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-bridges
    statement: The article describes fan-shaped bridges filled with blue aventurine lacquer.
    excerpt: mirror-polished blue aventurine lacquer adorns each zephyr-like bridge
    source: ablogtowatch-atelier-wen-v3
    dimensions:
      - CF
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-dial-cheng
    statement: The article names Cheng Yucai, based in Xinmi, Henan, as the guilloché craftsman.
    excerpt: Master Cheng Yucai, a Master Guillocheur based in Xinmi, Henan province.
    source: ablogtowatch-atelier-wen-v3
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-dial-process
    statement: The article reports each dial is cut on a hand-operated rose engine and takes eight hours.
    excerpt: Using a diamond-tipped chisel on the hand-operated rose engine, each dial takes eight hours to complete
    source: ablogtowatch-atelier-wen-v3
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-dial-workshop
    statement: A second specialist site reports the dials are produced by the workshop of Cheng Yucai.
    excerpt: hand-guilloché dials produced by the workshop of Cheng Yucai, China's first guilloché master craftsman.
    source: monochrome-atelier-wen-v3
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-customised-calibre
    statement: The same site describes the movement as a highly customised Pequignet calibre.
    excerpt: a highly customised Pequignet calibre
    source: monochrome-atelier-wen-v3
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-case
    statement: The site lists a 40 mm 904L steel case, without naming the case maker.
    excerpt: The case is still made of 904L stainless steel, measuring 40mm in diameter.
    source: monochrome-atelier-wen-v3
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-bracelet
    statement: The site lists a tapering 904L steel bracelet, without naming its maker.
    excerpt: All Perception V3 models are worn on a 904L steel bracelet, tapering from 22mm at the lugs to 18mm at the clasp.
    source: monochrome-atelier-wen-v3
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: awv3-case-maker
    statement: The brand credits the V3 case and bracelet finish to a long-term collaboration with its case and bracelet maker.
    excerpt: This led us to a long-term collaboration with our case and bracelet maker to master a special micro-frosted finish that gives Yún a softer, more uniform appearance than traditional brushed surfaces.
    source: atelier-wen-perception-v3-journal
    dimensions:
      - EX
    date_checked: 2026-10-22
    editor: falk-index
  - id: awv3-epm03-bespoke
    statement: The brand says the EPM03 is a bespoke movement developed by Pequignet, which it highly customised for the V3.
    excerpt: EPM03 is a new bespoke movement developed by Pequignet, which we highly customised for Perception V3
    source: atelier-wen-perception-v3-journal
    dimensions:
      - MA
      - PD
    date_checked: 2026-10-22
    editor: falk-index
  - id: awv3-calibre-search
    statement: The brand says it searched for a calibre that left it the creative latitude to make the movement its own.
    excerpt: We spent a long time searching for the right calibre. Not just one with the right technical credentials, but one that gave us the creative latitude to make it entirely our own.
    source: atelier-wen-perception-v3-journal
    dimensions:
      - PD
    date_checked: 2026-10-22
    editor: falk-index
