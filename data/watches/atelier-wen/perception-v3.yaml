  - dimension: WE
    component: Assembly and regulation
    relationship: unknown
    note: No source found on where the V3 is cased, assembled or regulated. The brand's journal, its FAQ and specialist reviews (aBlogtoWatch, Monochrome, Time+Tide, Europa Star, Oracle of Time, The Hour Markers, Wrist Enthusiast) were checked.
    claims: []
  - dimension: WE
    component: Movement assembly
    performer: pequignet
    relationship: external_specialist
    note: Pequignet assembles its own movements, per a specialist article; this covers the movement, not casing of the watch.
