    status: published
    editor: falk-index
    change_note: "First evidenced profile, drafted with AI from secondary sources only. Changes from version 1: EX 0 \u2192 U; DH 0 \u2192 U; CF 0 \u2192 U; WE 2 \u2192 U; PD 4 \u2192 3; confidence A \u2192 D. 4 of 7 dimensions have no evidence, so confidence is D. Each score's rationale names its evidence."
    created_on: 2026-10-21
    scores:
      MA:
        value: 0
        rationale: The Mù uses the stock Peacock SL1588A. The customisation claim concerns the original Perception, not the Mù, so it is context only.
        evidence:
          - claim: awmu-sl1588a
            stance: supports
            note: Peacock SL1588A.
          - claim: awmu-peacock-customised
            stance: context
            note: About the original Perception.
      MM:
        value: 0
        rationale: The complete movement comes from Liaoning Peacock.
        evidence:
          - claim: awmu-sl1588a
            stance: supports
            note: External movement.
      EX:
        value: null
        rationale: A titanium case and bracelet are described, but no source names the maker.
        evidence:
          - claim: awmu-titanium
            stance: context
            note: Maker not named.
      DH:
        value: null
        rationale: The guilloché dial is credited to the external craftsman Cheng Yucai, and no source covers the hands. Internal dial work is therefore at most 2 if the hands turn out to be internal, and 0 otherwise. U until then.
        evidence:
          - claim: awmu-dial-cheng
            stance: context
            note: External dial craftsman.
          - claim: awmu-rose-engine
            stance: context
            note: Turned in Cheng's workshop.
      CF:
        value: null
        rationale: The defining craft, rose-engine guilloché, is done in Cheng's workshop, which does not count as internal craft. No source says who finishes the movement, so U rather than 0.
        evidence:
          - claim: awmu-rose-engine
            stance: context
            note: External craft.
          - claim: awmu-dial-hours
            stance: context
            note: Hours of external handwork.
      WE:
        value: null
        rationale: No source says where the Mù is assembled or regulated.
        evidence: []
      PD:
        value: 3
        rationale: The brand directs a bespoke guilloché dial and chose and customised a movement for its 3.3 mm thickness. That is substantial supplier-directed development; 4 would need proprietary technical systems.
        evidence:
          - claim: awmu-thinness
            stance: supports
            note: Movement chosen for thinness.
          - claim: awmu-peacock-customised
            stance: supports
            note: Customised movement.
    classification:
      - artisan_etablisseur
  - version: 3
    methodology: v0.2
    confidence: C
    independent_watchmaker: false
    status: draft
    editor: ai-draft
    change_note: "Adds the brand's own pages: the Mù launch journal, Perception production update #2 and the Perception V2 notes. Changes from version 2: DH U → 0; confidence D → C. Three of seven dimensions remain U (EX, CF, WE), and the scored ones rest mostly on primary sources."
    created_on: 2026-10-29
    scores:
      MA:
        value: 0
        rationale: The Mù uses Dandong's SL1588A. The brand says the SL-1588 is made exclusively for it with modifications, but Dandong builds it on its own SL1 base, so the architecture is external. Not 1, because no source credits Atelier Wen with movement engineering.
        evidence:
          - claim: awmu-sl1588a
            stance: supports
            note: Peacock SL1588A.
          - claim: awmu-sl1588-exclusive
            stance: supports
            note: A Dandong derivative made for the brand.
          - claim: awmu-peacock-customised
            stance: context
            note: About the original Perception.
      MM:
        value: 0
        rationale: The complete movement comes from Liaoning Peacock (Dandong), as both a review and the brand's own production update say.
        evidence:
          - claim: awmu-sl1588a
            stance: supports
            note: External movement.
          - claim: awmu-sl1588-exclusive
            stance: supports
            note: Made by Dandong.
      EX:
        value: null
        rationale: The brand describes titanium case parts and hand-finished bracelet chamfers but never names who makes or finishes them. U until a source names the case maker.
        evidence:
          - claim: awmu-journal-titanium
            stance: context
            note: Maker not named.
          - claim: awmu-titanium
            stance: context
            note: Maker not named.
          - claim: awmu-v2-bracelet
            stance: context
            note: Hand finishing, performer not named.
      DH:
        value: 0
        rationale: The brand's own Mù page puts the guilloché in Master Cheng's atelier, an external specialist, and its 2022 production update says Perception hands come from an outside supplier. Borderline on the hands, because that source predates the Mù; if Atelier Wen has since made hands itself, DH could reach 1. The PVD colouring is unattributed.
        evidence:
          - claim: awmu-journal-guilloche
            stance: supports
            note: External dial work, from the brand, for this watch.
          - claim: awmu-hands-supplier
            stance: supports
            note: External hands supplier for Perception.
          - claim: awmu-dial-cheng
            stance: supports
            note: External craftsman.
          - claim: awmu-journal-pvd
            stance: context
            note: Process named, performer not.
      CF:
        value: null
        rationale: The defining craft, rose-engine guilloché, is external. The brand describes movement decoration and hand-chamfered bracelet links without saying who does them, and Dandong engraves the bridges. Borderline between U and 0; U is kept because the finishing performer is undocumented rather than shown to be external.
        evidence:
          - claim: awmu-journal-guilloche
            stance: context
            note: External craft.
          - claim: awmu-v2-refinished
            stance: context
            note: Performer not named.
          - claim: awmu-dandong-engraving
            stance: context
            note: Engraving by Dandong.
          - claim: awmu-v2-bracelet
            stance: context
            note: Performer not named.
      WE:
        value: null
        rationale: No source says where the Mù is assembled or regulated. Testing with HRILI is external and does not establish assembly.
        evidence:
          - claim: awmu-hrili-testing
            stance: context
            note: External testing only.
      PD:
        value: 3
        rationale: The brand chose a movement for thinness, specified Dandong's modifications and engravings, and directs its dial and hands suppliers, down to switching hand suppliers for quality. That is substantial supplier-directed development; 4 would need proprietary technical systems.
        evidence:
          - claim: awmu-thinness
            stance: supports
            note: Movement chosen for thinness.
          - claim: awmu-sl1588-exclusive
            stance: supports
            note: Modifications specified for the brand.
          - claim: awmu-dandong-engraving
            stance: supports
            note: Directs supplier finishing.
          - claim: awmu-hands-supplier
            stance: supports
            note: Directs hands sourcing.
    classification:
      - artisan_etablisseur
