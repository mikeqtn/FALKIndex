id: atelier-wen/perception-mu
brand: atelier-wen
model: Perception Mù
notes: Handbook v0.2 §8 lists this record as "Atelier Wen — Perception Mù (SL1588A)".
claims:
  - id: awmu-sl1588a
    statement: A hands-on review reports the Mù uses caliber SL1588A made by the Liaoning Peacock Watch Company.
    excerpt: Made by the Liaoning Peacock Watch Company, the caliber SL1588A will simply be unfamiliar to many
    source: wornandwound-atelier-wen-mu
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: awmu-dial-cheng
    statement: The review quotes the brand crediting the dial to guilloché craftsman Cheng Yucai.
    excerpt: turned by China’s sole guilloche master craftsman, Cheng Yucai.
    source: wornandwound-atelier-wen-mu
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: awmu-rose-engine
    statement: The brand, as quoted in the review, says the dials are hand-turned on rose engines in Cheng's workshop.
    excerpt: hand turned on rose engines in the workshop of China’s sole guilloche master craftsman.
    source: wornandwound-atelier-wen-mu
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: awmu-not-stamped
    statement: The reviewer concludes the Mù dial is not stamped, while noting Cheng says he built his machines largely himself.
    excerpt: It’s clear, in other words, that the Mù’s dial is not stamped.
    source: wornandwound-atelier-wen-mu
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: awmu-titanium
    statement: The review describes a titanium case and bracelet, without naming the case maker.
    excerpt: one of the great attributes of this particular Perception is its lightweight titanium case and bracelet
    source: wornandwound-atelier-wen-mu
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: awmu-peacock-customised
    statement: A review of the original Perception (same platform) reports a customised Dandong Peacock self-winding movement.
    excerpt: The Perception is powered by a customised self-winding Dandong Peacock movement.
    source: deployant-atelier-wen-perception
    dimensions:
      - MA
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
  - id: awmu-thinness
    statement: The same review says the brand chose the movement for its 3.3 mm thickness.
    excerpt: Atelier Wen had notably selected the movement for its thinness, which is at 3.3mm.
    source: deployant-atelier-wen-perception
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
  - id: awmu-dial-hours
    statement: The same review reports each Perception dial takes about 8 hours of work by Master Cheng.
    excerpt: each dial requires approximately 8 man-hours of work.
    source: deployant-atelier-wen-perception
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
