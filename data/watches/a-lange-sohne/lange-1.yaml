    editor: ai-draft
    change_note: "First evidenced profile, drafted with AI from secondary sources only. Changes from version 1: MA 5 \u2192 4; MM 4 \u2192 3; EX 3 \u2192 0; DH 3 \u2192 U; CF 5 \u2192 4; WE 5 \u2192 3; PD 5 \u2192 U; confidence A \u2192 C; classification Integrated Manufacture \u2192 Independent Manufacture. Each score's rationale names its evidence. Not yet reviewed."
    created_on: 2026-10-21
    scores:
      MA:
        value: 4
        rationale: Specialist reporting describes the L121.1 with an in-house free-sprung balance and a three-quarter-plate layout. No source confirms the design work itself was internal, so this is 4 rather than 5.
        evidence:
          - claim: l1-free-sprung-balance
            stance: supports
            note: In-house free-sprung balance.
          - claim: l1-three-quarter-plate
            stance: supports
            note: Calibre layout.
      MM:
        value: 3
        rationale: The L121.1's free-sprung balance and balance spring are made in-house, from bought-in Nivarox alloy. The 2014 report of in-house parts machining and the hairspring history are brand-level, not about this calibre, so they are context. 4 would need a model-specific source on plates and wheels.
        evidence:
          - claim: l1-balance-spring-inhouse
            stance: supports
            note: Balance spring made in-house.
          - claim: l1-nivarox-alloy
            stance: context
            note: Raw alloy bought in.
          - claim: l1-parts-machinery
            stance: context
            note: General, not this calibre.
          - claim: l1-hairspring-since-2003
            stance: context
            note: Brand-level history.
      EX:
        value: 0
        rationale: A 2014 visit report says the case is one of the two elements Lange does not make itself. This rests on a single secondary source; the case maker, and whether it is a group company, is not disclosed.
        evidence:
          - claim: l1-dial-case-external
            stance: supports
            note: Case made outside Lange.
      DH:
        value: null
        rationale: The same report says the dial is made outside Lange, but no source covers the hands. U until the hands are attributed; it would be 0 if they are external too.
        evidence:
          - claim: l1-dial-case-external
            stance: context
            note: Dial external; hands not covered.
      CF:
        value: 4
        rationale: Every balance bridge is hand-engraved in-house, and the movement is finished at the manufacture. Engraving is the only craft operation the sources document, so this is 4 rather than 5.
        evidence:
          - claim: l1-engraved-bridge
            stance: supports
            note: Hand-engraved balance bridge.
          - claim: l1-engraved-cock-all
            stance: supports
            note: Every balance bridge engraved.
      WE:
        value: 3
        rationale: Movements are assembled twice, the second time into the finished watch. No claim mentions regulation or adjustment, which caps this at 3.
        evidence:
          - claim: l1-double-assembly
            stance: supports
            note: Systematic double assembly.
          - claim: l1-assembly-two-stages
            stance: supports
            note: Two-stage assembly into the watch.
      PD:
        value: null
        rationale: No collected source is about product development as such. The calibre design is credited under MA; U until a development source is added.
        evidence: []
    classification:
      - independent_manufacture
