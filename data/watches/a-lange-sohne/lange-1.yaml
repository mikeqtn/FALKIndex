  - version: 2
    methodology: v0.2
    confidence: C
    independent_watchmaker: false
    status: superseded
    is_seed: false
    editor: falk-index
    change_note: "First evidenced profile, drafted with AI from secondary sources only. Changes from version 1: MA 5 → 4; MM 4 → 3; EX 3 → 0; DH 3 → U; CF 5 → 4; WE 5 → 3; PD 5 → U; confidence A → C; classification Integrated Manufacture → Independent Manufacture. Each score's rationale names its evidence."
    created_on: 2026-10-21
    scores:
      MA:
        value: 4
        rationale: Specialist reporting describes the L121.1 with an in-house free-sprung balance and a three-quarter-plate layout. No source confirms the design work itself was internal, so this is 4 rather than 5.
        evidence:
          - claim: l1-free-sprung-balance
            stance: supports
            note: In-house free-sprung balance.
          - claim: l1-three-quarter-plate
            stance: supports
            note: Calibre layout.
      MM:
        value: 3
        rationale: The L121.1's free-sprung balance and balance spring are made in-house, from bought-in Nivarox alloy. The 2014 report of in-house parts machining and the hairspring history are brand-level, not about this calibre, so they are context. 4 would need a model-specific source on plates and wheels.
        evidence:
          - claim: l1-balance-spring-inhouse
            stance: supports
            note: Balance spring made in-house.
          - claim: l1-nivarox-alloy
            stance: context
            note: Raw alloy bought in.
          - claim: l1-parts-machinery
            stance: context
            note: General, not this calibre.
          - claim: l1-hairspring-since-2003
            stance: context
            note: Brand-level history.
      EX:
        value: 0
        rationale: A 2014 visit report says the case is one of the two elements Lange does not make itself. This rests on a single secondary source; the case maker, and whether it is a group company, is not disclosed.
        evidence:
          - claim: l1-dial-case-external
            stance: supports
            note: Case made outside Lange.
      DH:
        value: null
        rationale: The same report says the dial is made outside Lange, but no source covers the hands. U until the hands are attributed; it would be 0 if they are external too.
        evidence:
          - claim: l1-dial-case-external
            stance: context
            note: Dial external; hands not covered.
      CF:
        value: 4
        rationale: Every balance bridge is hand-engraved in-house, and the movement is finished at the manufacture. Engraving is the only craft operation the sources document, so this is 4 rather than 5.
        evidence:
          - claim: l1-engraved-bridge
            stance: supports
            note: Hand-engraved balance bridge.
          - claim: l1-engraved-cock-all
            stance: supports
            note: Every balance bridge engraved.
      WE:
        value: 3
        rationale: Movements are assembled twice, the second time into the finished watch. No claim mentions regulation or adjustment, which caps this at 3.
        evidence:
          - claim: l1-double-assembly
            stance: supports
            note: Systematic double assembly.
          - claim: l1-assembly-two-stages
            stance: supports
            note: Two-stage assembly into the watch.
      PD:
        value: null
        rationale: No collected source is about product development as such. The calibre design is credited under MA; U until a development source is added.
        evidence: []
    classification:
      - independent_manufacture
  - version: 3
    methodology: v0.2
    confidence: B
    independent_watchmaker: false
    status: published
    is_seed: false
    editor: falk-index
    change_note: "Adds Lange's own LANGE 1 page and manufacture-movements page as primary sources, a 2018 Time+Tide design feature and a 2025 SJX article on Lange dial making. Changes from version 2: MA 4 → 5; MM 3 → 4; PD U → 5; confidence C → B. One of seven dimensions remains U (DH)."
    created_on: 2026-11-17
    scores:
      MA:
        value: 5
        rationale: Lange states that every LANGE 1 model has a proprietary movement and that its manufacture movements are developed by its own calibre engineers, which supplies the internal-design evidence version 2 lacked. Its LANGE 1 page describes the outsize-date mechanism, two display elements in 66 parts, and specialist reporting covers the L121.1's free-sprung balance and three-quarter plate. The calibre-engineer statement is a universal definition, not specific to the L121.1, so it counts here under §5.
        evidence:
          - claim: l1-calibre-engineers
            stance: supports
            note: All Lange manufacture movements are developed by its calibre engineers.
          - claim: l1-proprietary-movement-page
            stance: supports
            note: Names the LANGE 1 family.
          - claim: l1-outsize-date-designed
            stance: supports
            note: Outsize-date display designed as two elements.
          - claim: l1-outsize-date-66-parts
            stance: supports
            note: 66-part calendar mechanism.
          - claim: l1-free-sprung-balance
            stance: supports
            note: In-house free-sprung balance.
          - claim: l1-three-quarter-plate
            stance: supports
            note: Calibre layout.
      MM:
        value: 4
        rationale: Lange's LANGE 1 page states that, with few exceptions, all movement parts are crafted in the manufacture, and the balance spring is made in-house from bought-in Nivarox alloy. That is most major components internal. Borderline with 5, which the in-house balance spring points toward; it stays 4 because the page leaves the exceptions unnamed and the alloy is bought in.
        evidence:
          - claim: l1-parts-few-exceptions
            stance: supports
            note: Nearly all movement parts made at the manufacture.
          - claim: l1-proprietary-movement-page
            stance: supports
            note: LANGE 1 movement manufactured in-house.
          - claim: l1-balance-spring-inhouse
            stance: supports
            note: Balance spring made in-house.
          - claim: l1-nivarox-alloy
            stance: context
            note: Raw alloy bought in.
          - claim: l1-parts-machinery
            stance: context
            note: In-house parts machining seen in 2014.
          - claim: l1-hairspring-since-2003
            stance: context
            note: Brand-level history.
      EX:
        value: 0
        rationale: A 2014 visit report says the case is one of the two elements Lange does not make itself. This rests on a single secondary source. The case maker, and whether it is a Richemont group company that could earn in-group credit, is not disclosed.
        evidence:
          - claim: l1-dial-case-external
            stance: supports
            note: Case made outside Lange.
      DH:
        value: null
        rationale: A 2014 visit report says the dial is made outside Lange, and a 2025 SJX article says Lange's in-house dial workshop covers enamel and engraved Handwerkskunst and limited pieces. Neither says who makes the standard solid-silver LANGE 1 dial, or whether that maker is in the Richemont group. No source covers the hands, so this stays U.
        evidence: []
      CF:
        value: 4
        rationale: Lange states that every manufacture calibre has a hand-engraved balance cock and decorated, polished surfaces and is finished by its watchmakers in Glashütte; specialist reports say the same. Engraving and movement finishing are the only craft operations the sources document, so this is 4 rather than 5.
        evidence:
          - claim: l1-hallmarks-all-calibres
            stance: supports
            note: Engraved balance cock and decorated surfaces on every calibre.
          - claim: l1-assembled-twice-primary
            stance: supports
            note: Every calibre finished by Lange's watchmakers.
          - claim: l1-engraved-bridge
            stance: supports
            note: Hand-engraved balance bridge.
          - claim: l1-engraved-cock-all
            stance: supports
            note: Every balance bridge engraved.
      WE:
        value: 3
        rationale: Lange states that every calibre is assembled twice, and a visit report describes the second assembly into the finished watch. No claim says Lange regulates or adjusts the LANGE 1, which caps this at 3 under §5.
        evidence:
          - claim: l1-assembled-twice-primary
            stance: supports
            note: Every calibre assembled twice.
          - claim: l1-double-assembly
            stance: supports
            note: Systematic double assembly.
          - claim: l1-assembly-two-stages
            stance: supports
            note: Two-stage assembly into the watch.
      PD:
        value: 5
        rationale: Lange states that its calibres are developed by its own calibre engineers. Its LANGE 1 page describes the outsize date, the watch's defining feature, as two designed display elements in a 66-part mechanism, and a dial layout built on the golden ratio. Time+Tide quotes Lange's Director of Manufacture on the Lange 1 dial rules and on the back and forth between movement and exterior design. The reading applied is that original engineering of the defining complication is level 5. Borderline with 4, because no source names a patent or invention.
        evidence:
          - claim: l1-calibre-engineers
            stance: supports
            note: Calibres developed by Lange's engineers.
          - claim: l1-outsize-date-designed
            stance: supports
            note: Outsize-date display designed by Lange.
          - claim: l1-outsize-date-66-parts
            stance: supports
            note: Engineering scale of the defining complication.
          - claim: l1-dial-layout-principles
            stance: supports
            note: Original dial layout for this model.
          - claim: l1-proprietary-movement-page
            stance: supports
            note: Proprietary movement in every LANGE 1.
          - claim: l1-tt-dial-rules
            stance: supports
            note: Lange-set design rules for Lange 1 dials.
          - claim: l1-tt-ping-pong
            stance: context
            note: Brand-wide development process.
    classification:
      - independent_manufacture
