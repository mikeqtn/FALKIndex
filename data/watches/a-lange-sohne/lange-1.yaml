id: a-lange-sohne/lange-1
brand: a-lange-sohne
model: Lange 1
notes: Handbook v0.2 §8 lists this record as "A. Lange & Söhne — Lange 1".
claims:
  - id: l1-free-sprung-balance
    statement: A specialist site reports that the L121.1 (2015) has an in-house free-sprung balance with adjustable rim weights.
    excerpt: To start with it has an in-house, free-sprung balance wheel, a feature that promises more stable timekeeping
    source: sjx-lange-1-2015
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-three-quarter-plate
    statement: The same article describes the L121.1 layout as a simplified three-quarter plate.
    excerpt: The new L121.1 is simplified visually, with a three quarter plate that has no plates set into it.
    source: sjx-lange-1-2015
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-balance-spring-inhouse
    statement: A specialist site describes the Lange 1 calibre L121.1 as having a balance spring made in-house, under a hand-engraved balance bridge.
    excerpt: a freely oscillating balance-spring crafted in-house
    source: worldtempus-lange-1-four-models
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-engraved-bridge
    statement: The same article states the balance sits beneath a hand-engraved balance bridge.
    excerpt: beneath a hand-engraved balance bridge
    source: worldtempus-lange-1-four-models
    dimensions:
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-double-assembly
    statement: The article describes systematic double assembly of movements as a Lange manufacture practice.
    excerpt: This systematic double movement assembly procedure is a specific characteristic of the Manufacture A. Lange & Söhne.
    source: worldtempus-lange-1-four-models
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-hairspring-since-2003
    statement: A specialist site reports that Lange has made hairsprings at its Glashütte manufacture since 2003.
    excerpt: Since 2003, starting with the Double Split, Lange has been making hairsprings in its manufacture in Glashütte.
    source: sjx-lange-hairsprings
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-nivarox-alloy
    statement: The same article reports that the raw hairspring alloy is Nivarox, bought from a supplier, then drawn, rolled, coiled and tempered by Lange.
    excerpt: The hairspring begins with the raw Nivarox alloy which Lange buys from a supplier (below).
    source: sjx-lange-hairsprings
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-dial-case-external
    statement: A 2014 manufacture visit report (in Polish) states that the dial and case are the two elements Lange does not make itself.
    excerpt: (dwoma elementami, których Lange nie wykonuje we własnym zakresie)
    source: ch24-lange-road-trip
    dimensions:
      - DH
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-parts-machinery
    statement: The same report describes a machine park producing individual movement parts at the manufacture.
    excerpt: przez park maszyn wytwarzających poszczególne części
    source: ch24-lange-road-trip
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-engraved-cock-all
    statement: The report states every balance in a Lange watch receives a hand-engraved bridge.
    excerpt: każdy balans tykający w zegarku z logo marki otrzymuje ręcznie grawerowany mostek.
    source: ch24-lange-road-trip
    dimensions:
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: l1-assembly-two-stages
    statement: The report states movement assembly at Lange has two stages, the second into the finished watch with dial and case.
    excerpt: W Lange montaż ten ma dwa etapy.
    source: ch24-lange-road-trip
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
