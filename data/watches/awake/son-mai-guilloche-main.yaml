    source: awake-guilloche-main-alba
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-13
    editor: ai-draft
  - id: aw-gm-hanoi
    statement: The dial is sent to Hanoi for Sơn Mài lacquer.
    excerpt: the dial is sent to Hanoi, where it is elevated through the application of Son Mài lacquer
    source: awake-guilloche-main-alba
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-13
    editor: ai-draft
  - id: aw-gm-lacquer-workshop
    statement: The lacquer is applied by a partner workshop in Vietnam.
