  - id: aw-gm-renzetti
    statement: The hand guilloché dials are made by the Renzetti family workshop in Italy.
    excerpt: we collaborate with the Renzetti family, one of the last European workshops dedicated to Guilloché Main
    source: awake-guilloche-main-alba
    dimensions:
      - DH
      - CF
      - PD
    date_checked: 2026-10-13
    editor: ai-draft
  - id: aw-gm-italy
    statement: The guilloché is cut in Italy on a hand-guided rose engine.
