    statement: The Guilloché Main uses the La Joux-Perret G101 automatic movement.
    excerpt: the G101 automatic movement from the Swiss manufacture La Joux-Perret
    source: awake-guilloche-main-alba
    dimensions:
      - MA
      - MM
