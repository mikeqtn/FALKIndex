id: laine/p37
brand: laine
model: P37
notes: Handbook v0.2 §8 lists this record as "Laine — P37".
provenance:
  - dimension: MA
    component: Base gear train (Peseux 7001)
    performer: eta
    relationship: external_specialist
    note: The Peseux 7001 is an ETA caliber; the P37 keeps its gear train and layout.
    claims:
      - lp37-peseux-base
      - lp37-structural-parts
      - lp37-decoration-not-manufacture
  - dimension: MM
    component: Bridges, screws and gears
    performer: laine
    relationship: internal
    note: Maker says bridges and screws are in-house; in interview Laine says "we do all the gears".
    claims:
      - lp37-peseux-base
      - lp37-structural-parts
      - lp37-gears
  - dimension: MM
    component: Base movement components (escapement, balance, hairspring, mainspring)
    performer: eta
    relationship: external_specialist
    note: Not stated explicitly; inferred from the Peseux 7001 base. Needs confirmation.
    claims:
      - lp37-peseux-base
  - dimension: EX
    component: Case (polished steel, 37 mm)
    relationship: unknown
    note: The P37 case maker is not named. The about page shows some case machining in the workshop, but not for this model; a 2018 report says an earlier Laine model's case was produced externally, and a 2024 quote says the workshop buys no services, which does not settle who makes the case.
    claims:
      - lp37-case
      - lp37-case-workshop
      - lp37-classic-chrono-case-outsourced
      - lp37-no-services
  - dimension: DH
    component: Guilloché dial
    performer: laine
    relationship: internal
    claims:
      - lp37-guilloche-dial
      - lp37-peseux-base
  - dimension: DH
    component: Hands
    performer: laine
    relationship: internal
    claims:
      - lp37-hands
  - dimension: CF
    component: Movement finishing (guilloché bridge, black polish, hand chamfering)
    performer: laine
    relationship: internal
    claims:
      - lp37-movement-finish
      - lp37-gears
      - lp37-atelier-role
  - dimension: WE
    component: Assembly and regulation
    performer: laine
    relationship: internal
    note: A 2023 workshop visit shows a final-assembly bench in the atelier, and Laine is quoted saying the workshop buys no services. Neither names the P37, and no source describes its regulation.
    claims:
      - lp37-final-assembly-bench
      - lp37-no-services
  - dimension: PD
    component: Design and technical development
    performer: laine
    relationship: internal
    claims:
      - lp37-atelier-role
claims:
  - id: lp37-peseux-base
    statement: The maker says the P37 is based on the gear train of the Peseux 7001, with its own bridges, screws, dials and hands.
    excerpt: Laine P37 is based on the gear train of classic Peseux 7001 movement, with in-house bridges, screws, dials, hands and considerable amount of black polishing unheard of in this price category.
    source: laine-p37-page
    dimensions:
      - MA
      - MM
      - DH
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-structural-parts
    statement: A review reports that the 7001 layout is kept but nearly all structural components are replaced with parts made and decorated by Laine.
    excerpt: The architecture is clearly recognisable as a Peseux 7001 , but nearly all the structural components have been replaced for in-house manufactured and decorated ones.
    source: timeandtide-laine-p37
    dimensions:
      - MA
      - MM
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-gears
    statement: In an interview, Torsti Laine says the original bridges are discarded and the gears are made by the workshop.
    excerpt: “We throw away all the bridges … we do all the gears … the black polished pieces …”
    source: calibratedwrist-torsti-laine
    dimensions:
      - MM
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-hands
    statement: The maker says the hands are made in-house from 0.2 mm steel plate, filed by hand and polished.
    excerpt: Vintage syringe inspired hands are made from steel by us, cut from 0.2mm steel plate, then filed by hand to have a round profile and polished to mirror polish.
    source: laine-p37-page
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-guilloche-dial
    statement: The maker says the dial guilloché is cut in-house on a hand-operated guilloché machine.
    excerpt: Diamond guilloche pattern cut by hand operated 110 years old guilloche machine, in-house of course.
    source: laine-p37-page
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-movement-finish
    statement: The maker describes a guilloché bridge, two black-polished steel bridges, 17 hand-polished steel parts and hand-finished internal angles.
    excerpt: Internal sharp angles, like all chamfering are done by hand.
    source: laine-p37-page
    dimensions:
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-atelier-role
    statement: A specialist site reports that Torsti Laine remains directly involved in technical development, guilloché and finishing at the atelier.
    excerpt: Laine Watches is an independent watchmaking atelier founded in 2016 by Finnish watchmaker Torsti Laine, who remains directly involved in technical development, guilloché, and finishing while directing the atelier.
    source: monochrome-laine-10th
    dimensions:
      - PD
      - CF
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-decoration-not-manufacture
    statement: A specialist site characterises Laine's focus as movement decoration rather than movement manufacturing.
    excerpt: with its focus on finishing, movement decoration (not manufacturing), and highly respectable guillochage skills
    source: monochrome-laine-10th
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-case
    statement: The maker lists a polished stainless steel case, 37 mm by 8 mm, without naming its maker.
    excerpt: Polished stainless steel, diameter 37 mm, lug width 18 mm, buckle 16mm, thickness 8 mm.
    source: laine-p37-page
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-case-workshop
    statement: The maker's about page shows case-making work in the workshop (milling and drilling a case back), not tied to a specific model.
    excerpt: Case making_ Milling and drilling the case back
    source: laine-about
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: lp37-final-assembly-bench
    statement: A workshop-visit report by Independent in Time, a Laine retailer, shows a bench for final assembly in Torsti Laine's atelier, without tying it to a specific model.
    excerpt: Torsti’s bench for final assembly, with the Positive pressure mechanism above to aid in keeping dust from the insides of watches!
    source: independentintime-laine-dec-2023
    dimensions:
      - WE
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: lp37-no-services
    statement: A 2024 article by The 1916 Company, a retailer, quotes Torsti Laine saying the workshop buys no services and does everything itself.
    excerpt: We don’t buy any services. It’s faster than and more cost-efficient for us to do everything.
    source: the1916company-laine-week-on-wrist
    dimensions:
      - WE
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: lp37-classic-chrono-case-outsourced
    statement: A 2018 Monochrome article reports that the case of the Laine Classic Chronograph, an earlier model, was designed by Torsti Laine but produced externally.
    excerpt: The case is designed by Torsti, but the production is outsourced, something that is not uncommon for smaller brands to do considering the high cost to produce a case on your own.
    source: monochrome-laine-classic-chronograph
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
