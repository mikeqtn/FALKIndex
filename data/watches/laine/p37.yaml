    scores:
      MA:
        value: 2
        rationale: The P37 keeps the Peseux 7001 gear train and layout but replaces nearly all structural parts with Laine's own. That is meaningful modification rather than re-engineered architecture; borderline with 3.
        evidence:
          - claim: lp37-peseux-base
            stance: supports
            note: Peseux 7001 gear train.
          - claim: lp37-structural-parts
            stance: supports
            note: Own structural parts.
          - claim: lp37-decoration-not-manufacture
            stance: context
            note: Focus on decoration.
      MM:
        value: 3
        rationale: Laine makes the bridges, screws and gears in-house. The escapement, balance and springs are presumably from the base, though no source says so explicitly.
        evidence:
          - claim: lp37-peseux-base
            stance: supports
            note: Own bridges and screws.
          - claim: lp37-gears
            stance: supports
            note: Gears made in-house.
          - claim: lp37-structural-parts
            stance: supports
            note: Own structural parts.
      EX:
        value: null
        rationale: No source names the P37 case maker. The workshop shows some case machining, but not for this model.
        evidence:
          - claim: lp37-case
            stance: context
            note: Maker not named.
          - claim: lp37-case-workshop
            stance: context
            note: Not tied to this model.
      DH:
        value: 4
        rationale: The dial guilloché is cut in-house on a hand-operated machine, and the hands are made in-house from steel plate, filed by hand and polished. Both processes are deeply internal. Not 5, because no source covers the dial blank or printing.
        evidence:
          - claim: lp37-guilloche-dial
            stance: supports
            note: In-house guilloché.
          - claim: lp37-hands
            stance: supports
            note: Hands made in-house.
          - claim: lp37-peseux-base
            stance: supports
            note: Own dials and hands.
      CF:
        value: 5
        rationale: A guilloché bridge, black-polished steel bridges, 17 hand-polished steel parts and hand-finished internal angles, with Torsti Laine himself doing guilloché and finishing. Master-level craft defines the watch.
        evidence:
          - claim: lp37-movement-finish
            stance: supports
            note: Movement finishing.
          - claim: lp37-guilloche-dial
            stance: supports
            note: Guilloché.
          - claim: lp37-hands
            stance: supports
            note: Hand-filed hands.
          - claim: lp37-atelier-role
            stance: supports
            note: Laine's own handwork.
      WE:
        value: null
        rationale: No source describes who assembles and regulates the P37.
        evidence: []
      PD:
        value: 3
        rationale: Laine is directly involved in technical development and designs his own bridges and gears around a conventional gear train. That is bespoke components rather than proprietary systems.
        evidence:
          - claim: lp37-atelier-role
            stance: supports
            note: Technical development.
    classification:
      - artisan_atelier
