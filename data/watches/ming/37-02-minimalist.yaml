id: ming/37-02-minimalist
brand: ming
model: 37.02 Minimalist
notes: Handbook v0.2 §8 lists this record as "MING — 37.02 Minimalist".
claims:
  - id: ming3702-sw300
    statement: A specialist site reports the movement is a customised Sellita SW300-1.
    excerpt: Inside, we find a custom version of the Sellita SW300-1 automatic
    source: monochrome-ming-37-02
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-anthracite
    statement: The same source reports the bridges and plates have an anthracite coating.
    excerpt: All the bridges and plates have been finished with an anthracite coating
    source: monochrome-ming-37-02
    dimensions:
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-rotor
    statement: The same source describes a bespoke openworked rotor.
    excerpt: The bespoke openworked rotor has a subtle brushed finish on the weighted outer edge
    source: monochrome-ming-37-02
    dimensions:
      - MM
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-sapphire-dial
    statement: The same source describes a sapphire dial with liquid-filled luminous indices.
    excerpt: The sapphire crystal dial has a special inset of liquid-filled Polar White luminous indices.
    source: monochrome-ming-37-02
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-sw300m1
    statement: A review describes the SW300.M1 as having skeletonised anthracite bridges and a customised rotor.
    excerpt: The SW300.M1 automatic movement features anthracite skeletonised bridges and a customized rotor.
    source: oracleoftime-ming-37-02
    dimensions:
      - MM
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-internal-design
    statement: The review says the 37.02 is the first MING watch designed, engineered and managed internally by Horologer Ming SA.
    excerpt: it’s the first to be designed, engineered, and managed internally by Horologer Ming SA, Ming’s new Swiss entity.
    source: oracleoftime-ming-37-02
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-case
    statement: The review lists a 38 mm stainless steel case, without naming its maker.
    excerpt: "Case: 38mm diameter x 11mm thickness, stainless steel"
    source: oracleoftime-ming-37-02
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-lume
    statement: A trade publication reports MING developed a proprietary luminous material after moving work internally.
    excerpt: Since moving efforts internally, it has finally managed to develop a proprietary luminous material
    source: europastar-ming-37-02
    dimensions:
      - DH
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-laser-dial
    statement: The same publication reports the dial markings are laser-cut channels in the sapphire dial.
    excerpt: All dial markings are in fact laser cut channels in the sapphire dial
    source: europastar-ming-37-02
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-assembly
    statement: The same publication reports component sourcing is unchanged and the watches are assembled in Switzerland.
    excerpt: Nevertheless, component sourcing remains unchanged, and these watches are still assembled in Switzerland.
    source: europastar-ming-37-02
    dimensions:
      - WE
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: ming3702-swiss-made
    statement: The same publication reports watches produced by Horologer Ming SA in La Chaux-de-Fonds are not eligible for 'Swiss Made'.
    excerpt: watches produced by Horologer Ming SA in La Chaux-de-Fonds, Switzerland are not eligible for a 'Swiss Made' mark.
    source: europastar-ming-37-02
    dimensions:
      - WE
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
