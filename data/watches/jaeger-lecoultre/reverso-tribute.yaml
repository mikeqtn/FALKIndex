id: jaeger-lecoultre/reverso-tribute
brand: jaeger-lecoultre
model: Reverso Tribute
notes: Handbook v0.2 §8 lists this record as "Jaeger-LeCoultre — Reverso Tribute".
provenance:
  - dimension: MA
    component: Movement design (Calibres 822 and 854)
    performer: jaeger-lecoultre
    relationship: internal
    note: The Reverso Tribute line uses several calibres; 822 (Monoface Small Seconds) and 854 (Duoface Small Seconds) are documented here.
    claims:
      - jlcrt-822-inhouse
      - jlcrt-854-inhouse
  - dimension: MM
    component: Movement production
    performer: jaeger-lecoultre
    relationship: internal
    claims:
      - jlcrt-822-inhouse
      - jlcrt-854-inhouse
  - dimension: EX
    component: Reverso case
    performer: jaeger-lecoultre
    relationship: internal
    note: Secondary source from 2012, about the Grande Reverso; no current source specific to the Tribute names the case maker.
    claims:
      - jlcrt-cases-made
  - dimension: EX
    component: Milanese bracelet (Monoface pink gold)
    relationship: unknown
    note: Process described by the brand; where it is made is not stated. A 2019 manufacture-tour report says Jaeger-LeCoultre makes its own bracelets, but does not name this bracelet.
    claims:
      - jlcrt-milanese
      - jlcrt-naas-own-dials
  - dimension: DH
    component: Dial and applied indexes
    relationship: unknown
    note: The brand describes the dial process but does not say whether the standard Tribute dials are made in-house. A 2019 manufacture-tour report says Jaeger-LeCoultre makes its own dials, with rooms for cutting, polishing, plating and piercing them, but it does not name the Tribute.
    claims:
      - jlcrt-dial-indexes
      - jlcrt-naas-own-dials
      - jlcrt-naas-dial-rooms
  - dimension: DH
    component: Guilloché Grand Feu enamel dial (Reverso Tribute Enamel Turner series)
    performer: jaeger-lecoultre
    relationship: internal
