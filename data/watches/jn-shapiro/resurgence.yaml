  - version: 2
    methodology: v0.2
    confidence: B
    independent_watchmaker: true
    status: published
    editor: mikeqtn
    change_note: "First evidenced profile, from the maker's page and two specialist articles. Scores unchanged. Confidence proposed A → B: the maker's primary statement is general, and component-level detail, the hairspring source and the watchmaking staff come from secondary sources. Hands, assembly and regulation are not described directly by any source. Reviewed and approved by mikeqtn on 2026-10-14."
    created_on: 2026-10-13
    scores:
      MA:
        value: 5
        rationale: The caliber is the brand's own design, and its Cubist bridge layout was completed by a watchmaker in the workshop. Three movement designs are offered. No source names an outside engineering partner, so the architecture is credited as substantially mastered internally.
        evidence:
          - claim: jns-res-own-calibre
            stance: supports
            note: Establishes the caliber as the brand's own design rather than a modified base movement.
          - claim: jns-res-cubist-bridge
            stance: supports
            note: Names an in-house watchmaker as the designer of a bridge layout.
          - claim: jns-res-movement-options
            stance: context
            note: Three proprietary movement variants, all free-sprung.
      MM:
        value: 5
        rationale: "Wheels, pinions, balance, screws and power fork are made in the workshop, and the maker says every component except jewels and springs is its own. Borderline: level 5 asks for difficult regulating and escapement components, and the hairspring, the hardest of them, is bought flat from Precision Engineering. It stays at 5 because the balance and escapement parts are made in-house and the overcoil is formed in the workshop; a reviewer may reasonably argue for 4."
        evidence:
          - claim: jns-res-components-in-house
            stance: supports
            note: Primary statement covering every component except jewels and springs.
          - claim: jns-res-movement-parts-listed
            stance: supports
            note: Names the balance, pinions and power fork, which are difficult regulating and escapement parts.
          - claim: jns-res-only-hairspring-bought
            stance: supports
            note: Confirms the hairspring is the only bought-in part of that group.
          - claim: jns-res-hairspring-supplier
            stance: contradicts
            note: The hairspring is external, which is the main argument against level 5.
      EX:
        value: 5
        rationale: The maker's statement covers all case components, and the case band is engine-turned on the workshop's own rose engine. The watch has no bracelet, so the case, crown and lugs make up the exterior. The score relies on the general statement for the crown and crystal.
        evidence:
          - claim: jns-res-components-in-house
            stance: supports
            note: Primary statement covering the case components.
          - claim: jns-res-case-rose-engine
            stance: supports
            note: Shows case work done on in-house machines.
      DH:
        value: 5
        rationale: The dial is assembled from separate metal layers that are each engine-turned and milled in the workshop, and engine-turning is the brand's founding craft. Hands are covered only by the maker's general statement; if a source showed them to be bought in, DH would drop to 4.
        evidence:
          - claim: jns-res-dial-layers
            stance: supports
            note: Describes in-house dial fabrication in detail.
          - claim: jns-res-engine-turning-machines
            stance: supports
            note: Seven engine-turning machines in the workshop.
          - claim: jns-res-components-in-house
            stance: supports
            note: The only evidence covering the hands.
      CF:
        value: 5
        rationale: Engine-turning of dial and case, hand engraving of the movement and anglage are all done by named workshop staff on the workshop's own machines, and they define the watch's appearance.
        evidence:
          - claim: jns-res-engine-turning-machines
            stance: supports
            note: In-house engine-turning capacity.
          - claim: jns-res-anglage-staff
            stance: supports
            note: Anglage and engraving done by watchmakers on staff.
          - claim: jns-res-movement-options
            stance: supports
            note: The movements are hand-engraved.
          - claim: jns-res-dial-layers
            stance: supports
            note: Dial engine-turning is internal craft, not bought-in decoration.
      WE:
        value: 5
        rationale: Five full-time watchmakers work on the Resurgence and form the hairspring overcoils, which is regulation-level work. No source describes assembly, adjustment or testing directly, so this score rests on inference and should be the first one checked with the maker.
        evidence:
          - claim: jns-res-five-watchmakers
            stance: supports
            note: A dedicated watchmaking team on this model.
          - claim: jns-res-overcoils-in-house
            stance: supports
            note: Overcoil forming is part of regulating the movement.
      PD:
        value: 5
        rationale: The brand designed its own caliber and bridge layout, and makes the case and dial in-house; the watch is an original technical development from end to end.
        evidence:
          - claim: jns-res-own-calibre
            stance: supports
            note: Original caliber development.
          - claim: jns-res-cubist-bridge
            stance: supports
            note: Original movement design work by staff.
    classification:
      - integrated_manufacture
