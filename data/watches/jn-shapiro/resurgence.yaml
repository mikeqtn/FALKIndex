      - EX
      - DH
    date_checked: 2026-10-13
    editor: ai-draft
  - id: jns-res-dial-layers
    statement: The dial is built from separate metal layers, each engine-turned, trimmed and milled to fit.
    excerpt: Each layer is a different piece of metal, engine-turned separately, trimmed and painstakingly milled for a perfect fit.
    source: jn-shapiro-watches
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-13
    editor: ai-draft
  - id: jns-res-movement-options
