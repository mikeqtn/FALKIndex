    change_note: First evidenced profile. EX changed 0 → U (no source names the case maker). Independent watchmaker descriptor proposed (Josh Shapiro engine-turns every dial himself). WE kept at 3 on inference. The record mixes two movement routes and should probably be split.
    created_on: 2026-10-13
    scores:
      MA:
        value: 0
        rationale: "Both routes use a stock caliber from a movement maker: the UWD 33.1 and, on the Radiant, the La Joux-Perret 5000-4. No source describes modification beyond decoration."
        evidence:
          - claim: jns-inf-uwd-caliber
            stance: supports
            note: Stock caliber.
          - claim: jns-inf-radiant-ljp
            stance: supports
            note: Stock caliber on the Radiant.
      MM:
        value: 0
        rationale: The complete movement is bought in; the maker says it pairs its work with partner movements.
        evidence:
          - claim: jns-inf-partner-movements
            stance: supports
            note: Primary statement that movements come from partners.
          - claim: jns-inf-uwd
            stance: supports
            note: Names the movement maker.
      EX:
        value: null
        rationale: No source names the case maker or says the case is bought in. The handbook scored 0; under "Unknown is not zero" this becomes U until the case source is found.
        evidence: []
      DH:
        value: 5
        rationale: Josh Shapiro engine-turns every dial himself, around 150 hours each, including the patented Infinity Weave. Hands are finished by hand, though who does it is not stated. The dial is the defining internal manufacture of the watch.
        evidence:
          - claim: jns-inf-own-guilloche
            stance: supports
            note: All engine-turning is done by Shapiro.
          - claim: jns-inf-dial-hours
            stance: supports
            note: Depth of dial production.
          - claim: jns-inf-weave
            stance: supports
            note: Primary statement on the dial work.
          - claim: jns-inf-hands
            stance: context
            note: Hand finishing of hands; maker not named.
      CF:
        value: 5
        rationale: Master-level engine-turning by Shapiro defines the watch, and a staff engraver decorates the movement. Both are internal.
        evidence:
          - claim: jns-inf-own-guilloche
            stance: supports
            note: Defining craft performed by the watchmaker himself.
          - claim: jns-inf-engraver
            stance: supports
            note: Movement engraving done by a staff member.
      WE:
        value: 3
        rationale: Movement engraving by a staff watchmaker implies the movement is stripped, decorated and reassembled in the workshop. No source describes casing, regulation or testing, so this rests on inference.
        evidence:
          - claim: jns-inf-engraver
            stance: supports
            note: Engraving requires in-house disassembly and reassembly.
      PD:
        value: 3
        rationale: Original dial design, including a patented engine-turning pattern, around a conventional supplier movement.
        evidence:
          - claim: jns-inf-weave
            stance: supports
            note: Bespoke dial patterns.
    classification:
      - artisan_atelier
