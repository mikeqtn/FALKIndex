notes: 'Handbook v0.2 §8 lists this record as "J.N. Shapiro — Infinity Series". Split on 2026-10-14: this record is the Infinity with the UWD 33.1 (SJX, 2019); the Infinity Radiant (La Joux-Perret 5000-4) is jn-shapiro/infinity-radiant.'
