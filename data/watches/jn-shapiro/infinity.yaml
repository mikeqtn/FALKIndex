    dimensions:
      - DH
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: jns-inf-engraver
    statement: A watchmaker specialising in engraved movements works for the brand and engraved the movement plate.
    excerpt: a Russian watchmaker who specialises in skeletonised, engraved movements and now works for Josh.
    source: sjx-jn-shapiro-infinity
    dimensions:
      - CF
      - WE
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: jns-inf-about-tantalum-cases
    statement: Joshua Shapiro says that in December 2021 the brand produced tantalum watch cases for the Infinity Series, the first made outside Switzerland.
    excerpt: we produced the first tantalum wrist watch cases made outside of Switzerland for the Infinity Series
    source: jns-about-page
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: jns-inf-sjx-tantalum-in-house
    statement: An SJX launch article on the Infinity Tantalum reports that both its case and chapter ring are produced in-house.
    excerpt: the challenge of fabricating tantalum parts makes it a laudable achievement that both the case and chapter ring are produced in house
    source: sjx-jn-shapiro-infinity-tantalum
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: jns-inf-sjx-tantalum-uwd
    statement: SJX reports that the Infinity Tantalum uses the same UWD 33.1 as the maker's other watches.
    excerpt: The Infinity Tantalum is powered by the same UWD 33.1 found in Mr Shapiro’s other watches.
    source: sjx-jn-shapiro-infinity-tantalum
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: jns-inf-tt-tantalum-in-house
    statement: A Time+Tide launch article reports that the maker fabricates the Infinity Tantalum's case in-house.
    excerpt: has become the first manufacturer outside of Switzerland to fabricate a tantalum case in-house
    source: timeandtide-jn-shapiro-infinity-tantalum
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: jns-inf-ww-cases-in-house
    statement: A Worn & Wound launch article reports that the maker has made the cases, and tantalum dial components, for the new Infinity Series watches in-house.
    excerpt: Shapiro has made cases (and tantalum dial components) for the new watches in the Infinity Series in-house
    source: wornandwound-jn-shapiro-infinity-tantalum
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: jns-inf-ww-tantalum-uwd
    statement: Worn & Wound reports that the tantalum case of the new Infinity Series watches houses the UWD Caliber 33.1.
    excerpt: That tantalum case used for each of the new watches in the Infinity Series measures 39mm in diameter, and houses the UWD Caliber 33.1
    source: wornandwound-jn-shapiro-infinity-tantalum
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: jns-inf-case-options
    statement: SJX (2019) reports that the maker offers case and dial colour options and that the watch reviewed has a rose gold case.
    excerpt: Though Josh offers a variety of options for the case and dial colours, this watch hews closely to the prototype, with a rose gold case
    source: sjx-jn-shapiro-infinity
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
