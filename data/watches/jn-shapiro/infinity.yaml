    dimensions:
      - MA
      - MM
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: jns-inf-radiant-ljp
    statement: The Infinity Radiant uses the La Joux-Perret 5000-4.
    excerpt: At the heart of the Infinity Radiant is the La Joux-Perret 5000-4,
    source: jns-infinity-page
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: jns-inf-partner-movements
    statement: The maker states that Infinity movements come from partners.
    excerpt: we pair our work with movements from partners whose standards match our own
    source: jns-infinity-page
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: jns-inf-own-guilloche
    statement: Josh Shapiro does all of the engine-turning himself.
    excerpt: Josh does all of his own guillochage
    source: sjx-jn-shapiro-infinity
    dimensions:
      - DH
      - CF
      - PD
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: jns-inf-dial-hours
    statement: Each dial takes about 150 hours from production to decoration.
    excerpt: From production to decoration, it takes about 150 hours just to finish the dial
    source: sjx-jn-shapiro-infinity
    dimensions:
      - DH
      - CF
      - PD
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: jns-inf-weave
    statement: The Basket and Infinity Weave patterns are engine-turned directly into the dial.
    excerpt: Each Basket and Infinity Weave pattern is painstakingly engine-turned into the zirconium dial
    source: jns-infinity-page
    dimensions:
      - DH
      - CF
      - PD
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: jns-inf-hands
    statement: Hand blanks are laser-cut, then rounded, polished and blued by hand.
