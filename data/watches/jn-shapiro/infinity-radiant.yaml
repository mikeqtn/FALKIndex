    source: jns-infinity-page
    dimensions:
      - DH
      - CF
      - PD
    date_checked: 2026-10-13
    editor: falk-index
  - id: jns-rad-our-weave
    statement: The maker engine-turns its signature Infinity Weave directly into the dial metal.
    excerpt: engine-turning our signature Infinity Weave directly onto the surface of the metal itself
    source: jns-infinity-page
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-13
    editor: falk-index
  - id: jns-rad-hands
    statement: The hands are sculpted in three dimensions.
