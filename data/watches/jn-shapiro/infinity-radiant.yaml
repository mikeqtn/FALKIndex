id: jn-shapiro/infinity-radiant
brand: jn-shapiro
model: Infinity Radiant
caliber: La Joux-Perret 5000-4
notes: Split from the handbook's "Infinity Series" record on 2026-10-14. Evidence so far is the maker's Infinity Series page only.
claims:
  - id: jns-rad-ljp
    statement: The Infinity Radiant uses the La Joux-Perret 5000-4.
    excerpt: At the heart of the Infinity Radiant is the La Joux-Perret 5000-4,
    source: jns-infinity-page
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-13
    editor: falk-index
  - id: jns-rad-partner-movements
    statement: The maker states that Infinity movements come from partners.
    excerpt: we pair our work with movements from partners whose standards match our own
    source: jns-infinity-page
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-13
    editor: falk-index
  - id: jns-rad-weave
    statement: The Basket and Infinity Weave patterns are engine-turned into the zirconium dial.
