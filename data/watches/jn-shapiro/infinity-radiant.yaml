    dimensions:
      - DH
    date_checked: 2026-10-13
    editor: falk-index
  - id: jns-rad-case-in-house
    statement: A Revolution article on the Radiant reports that its tantalum case is made in-house.
    excerpt: The tantalum case is made in-house and measures 38mm x 9.6mm including crystal
    source: revolution-jn-shapiro-radiant
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
  - id: jns-rad-tantalum-cases-2021
    statement: Joshua Shapiro says that in December 2021 the brand produced tantalum watch cases for the Infinity Series, the first made outside Switzerland.
    excerpt: we produced the first tantalum wrist watch cases made outside of Switzerland for the Infinity Series
    source: jns-about-page
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
  - id: jns-rad-bracelet-ming
    statement: On the maker's Radiant page, the optional bracelet details are followed by a note that it was engineered in collaboration with MING for the Alternative Horological Alliance.
    excerpt: Engineered in collaboration with Horologer MING for the Alternative Horological Alliance
    source: jns-infinity-page
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
  - id: jns-rad-service
