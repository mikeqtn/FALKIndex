    change_note: "Adds Revolution's launch article on the Radiant (2026), the maker's About page and its Service page, and the bracelet note on the maker's Infinity Series page. Changes from version 1: EX U → 2. Confidence stays C: EX rests on a secondary source, since the maker's own tantalum-case statement does not name the Radiant. One of seven dimensions remains U (WE)."
    scores:
      MA:
        value: 0
        rationale: Stock La Joux-Perret 5000-4 caliber (jns-rad-ljp). No source describes modification beyond the movement's livery, so the score is not higher.
        evidence:
          - claim: jns-rad-ljp
            stance: supports
            note: Names the stock caliber.
      MM:
        value: 0
        rationale: The complete movement is bought in; the maker says it pairs its work with partner movements (jns-rad-partner-movements) and names La Joux-Perret as the caliber maker (jns-rad-ljp).
        evidence:
          - claim: jns-rad-partner-movements
            stance: supports
            note: Primary statement that movements come from partners.
          - claim: jns-rad-ljp
            stance: supports
            note: Names the movement maker.
      EX:
        value: 2
        rationale: "Revolution reports that the Radiant's tantalum case is made in-house (jns-rad-case-in-house), and the maker says it has produced tantalum cases for the Infinity Series since 2021 (jns-rad-tantalum-cases-2021), which is consistent but does not name the Radiant. That makes the case one important component family made internally. It is not 3 because no source says who makes the crown, crystal or the optional bracelet, which the maker says was engineered with MING for the Alternative Horological Alliance (jns-rad-bracelet-ming). Borderline between 2 and 3, as the case is the main exterior part on the standard strap version."
        evidence:
          - claim: jns-rad-case-in-house
            stance: supports
            note: Secondary source naming the Radiant's case as made in-house.
          - claim: jns-rad-tantalum-cases-2021
            stance: context
            note: Primary statement of in-house tantalum case production for the series; does not name the Radiant.
          - claim: jns-rad-bracelet-ming
            stance: context
            note: The optional bracelet was engineered with an outside partner; its maker is not stated.
      DH:
        value: 3
        rationale: The maker engine-turns its patterns directly into the dial (jns-rad-our-weave, jns-rad-weave). Who makes the dial blank and the hands is not stated, so the score stops at substantial dial work rather than integrated dial and hand manufacture.
        evidence:
          - claim: jns-rad-our-weave
            stance: supports
            note: In-house dial engine-turning.
          - claim: jns-rad-weave
            stance: supports
            note: Dial decoration described by the maker.
          - claim: jns-rad-hands
            stance: context
            note: Hands described; maker not named.
      CF:
        value: 4
        rationale: Engine-turning of the brand's own patterns is a major internal craft (jns-rad-our-weave, jns-rad-weave). Level 5 would need evidence of who performs it and to what depth on this model, as SJX documented for the 2019 Infinity.
        evidence:
          - claim: jns-rad-our-weave
            stance: supports
            note: Internal engine-turning.
          - claim: jns-rad-weave
            stance: supports
            note: Defining dial craft.
      WE:
