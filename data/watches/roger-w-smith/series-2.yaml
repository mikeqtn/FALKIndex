    scores:
      MA:
        value: 5
        rationale: Smith designed the Series Two as a new watch, the first production movement built around the Daniels co-axial escapement.
        evidence:
          - claim: rws2-new-watch-daniels
            stance: supports
            note: New design.
          - claim: rws2-coaxial-design
            stance: supports
            note: Co-axial architecture.
      MM:
        value: 5
        rationale: All but the most specialised components are made from raw materials in the workshop, including the escape wheel and escapement. The balance spring, mainspring and jewels are bought in.
        evidence:
          - claim: rws2-in-house-components
            stance: supports
            note: From raw materials.
          - claim: rws2-raw-materials
            stance: supports
            note: Made in the workshop.
          - claim: rws2-escapement-iom
            stance: supports
            note: Escapement made in-house.
          - claim: rws2-sourced-parts
            stance: context
            note: Bought-in springs and jewels.
      EX:
        value: 4
        rationale: Smith makes the case in his own workshop; sapphire crystals, seals and straps are bought in. Most major exterior hardware is internal.
        evidence:
          - claim: rws2-case-dial-hands
            stance: supports
            note: Case made in-house.
          - claim: rws2-in-house-components
            stance: supports
            note: From raw materials.
          - claim: rws2-sourced-parts
            stance: context
            note: Bought-in crystals and seals.
      DH:
        value: 5
        rationale: Dials are hand-made from soldered and screwed parts and hand engine-turned, and the hands are made in-house. Defining dial and hand manufacture.
        evidence:
          - claim: rws2-case-dial-hands
            stance: supports
            note: Dial and hands in-house.
          - claim: rws2-dial-construction
            stance: supports
            note: Hand-made dial.
          - claim: rws2-engine-turned-dials
            stance: supports
            note: Engine-turned dials.
      CF:
        value: 5
        rationale: Traditional hand finishing is applied throughout the movement, and dials are hand engine-turned. Some engraving is done in London, possibly externally.
        evidence:
          - claim: rws2-hand-finishing
            stance: supports
            note: Hand finishing throughout.
          - claim: rws2-engine-turned-dials
            stance: supports
            note: Engine-turning.
          - claim: rws2-case-dial-hands
            stance: context
            note: Some engraving in London.
      WE:
        value: 3
        rationale: Each watch is assembled by hand in the Isle of Man workshop, on movements made largely from raw materials. No claim mentions regulation or adjustment, which caps this at 3.
        evidence:
          - claim: rws2-assembled-by-hand
            stance: supports
            note: Hand assembly.
          - claim: rws2-designed-built-iom
            stance: supports
            note: Built in-house.
          - claim: rws2-raw-materials
            stance: supports
            note: Made from raw materials.
      PD:
        value: 5
        rationale: A completely new watch designed around the co-axial escapement.
        evidence:
          - claim: rws2-new-watch-daniels
            stance: supports
            note: New design.
          - claim: rws2-designed-built-iom
            stance: supports
            note: Designed in-house.
