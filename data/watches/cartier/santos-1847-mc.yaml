        value: 4
        rationale: Cartier developed a new calibre as an affordable in-house base for its classic models, and says its own watchmakers and engineers created it, including a non-magnetic escapement (cs1847-new-calibre, cs1847-created-developed, cs1847-antimagnetic). That is extensive original technical development. Not 5, as nothing shows invention that defines the watch.
        evidence:
          - claim: cs1847-new-calibre
            stance: supports
            note: New calibre.
