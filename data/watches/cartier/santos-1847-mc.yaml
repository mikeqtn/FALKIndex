    created_on: 2026-11-17
    scores:
      MA:
        value: 4
        rationale: The 1847 MC was newly developed as Cartier's most affordable in-house calibre (cs1847-new-calibre), and Cartier says it was entirely created and developed by its own watchmakers and engineers, with a non-magnetic escapement (cs1847-created-developed, cs1847-antimagnetic). Cartier is part of Richemont, whose ValFleurier made parts for Cartier's earlier 1904 MC (cs1847-valfleurier-1904), and no independent source describes how much engineering came from group partners, so this stays 4 rather than 5; borderline with 5.
        evidence:
          - claim: cs1847-new-calibre
            stance: supports
            note: Newly developed calibre.
          - claim: cs1847-created-developed
            stance: supports
            note: Cartier credits its own watchmakers and engineers.
          - claim: cs1847-construction
            stance: supports
            note: Construction details.
          - claim: cs1847-antimagnetic
            stance: supports
            note: Non-magnetic escapement design.
          - claim: cs1847-in-santos
            stance: supports
            note: Used in the Santos.
          - claim: cs1847-components
            stance: context
            note: Component count.
          - claim: cs1847-valfleurier-1904
            stance: context
            note: In-group partner on an earlier calibre.
      MM:
        value: null
        rationale: Cartier has produced movements in La Chaux-de-Fonds since 2001, and a 2015 caption says the 1847 MC is assembled by its manufactory, but no source says which 1847 MC parts are made by Cartier, by Richemont's ValFleurier or by outside suppliers. A 2010 report puts the 1904 MC's parts at ValFleurier in Buttes (in-group), which does not establish where 1847 MC parts are made. A general statement cannot place a level.
        evidence:
          - claim: cs1847-lcdf-manufacture
            stance: context
            note: General manufacture statement.
          - claim: cs1847-valfleurier-1904
            stance: context
            note: Different calibre; in-group parts maker.
      EX:
        value: 3
        rationale: A 2022 Santos feature (labelled Cartier PR, secondary) says Cartier now produces the Santos's case and then its bracelet in La Chaux-de-Fonds (cs1847-santos-case-bracelet). Cartier's own pages describe its shaped-case production from stamping to assembly and say steel watches are produced in Villars-sur-Glâne, though without naming the Santos (cs1847-shaped-case-crafts, cs1847-villars-assembly). Case and bracelet are two principal families; the crown and sapphire crystal makers are not named, so not 4. Borderline with 2, as the model tie rests on one sponsored secondary source.
        evidence:
          - claim: cs1847-santos-case-bracelet
            stance: supports
            note: Santos case and bracelet made by Cartier.
          - claim: cs1847-shaped-case-crafts
            stance: supports
            note: Cartier's shaped-case production; not model-specific.
          - claim: cs1847-villars-assembly
            stance: context
            note: Steel-watch production site.
          - claim: cs1847-specs
            stance: context
            note: Crown and crystal makers not named.
      DH:
        value: null
        rationale: Cartier says it produces blued-steel hands (cs1847-blued-hands), but no source ties that to the Santos's sword hands, and no source names the dial maker. U.
        evidence:
          - claim: cs1847-specs
            stance: context
            note: Makers not named.
          - claim: cs1847-blued-hands
            stance: context
            note: Brand capability, not tied to this model.
      CF:
        value: 1
        rationale: Cartier says its shaped-case production includes polishing, and that polishers' hands achieve the alternating polished and brushed finishes (cs1847-shaped-case-crafts, cs1847-hand-polishing); a secondary source says the Santos case is made by Cartier (cs1847-santos-case-bracelet). That is limited manual finishing, counted here as craft separately from the physical case manufacture scored in EX. The movement decoration is stamped (cs1847-decoration), so not 2. Borderline with U, since the model tie runs through one secondary source.
        evidence:
          - claim: cs1847-hand-polishing
            stance: supports
            note: Hand polishing by Cartier.
          - claim: cs1847-shaped-case-crafts
            stance: supports
            note: Polishing within case production.
          - claim: cs1847-santos-case-bracelet
            stance: supports
            note: Ties case production to the Santos.
          - claim: cs1847-decoration
            stance: context
            note: Movement decoration stamped.
      WE:
        value: 3
        rationale: Cartier says each 1847 MC movement is individually adjusted by a watchmaker (cs1847-adjusted), a 2015 Cartier caption says the calibre is assembled by its manufactory (cs1847-assembled-caption), and Cartier says steel watches are assembled in Villars-sur-Glâne and individually checked for chronometry and water resistance (cs1847-villars-assembly, cs1847-watch-checks). That is movement adjustment plus assembly, regulation and testing. The 1847 MC is a simple automatic with no complication work described, so not 4.
        evidence:
          - claim: cs1847-adjusted
            stance: supports
            note: Every movement adjusted by a watchmaker.
          - claim: cs1847-assembled-caption
            stance: supports
            note: Movement assembled by Cartier.
          - claim: cs1847-villars-assembly
            stance: supports
            note: Steel watches assembled by Cartier.
          - claim: cs1847-watch-checks
            stance: supports
            note: Individual chronometry and water-resistance checks.
          - claim: cs1847-lcdf-manufacture
            stance: context
            note: General statement.
