id: cartier/santos-1847-mc
brand: cartier
model: Santos
caliber: 1847 MC
notes: Handbook v0.2 §8 lists this record as "Cartier — Santos / 1847 MC".
provenance:
  - dimension: MA
    component: Caliber 1847 MC design
    performer: cartier
    relationship: internal
    valid_from: 2015
    note: Introduced in the Clé de Cartier (2015) and later used in the Santos de Cartier.
    claims:
      - cs1847-new-calibre
      - cs1847-in-santos
      - cs1847-construction
      - cs1847-components
      - cs1847-created-developed
      - cs1847-antimagnetic
  - dimension: MM
    component: Movement components (plates, bridges, wheels)
    relationship: unknown
    note: Cartier says it produces its own movements in La Chaux-de-Fonds, but no source breaks down which 1847 MC parts are made there versus by Richemont group or outside suppliers. A 2010 report says parts for the earlier 1904 MC were made in-group by Val Fleurier (Richemont) in Buttes; no source ties ValFleurier to the 1847 MC.
    claims:
      - cs1847-lcdf-manufacture
      - cs1847-valfleurier-1904
  - dimension: MM
    component: Hairspring, escapement, mainspring, jewels
    relationship: unknown
    note: No source names suppliers for regulating-organ parts.
    claims: []
  - dimension: EX
    component: Case and SmartLink bracelet
    performer: cartier
    relationship: internal
    valid_from: 2018
    note: A 2022 Santos feature (labelled Cartier PR) says Cartier produces the case and then the bracelet in La Chaux-de-Fonds; Cartier's own pages describe its shaped-case production and steel-watch production in Villars-sur-Glâne without naming the Santos.
    claims:
      - cs1847-specs
      - cs1847-santos-case-bracelet
      - cs1847-shaped-case-crafts
      - cs1847-villars-assembly
  - dimension: EX
    component: Crown and sapphire crystal
    relationship: unknown
    note: Product page describes the parts but no source names who makes them.
    claims:
      - cs1847-specs
  - dimension: DH
    component: Dial and hands
    relationship: unknown
    note: Cartier says it produces blued-steel hands, but no source ties that to the Santos's hands or names the dial maker.
    claims:
      - cs1847-specs
      - cs1847-blued-hands
  - dimension: CF
    component: Movement decoration (stamped Côtes de Genève)
    relationship: unknown
    note: Decoration is described as basic and stamped; who applies it is not stated.
    claims:
      - cs1847-decoration
  - dimension: CF
    component: Case polishing and satin-brushing
    performer: cartier
    relationship: internal
    note: Cartier describes hand polishing within its shaped-case production; tied to the Santos only through the secondary report that Cartier makes the Santos case.
    claims:
      - cs1847-shaped-case-crafts
      - cs1847-hand-polishing
      - cs1847-santos-case-bracelet
  - dimension: WE
    component: Movement production and assembly
    performer: cartier
    relationship: internal
    note: Cartier says each 1847 MC is individually adjusted by a watchmaker, and a 2015 Cartier caption says the calibre is assembled by its manufactory. Cartier says steel watches are assembled in Villars-sur-Glâne and checked individually.
