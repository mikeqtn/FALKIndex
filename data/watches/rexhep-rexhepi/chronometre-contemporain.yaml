  - version: 3
    methodology: v0.2
    confidence: C
    independent_watchmaker: true
    status: published
    editor: falk-index
    change_note: "Adds a December 2018 Deployant interview on the commercial release, a 2024 SJX visit to the Akrivia workshops, and further passages from the March 2018 SJX prototype report (Emaill’Art dial, hands made at Akrivia). Changes from version 2: MM U → 0; EX U → 0; DH U → 2; confidence stays C. None of the seven dimensions remain U."
    created_on: 2026-11-17
    scores:
      MA:
        value: 4
        rationale: The maker says every component is conceived in-house. No claim in this record describes the calibre's design, and a general statement cannot show the engineering is mastered internally, so 4.
        evidence:
          - claim: rrcc-ateliers-in-house
            stance: supports
            note: Conceived in-house.
      MM:
        value: 0
        rationale: "Three secondary sources agree that at the time of this watch the movement parts were made outside: SJX (March 2018) says most components came from suppliers, Deployant (December 2018, on the commercial release) says Akrivia could not yet make bridges and plates, and SJX (2024) says plates and bridges were previously outsourced, with MHC named as an early supplier. The maker's statements that every component is made in-house are general and current, and are contradicted for this period. No source names a movement part made internally, so 0; borderline with 1, since \"most\" leaves room for unnamed parts."
        evidence:
          - claim: rrcc-2018-suppliers
            stance: supports
            note: Most components from suppliers.
          - claim: rrcc-deployant-plates-external
            stance: supports
            note: Bridges and plates not made in-house in 2018.
          - claim: rrcc-deployant-final-release
            stance: context
            note: Ties the interview to the commercial release.
          - claim: rrcc-cases-previously-outsourced
            stance: supports
            note: Plates and bridges previously outsourced.
          - claim: rrcc-mhc-early-supplier
            stance: context
            note: Named early supplier, not tied to this calibre.
          - claim: rrcc-crafted-finished-akrivia
            stance: contradicts
            note: "Maker: every component in-house (disputed)."
          - claim: rrcc-ateliers-in-house
            stance: contradicts
            note: "Maker: everything made in-house (disputed)."
      EX:
        value: 0
        rationale: "The watch launched in 2018; Akrivia's case workshop opened in 2019, the maker says the CC II case is now produced in-house, and SJX (2024) says cases were previously outsourced and that the workshop makes cases for the RRCC II and later watches. Read together, the CC I case was made outside, so 0. Borderline: no source names the CC I case maker, and none covers the crown or other exterior parts."
        evidence:
          - claim: rrcc-cases-previously-outsourced
            stance: supports
            note: Cases previously outsourced.
          - claim: rrcc-case-workshop-rrccii
            stance: supports
            note: Workshop cases begin with RRCC II.
          - claim: rrcc2-first-in-house-case
            stance: supports
            note: CC II case now in-house.
          - claim: rrcc-case-workshop-2019
            stance: context
            note: Case workshop from 2019.
      DH:
        value: 2
        rationale: "SJX (March 2018) reports that the hands are made by hand in the Akrivia workshop, one meaningful production stage internal. The grand feu dial is made outside, by Emaill’Art per SJX, and Akrivia's own enamel workshop opened only in 2024, so not 3. Borderline: the hands report describes the prototype, and SJX said dial details might change for production."
        evidence:
          - claim: rrcc-hands-akrivia
            stance: supports
            note: Hands made at Akrivia.
          - claim: rrcc-emaillart-dial
            stance: context
            note: Dial by an external enameller.
          - claim: rrcc-sjx-enameller
            stance: context
            note: External enameller.
          - claim: rrcc-enamel-dial
            stance: context
            note: Enameller not named.
          - claim: rrcc-enamel-workshop-2024
            stance: context
            note: Later workshop.
      CF:
        value: 5
        rationale: Every component is hand-finished at the atelier, with anglage, black polish and Côtes de Genève. Master-level finishing defines the watch.
        evidence:
          - claim: rrcc-crafted-finished-akrivia
            stance: supports
            note: Hand-finished in-house.
          - claim: rrcc-finishing-techniques
            stance: supports
            note: Techniques.
          - claim: rrcc-ateliers-in-house
            stance: supports
            note: Hand-finished in-house.
      WE:
        value: 3
        rationale: Each watchmaker completes a whole watch from start to finish. SJX (2024) says each watch is also adjusted by that watchmaker, but the report describes the atelier six years after this watch's launch and does not name it, so it is context and the score stays at 3; borderline with 4. The chronometer trials were external.
