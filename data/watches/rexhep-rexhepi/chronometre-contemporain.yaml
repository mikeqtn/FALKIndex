    change_note: "AI-drafted first evidenced profile. Proposed: EX 2 → 0 (the maker calls the CC II case its first in-house one); DH 2 → U (the 2018 enamel dial is by an external Geneva enameller; hands unattributed). Other scores unchanged; confidence stays B. The maker's claim that every component is made in-house sits uneasily with the 2018 AK-06 sources; see that record. Revised after the automated pre-review (rules: D at 4+ U; PD by content; WE needs a regulation or adjustment claim above 3; brand-wide claims only when universal; no in-group credit for suppliers serving other brands): MA 5 → 4; MM 3 → U; EX 0 → U; WE 5 → 3; confidence B → C. Needs review."
    created_on: 2026-10-21
    scores:
      MA:
        value: 4
        rationale: The maker says every component is conceived in-house. No claim in this record describes the calibre's design, and a general statement cannot show the engineering is mastered internally, so 4.
        evidence:
          - claim: rrcc-ateliers-in-house
            stance: supports
            note: Conceived in-house.
      MM:
        value: null
        rationale: The maker says every RRCC-01 component is crafted in-house, but 2018 sources in the AK-06 record report that most parts came from suppliers. With the brand claim contested, U until an independent source settles it.
        evidence:
          - claim: rrcc-crafted-finished-akrivia
            stance: context
            note: Brand claim, contested.
          - claim: rrcc-ateliers-in-house
            stance: context
            note: Brand claim, contested.
      EX:
        value: null
        rationale: The maker calls the CC II case its first in-house conventional case, which implies, but does not state, that the CC I case was external. The case maker is not named.
        evidence:
          - claim: rrcc2-first-in-house-case
            stance: context
            note: Implies CC I case external.
          - claim: rrcc-case-workshop-2019
            stance: context
            note: Case workshop from 2019.
      DH:
        value: null
        rationale: The CC I grand feu dial was made by an unnamed Geneva enameller; Akrivia's own enamel workshop opened only in 2024. No source covers the hands. At most 2 if the hands are internal, otherwise 0.
        evidence:
          - claim: rrcc-sjx-enameller
            stance: context
            note: External enameller.
          - claim: rrcc-enamel-dial
            stance: context
            note: Enameller not named.
          - claim: rrcc-enamel-workshop-2024
            stance: context
            note: Later workshop.
      CF:
        value: 5
        rationale: Every component is hand-finished at the atelier, with anglage, black polish and Côtes de Genève. Master-level finishing defines the watch.
        evidence:
          - claim: rrcc-crafted-finished-akrivia
            stance: supports
            note: Hand-finished in-house.
          - claim: rrcc-finishing-techniques
            stance: supports
            note: Techniques.
          - claim: rrcc-ateliers-in-house
            stance: supports
            note: Hand-finished in-house.
      WE:
        value: 3
        rationale: Each watchmaker completes a whole watch from start to finish. No claim mentions regulation or adjustment, which caps this at 3. The chronometer trials were external.
        evidence:
          - claim: rrcc-one-watchmaker
            stance: supports
            note: One watchmaker per watch.
          - claim: rrcc-besancon
            stance: context
            note: External chronometer trials.
      PD:
        value: 5
        rationale: Rexhep Rexhepi designed the watch around his atelier's own calibre.
        evidence:
          - claim: rrcc-design
            stance: supports
            note: Designed by Rexhepi.
    classification:
      - independent_manufacture
