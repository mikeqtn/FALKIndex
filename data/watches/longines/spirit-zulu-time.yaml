id: longines/spirit-zulu-time
brand: longines
model: Spirit Zulu Time
notes: Handbook v0.2 §8 lists this record as "Longines — Spirit Zulu Time".
claims:
  - id: lgzt-l8444-eta
    statement: A specialist site reports cal. L844.4 is exclusive to Longines and based on the ETA A31.411, derived from the ETA 2892-A2.
    excerpt: The L844.4 is exclusive to Longines, based on an ETA A31.411, which is in turn a derivation of the ETA 2892-A2
    source: timeandtide-longines-zulu-time
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: lgzt-silicon-cosc
    statement: The same source lists a silicon balance spring, COSC certification and 72-hour power reserve.
    excerpt: with a silicon balance spring, COSC certification, and a 72-hour power reserve
    source: timeandtide-longines-zulu-time
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: lgzt-a31l01
    statement: A review reports cal. L844.4 is derived from the ETA A31.L01.
    excerpt: It is derived from the ETA caliber A31.L01 and beats at 25,200 Vph with 72 hours power reserve.
    source: deployant-longines-zulu-time
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: ai-draft
  - id: lgzt-silicon
    statement: The review reports a silicon balance spring and COSC certification.
    excerpt: The movement is fitted with a silicon balance spring for additional anti-magnetism and is COSC certified.
    source: deployant-longines-zulu-time
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: lgzt-case
    statement: The review describes a 42 mm stainless steel case, without naming its maker.
    excerpt: Sized at 42.00 mm with a thickness of 13.90 mm, the stainless steel cased watch comes in both strap and bracelet variants.
    source: deployant-longines-zulu-time
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: lgzt-dial
    statement: The review describes applied numerals on the dial, without naming its maker.
    excerpt: The dial uses applied numeral indicators with a periphery seconds track.
    source: deployant-longines-zulu-time
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: lgzt-eta-only
    statement: Longines' CEO said that after 1988 the company stopped making movements and worked solely with ETA movements.
    excerpt: took the decision to stop manufacturing movements in-house and work solely with ETA movements.
    source: europastar-longines-von-kanel
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: lgzt-no-dials-hands
    statement: Longines' CEO said that until 1988 Longines made cases and movements but no dials or hands.
    excerpt: producing in-house cases and movements, including chronographs, but no dials or hands.
    source: europastar-longines-von-kanel
    dimensions:
      - EX
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
