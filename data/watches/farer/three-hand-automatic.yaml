id: farer/three-hand-automatic
brand: farer
model: Three-hand automatic
notes: Handbook v0.2 §8 lists this record as "Farer — Three-hand automatic".
provenance:
  - dimension: MA
    component: Movement (ETA 2824-2)
    performer: eta
    relationship: external_specialist
    valid_from: 2016
    note: First-generation automatics (Beagle, Hopewell, Endurance).
    claims:
      - far3h-eta-2016
  - dimension: MA
    component: Movement (Sellita SW200-1)
    performer: sellita
    relationship: external_specialist
    valid_from: 2021
    note: 2021 three-hand automatic trio; exact changeover date not confirmed.
    claims:
      - far3h-sw200-2021
  - dimension: MM
    component: Movement components
    relationship: external_specialist
    note: Supplied as complete ETA or Sellita calibers.
    claims:
      - far3h-eta-2016
      - far3h-sw200-2021
  - dimension: EX
    component: Case, crown and crystal
    relationship: external_specialist
    note: Farer says Swiss manufacturing partners produce its watches, and a 2024 article says Farer names its case makers; no source reached names the case or crown maker.
    claims:
      - far3h-case-2021
      - far3h-bronze-crown
      - far3h-roventa-henex
      - far3h-partners-produce
      - far3h-esq-white-label
      - far3h-oot-transparency
  - dimension: DH
    component: Dial and hands
    relationship: external_specialist
    note: Dials come from an outside dial maker (2019 founder quote); hands are covered only by Farer's general statement that partners produce its watches. Makers not named.
    claims:
      - far3h-roventa-henex
      - far3h-partners-produce
      - far3h-esq-dial-maker
      - far3h-oot-transparency
  - dimension: CF
    component: Movement finishing
    relationship: external_specialist
    note: Finishing grade comes with the supplied ETA calibres (2019 source); finishing of the Sellita-era movements is not described.
    claims:
      - far3h-esq-eta-grades
  - dimension: WE
    component: Production and assembly
    performer: roventa-henex
    relationship: contract
    note: Named in 2016 and 2019 sources; Farer's own page says Swiss partners produce its watches without naming them.
    claims:
      - far3h-roventa-henex
      - far3h-esq-white-label
      - far3h-partners-produce
  - dimension: PD
    component: Design and development
    performer: farer
    relationship: internal
    claims:
      - far3h-london-design
claims:
  - id: far3h-london-design
    statement: A 2016 specialist article says Farer watches are designed and developed in London.
    excerpt: Watches by Farer are designed and developed in London
    source: monochrome-farer-automatics-2016
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: far3h-roventa-henex
    statement: The same article says the watches are produced in Switzerland by Roventa-Henex, a manufacturer that works for multiple brands.
    excerpt: are produced in Switzerland, by Roventa-Henex, a Swiss manufacturer that works behind the scenes for multiple brands.
    source: monochrome-farer-automatics-2016
    dimensions:
      - WE
      - EX
      - DH
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: far3h-eta-2016
    statement: The same article says the first Farer automatics use an ETA 2824-2 movement.
    excerpt: Inside the cases of the Farer Automatic Watches is a known and reliable movement, an ETA 2824-2,
    source: monochrome-farer-automatics-2016
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: far3h-bronze-crown
    statement: The same article notes a contrasting bronze crown on the 2016 automatics.
    excerpt: A nice detail is the contrasting crown, made out of bronze
    source: monochrome-farer-automatics-2016
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: far3h-sw200-2021
    statement: A 2021 review says Farer's three-hand automatic trio uses the Sellita SW200-1.
    excerpt: The stainless cases house the now very familiar workhorse Sellita cal. SW200-1.
    source: wornandwound-farer-three-hand-2021
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: far3h-case-2021
    statement: The same review describes polished 316L stainless steel cases, water resistant to 50 m, with a box sapphire crystal; no case maker is named.
    excerpt: The cases are 316L stainless, polished and water resistant to 50m.
    source: wornandwound-farer-three-hand-2021
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: far3h-partners-produce
    statement: Farer says it uses Swiss manufacturing partners to prototype and produce its watches.
    excerpt: We then use the best Swiss manufacturing partners to prototype and produce our watches.
    source: farer-our-story
    dimensions:
      - EX
      - DH
      - CF
      - WE
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: far3h-esq-white-label
    statement: A 2019 Esquire UK article says the watches are made by Roventa-Henex (spelled "Rowenta Henex" in the article), a white-label firm that assembles and produces watches for many brands.
    excerpt: the watches are made by Rowenta Henex, a white-label firm that assembles and produces watches for dozens of major brands
    source: esquireuk-farer-more-than-micro-brand-2019
    dimensions:
      - EX
      - DH
      - CF
      - WE
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: far3h-esq-dial-maker
    statement: In the same article, founder Paul Sweetenham is quoted saying Farer can use only one of the two serious dial makers because of the detail in its dials.
    excerpt: There are only two serious dial makers in the watch world, and I can only use one of them because of the detail
    source: esquireuk-farer-more-than-micro-brand-2019
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: far3h-esq-eta-grades
    statement: The same article says Farer's movements are ETA calibres in the higher finishing and timekeeping grades on offer from the supplier.
    excerpt: The movements are ETA, but Sweetenham is committed to the higher grades of finishing and timekeeping on offer
    source: esquireuk-farer-more-than-micro-brand-2019
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: far3h-oot-transparency
    statement: A 2024 Oracle of Time article says Farer will name who makes its movements, cases, dials, straps, hands and lume.
    excerpt: They will happily tell you not just who makes their movements, but their cases, dials, straps, hands and lume.
    source: oracleoftime-farer-independent-watchmaking-2024
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
