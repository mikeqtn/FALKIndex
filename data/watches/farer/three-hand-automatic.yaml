id: farer/three-hand-automatic
brand: farer
model: Three-hand automatic
notes: Handbook v0.2 §8 lists this record as "Farer — Three-hand automatic".
claims:
  - id: far3h-london-design
    statement: A 2016 specialist article says Farer watches are designed and developed in London.
    excerpt: Watches by Farer are designed and developed in London
    source: monochrome-farer-automatics-2016
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
  - id: far3h-roventa-henex
    statement: The same article says the watches are produced in Switzerland by Roventa-Henex, a manufacturer that works for multiple brands.
    excerpt: are produced in Switzerland, by Roventa-Henex, a Swiss manufacturer that works behind the scenes for multiple brands.
    source: monochrome-farer-automatics-2016
    dimensions:
      - WE
      - EX
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: far3h-eta-2016
    statement: The same article says the first Farer automatics use an ETA 2824-2 movement.
    excerpt: Inside the cases of the Farer Automatic Watches is a known and reliable movement, an ETA 2824-2,
    source: monochrome-farer-automatics-2016
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: far3h-bronze-crown
    statement: The same article notes a contrasting bronze crown on the 2016 automatics.
    excerpt: A nice detail is the contrasting crown, made out of bronze
    source: monochrome-farer-automatics-2016
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: far3h-sw200-2021
    statement: A 2021 review says Farer's three-hand automatic trio uses the Sellita SW200-1.
    excerpt: The stainless cases house the now very familiar workhorse Sellita cal. SW200-1.
    source: wornandwound-farer-three-hand-2021
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: far3h-case-2021
    statement: The same review describes polished 316L stainless steel cases, water resistant to 50 m, with a box sapphire crystal; no case maker is named.
    excerpt: The cases are 316L stainless, polished and water resistant to 50m.
    source: wornandwound-farer-three-hand-2021
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
