          - claim: sbsb05-gphg-movement-finish
            stance: supports
            note: Movement from La Joux-Perret.
      EX:
        value: 0
        rationale: The brand's design guide and Billard's GPHG entry both say Voutilainen & Cattin makes the case, matching the Phillips and Quill & Pad accounts of the 20-part case. No exterior part is made by the brand.
        evidence:
          - claim: sbsb05-case
            stance: supports
            note: Cattin case.
          - claim: sbsb05-case-spec
            stance: supports
            note: Made by Voutilainen-Cattin.
          - claim: sbsb05-sb-development
            stance: supports
            note: Brand credits case making to V&C.
          - claim: sbsb05-gphg-comblemine
            stance: supports
            note: Case made by V&C.
      DH:
        value: 2
        rationale: The brand's SB05 design guide says Billard makes the polished, brushed, sunburst, frosted, grained and stone dials, which credits one meaningful dial stage to the atelier. Guilloché dials come from Comblémine, the numbers are pad printed by an unnamed party, and Billard's statement that he makes hands is given for the SB04 and as a skill he is learning, so hands do not count here. Borderline with 3, which would need the SB05's hands or printing tied to the atelier.
        evidence:
          - claim: sbsb05-sb-make-dials
            stance: supports
            note: Billard makes the SB05 dials.
          - claim: sbsb05-dials-billard
            stance: supports
            note: Own dial treatments, described for the SB04.
          - claim: sbsb05-gphg-learning-hands
            stance: context
            note: Dial-making and hand-making skills, not tied to the SB05.
          - claim: sbsb05-gphg-sb04-made-by-me
            stance: context
            note: SB04 hands and dials made by Billard.
          - claim: sbsb05-guilloche
            stance: context
            note: External guilloché.
          - claim: sbsb05-gphg-comblemine
            stance: context
            note: Comblémine makes the guilloché dials.
          - claim: sbsb05-sb-hands-spec
            stance: context
            note: Hand finish options, maker not named.
          - claim: sbsb05-hands
            stance: context
            note: Hand maker not named.
          - claim: sbsb05-sb-pad-printed
            stance: context
            note: Printer not named.
      CF:
        value: 1
        rationale: The brand's design guide says Billard makes the SB05's polished, brushed, sunburst, frosted and grained dial surfaces, a limited set of decorative operations done in the atelier. No source says these are done by hand, the optional hand polishing has no named performer, and the movement finishes come with the La Joux-Perret calibre without a named performer. Borderline with 2, which would need a source describing regular handwork by the atelier.
        evidence:
          - claim: sbsb05-sb-make-dials
            stance: supports
            note: Dial finishes made by Billard.
          - claim: sbsb05-gphg-learning-hands
            stance: context
            note: Craft skills, not tied to the SB05.
          - claim: sbsb05-hands
            stance: context
            note: Performer not stated.
          - claim: sbsb05-movement-finish
            stance: context
            note: Performer not stated.
          - claim: sbsb05-gphg-movement-finish
            stance: context
            note: Performer not stated.
      WE:
        value: 0
        rationale: Comblémine assembles each watch after receiving finished movements from La Joux-Perret. No source describes assembly, regulation or testing by the brand for the SB05.
        evidence:
          - claim: sbsb05-assembly
            stance: supports
            note: External assembly.
      PD:
        value: 3
        rationale: Each watch is made to order after a design process with the client, and Billard directs Comblémine and Cattin on its execution to his own case specification. The brand and Billard's GPHG entry both say Comblémine conducted the SB05's technical development, so the engineering is supplier-led and the score is not 4.
        evidence:
          - claim: sbsb05-made-to-order
            stance: supports
            note: Made to order.
          - claim: sbsb05-collab
            stance: supports
            note: Directs suppliers.
          - claim: sbsb05-case-spec
            stance: supports
            note: Own case specification.
          - claim: sbsb05-sb-development
            stance: supports
            note: Development by Comblémine.
          - claim: sbsb05-gphg-comblemine
            stance: supports
            note: Development by Comblémine.
