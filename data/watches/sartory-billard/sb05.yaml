      MA:
        value: 1
        rationale: A La Joux-Perret 7380 with a dark grey NAC treatment; the brand's design guide confirms La Joux-Perret makes the movement, and Billard describes a special set of finishes made for the SB05. A cosmetic specification of an external calibre, so not 2.
