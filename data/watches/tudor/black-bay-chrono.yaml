    editor: ai-draft
    change_note: "AI-drafted first evidenced profile, from specialist sources. Proposed: MA 3 → 2 (a Breitling B01 base with Tudor's own regulating parts); MM 2 → 3 (now made at in-group Kenissi; Breitling made it at launch); EX 2 → 0; DH 2 → U and CF 1 → U; WE 5 → 4; PD 4 → 3; confidence B → C. Kenissi is majority-owned by Tudor and recorded as in-group; it also supplies other brands, so this credit is disclosed rather than treated as brand-internal. Revised after the automated pre-review (rules: D at 4+ U; PD by content; WE needs a regulation or adjustment claim above 3; brand-wide claims only when universal; no in-group credit for suppliers serving other brands): MM 3 → 0; EX 0 → U; WE 4 → 2. industrial_manufacture → design_led_etablisseur, since the movement maker is not credited. Needs review."
    created_on: 2026-10-21
    scores:
      MA:
        value: 2
        rationale: The MT5813 uses Breitling's B01 as its template, with Tudor's own free-sprung regulator, silicon hairspring and finishes. A meaningful modification; borderline with 3 since the 2026 rework.
        evidence:
          - claim: tbbc-b01-template
            stance: supports
            note: B01 template.
          - claim: tbbc-mt5813
            stance: supports
            note: MT5813.
      MM:
        value: 0
        rationale: Breitling made the MT5813 at launch, and Kenissi makes it now. Neither is credited as Tudor's own, since Kenissi supplies other brands. Tudor specified its own regulating parts.
        evidence:
          - claim: tbbc-tudor-additions
            stance: supports
            note: Own regulating parts.
          - claim: tbbc-regulator
            stance: context
            note: Maker not stated.
          - claim: tbbc-silicon
            stance: context
            note: Maker not stated.
          - claim: tbbc-made-by-breitling
            stance: supports
            note: Made by Breitling at launch.
          - claim: tbbc-kenissi-2026
            stance: supports
            note: Now made at Kenissi.
      EX:
        value: null
        rationale: Orolux is named as a Tudor case supplier, but not tied to this model.
        evidence:
          - claim: tbbc-case
            stance: context
            note: Specification.
          - claim: tbbc-cases-orolux
            stance: context
            note: Not tied to this model.
      DH:
        value: null
        rationale: Montremo is named as a Tudor dial maker, not tied to this model, and no source names the hand maker.
        evidence:
          - claim: tbbc-cases-orolux
            stance: context
            note: External dial maker.
      CF:
        value: null
        rationale: Tudor specified the finishes, but no source says who applies them.
        evidence:
          - claim: tbbc-tudor-additions
            stance: context
            note: Specified finishes.
      WE:
        value: 2
        rationale: Tudor assembles and tests the watches in Le Locle; the movement is made at Kenissi and not credited. No claim mentions regulation or adjustment by Tudor.
        evidence:
          - claim: tbbc-watch-assembly
            stance: supports
            note: Watch assembly and testing.
          - claim: tbbc-kenissi-2026
            stance: context
            note: Movement made at Kenissi.
      PD:
        value: 3
        rationale: Tudor specified its own regulating parts and finishes on a partner's base, designed a new dial, and traded its MT5612 in exchange. Bespoke components and supplier-directed development.
        evidence:
          - claim: tbbc-tudor-additions
            stance: supports
            note: Own specifications.
          - claim: tbbc-dial-design
            stance: supports
            note: New dial design.
          - claim: tbbc-exchange
            stance: supports
            note: Movement exchange.
    classification:
      - design_led_etablisseur
