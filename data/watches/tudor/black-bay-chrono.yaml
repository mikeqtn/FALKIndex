        evidence:
          - claim: tbbc-kenissi-2026
            stance: supports
            note: Made at Kenissi (in-group) by 2026.
          - claim: tbbc-tudor-additions
            stance: supports
            note: Tudor specified its own regulating parts.
          - claim: tbbc-made-by-breitling
            stance: context
            note: External maker at launch.
          - claim: tbbc-regulator
            stance: context
            note: Regulating parts.
          - claim: tbbc-silicon
            stance: context
            note: Silicon hairspring maker not named.
      EX:
        value: null
        rationale: Orolux is named as a Tudor case supplier, but not tied to this model.
        evidence:
          - claim: tbbc-case
            stance: context
            note: Specification.
          - claim: tbbc-cases-orolux
            stance: context
            note: Not tied to this model.
      DH:
        value: null
        rationale: Montremo is named as a Tudor dial maker, not tied to this model, and no source names the hand maker.
        evidence:
          - claim: tbbc-cases-orolux
            stance: context
            note: External dial maker.
      CF:
        value: null
        rationale: Tudor specified the finishes, but no source says who applies them.
        evidence:
          - claim: tbbc-tudor-additions
            stance: context
            note: Specified finishes.
      WE:
        value: 3
        rationale: The movement is made at Kenissi, in-group, and Tudor assembles and tests the watches in Le Locle. No claim describes regulation or adjustment, so this is not above 3.
        evidence:
