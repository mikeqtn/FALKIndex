id: tudor/black-bay-chrono
brand: tudor
model: Black Bay Chrono
caliber: MT5813
notes: Handbook v0.2 §8 lists this record as "Tudor — Black Bay Chrono / MT5813".
provenance:
  - dimension: MA
    component: Chronograph architecture (Breitling B01 base)
    performer: breitling
    relationship: external_specialist
    note: The MT5813 is built on the Breitling B01 architecture under a movement exchange with Breitling (which received a version of the MT5612).
    claims:
      - tbbc-b01-template
      - tbbc-mt5813
      - tbbc-exchange
  - dimension: MM
    component: Movement manufacture (launch period)
    performer: breitling
    relationship: external_specialist
    valid_from: 2017
    note: SJX (2017) reports the MT5813 was made by Breitling for Tudor.
    claims:
      - tbbc-made-by-breitling
  - dimension: MM
    component: Movement manufacture (current)
    performer: kenissi
    relationship: in_group
    note: SJX (2026) reports the MT5813 is now made at Kenissi. The changeover date is not stated.
    claims:
      - tbbc-kenissi-2026
  - dimension: MM
    component: Regulating organ (free-sprung balance, silicon hairspring)
    relationship: unknown
    note: Tudor specified its own regulating parts; who manufactures the balance and silicon hairspring for the MT5813 is not stated. Fratello (2026) says Tudor's silicon hairsprings are produced outside Kenitec, without naming the maker.
    claims:
      - tbbc-regulator
      - tbbc-silicon
      - tbbc-tudor-additions
      - tbbc-silicon-elsewhere
  - dimension: EX
    component: Case blank (steel)
    performer: joseph-baume
    relationship: external_specialist
    note: Fratello (2026) says Joseph Baume produces Tudor's case blanks, stated for Tudor generally rather than this model. Monochrome describes the habillage suppliers as external partners who also work for other brands.
    claims:
      - tbbc-case-blanks-joseph-baume
      - tbbc-habillage-partners
      - tbbc-partners-other-brands
  - dimension: EX
    component: Case (steel, fixed tachymeter bezel)
    performer: orolux
    relationship: external_specialist
    note: Orolux mills and finishes Tudor cases from the Joseph Baume blanks and ships them to Le Locle (Fratello 2026); stated for Tudor generally, not this model. SJX (2023) says Tudor historically used Rolex cases (in-group) without dating the change; Gear Patrol (2022) says Tudor now buys cases from Swiss suppliers. Which route supplied the launch-period cases (2017) is not stated.
    claims:
      - tbbc-case
      - tbbc-cases-orolux
      - tbbc-cases-orolux-finishing
      - tbbc-buys-cases
      - tbbc-rolex-cases-history
  - dimension: EX
    component: Bracelet and clasp
    performer: detech
    relationship: external_specialist
    note: Fratello (2026) says Detech manufactures Tudor's bracelets and clasp components, stated for Tudor generally rather than this model. Bracelets are fitted at Tudor in Le Locle.
    claims:
      - tbbc-bracelets-detech
  - dimension: DH
    component: Dial
    performer: montremo
    relationship: external_specialist
    note: Montremo is named as Tudor's dial supplier (Fratello 2026, Monochrome 2026); Fratello says Montremo applies the black finish to the sub-dials of Tudor's chronograph models, which ties it to the chronograph line though not to this reference by name.
    claims:
      - tbbc-cases-orolux
      - tbbc-dial-design
      - tbbc-dials-montremo-supplier
      - tbbc-chrono-subdials-montremo
  - dimension: DH
    component: Hands
    relationship: unknown
    note: No source names the hand maker. SJX (2023) says only assembly and quality control take place at the Tudor manufacture, and Fratello (2026) says hands are attached there, so the hands are made elsewhere; whether by an external supplier or a Tudor-owned one is not stated.
    claims:
      - tbbc-only-assembly
      - tbbc-dials-hands-attached
  - dimension: CF
    component: Movement finishing
    relationship: unknown
    note: Tudor-specified finishes; who applies them to the MT5813 is not stated. Fratello (2026) says EMP, in the Kenissi holding, sandblasts, diamond-bevels and laser-engraves Kenissi movement blanks, but does not name the MT5813, which Breitling made at launch.
    claims:
      - tbbc-tudor-additions
      - tbbc-emp-decoration
  - dimension: CF
    component: Case finishing
    performer: orolux
    relationship: external_specialist
    note: Fratello (2026) says Orolux finishes Tudor cases by machine, with the final edge work done by hand; stated for Tudor generally.
    claims:
      - tbbc-case-edges-by-hand
  - dimension: CF
    component: Craft at the Tudor manufacture
    performer: tudor
    relationship: internal
    note: SJX (2023) says only assembly and quality control are performed at the Tudor manufacture and calls it industrial production; no internal artisanal operation is described.
    claims:
      - tbbc-only-assembly
      - tbbc-industrial-production
  - dimension: WE
    component: Watch assembly and testing
    performer: tudor
    relationship: internal
    claims:
      - tbbc-watch-assembly
      - tbbc-tudor-assembled-tested
      - tbbc-dials-hands-attached
  - dimension: PD
    component: Product design and movement specification
    performer: tudor
    relationship: internal
    claims:
      - tbbc-dial-design
      - tbbc-tudor-additions
      - tbbc-exchange
claims:
  - id: tbbc-mt5813
    statement: A launch report says the Black Bay Chrono uses the MT5813 automatic chronograph movement.
    excerpt: At the heart of the Black Bay Chrono sits the new MT5813 automatic chronograph movement
    source: tudor-wornandwound-bb-chrono-2017
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-b01-template
    statement: The launch report says the MT5813 uses Breitling's B01 chronograph as a template.
    excerpt: using Breitling's top-of-the-line B01 chronograph movement as a template
    source: tudor-wornandwound-bb-chrono-2017
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-tudor-additions
    statement: The launch report says Tudor added new regulating parts, hairspring and finishes to the B01 base.
    excerpt: before adding new regulating parts, hairspring and finishes.
    source: tudor-wornandwound-bb-chrono-2017
    dimensions:
      - MM
      - CF
      - PD
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-exchange
    statement: The launch report says Breitling adapts its own version of the Tudor MT5612 in exchange.
    excerpt: In exchange, Breitling will adapt its own version of the Tudor MT5612
    source: tudor-wornandwound-bb-chrono-2017
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-made-by-breitling
    statement: A 2017 technical article reports that the MT5813 is manufactured by Breitling for Tudor.
    excerpt: It's made by Breitling for Tudor,
    source: tudor-sjx-mt5813-2017
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-regulator
    statement: "The 2017 article describes a Tudor regulator: a free-sprung balance with four adjustable masses."
    excerpt: More significant is the Tudor regulator, made up of a free sprung balance wheel with four adjustable masses,
    source: tudor-sjx-mt5813-2017
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-silicon
    statement: The 2017 article says the balance carries a silicon hairspring.
    excerpt: And the balance wheel is fitted with a silicon hairspring,
    source: tudor-sjx-mt5813-2017
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-kenissi-2026
    statement: A 2026 article reports that the MT5813 has been reworked by Tudor and is made at Tudor's Kenissi facility.
    excerpt: the MT5813 has been reworked by Tudor and is made inside Tudor's own Kenissi facility.
    source: tudor-sjx-bb-chrono-39-2026
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-case
    statement: The launch report describes a 41 mm case with a fixed steel tachymeter bezel and screw-down pushers.
    excerpt: the Black Bay Chrono adds a fixed stainless steel tachymeter bezel and classic Tudor/Rolex fluted screw-down pushers.
    source: tudor-wornandwound-bb-chrono-2017
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-dial-design
    statement: The launch report says the dial design is new for the Black Bay Chrono.
    excerpt: The dial design, however, is brand-new for the Black Bay Chrono
    source: tudor-wornandwound-bb-chrono-2017
    dimensions:
      - DH
      - PD
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-cases-orolux
    statement: A specialist site names Orolux as a Tudor case maker and Montremo as a dial maker among the suppliers visited; it does not tie them to a specific model.
    excerpt: Orolux in Le Noirmont, which manufactures watch cases
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
      - DH
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-watch-assembly
    statement: A factory-visit report says Tudor watches are assembled and tested in the Tudor building in Le Locle.
    excerpt: where Tudor watches are assembled and tested before being despatched to retailers.
    source: tudor-sjx-le-locle-2023
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: falk-index
    status: active
  - id: tbbc-tudor-assembled-tested
    statement: Tudor states that every Tudor watch is assembled and fully tested at its watch manufacture in Le Locle.
    excerpt: Every TUDOR watch is assembled and fully tested to TUDOR’s superior standards and at the brand’s watch Manufacture located in Le Locle, Switzerland.
    source: tudor-watch-manufacture-page
    dimensions:
      - WE
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-only-assembly
    statement: A 2023 factory-visit report says only assembly and quality control are performed at the Tudor manufacture, which relies on components from a network of suppliers.
    excerpt: Only assembly and quality control at performed at the manufacture, which relies on components from a network of suppliers mostly located in the Vallee de Joux.
    source: tudor-sjx-le-locle-2023
    dimensions:
      - EX
      - DH
      - CF
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-owns-supply-chain
    statement: The same report quotes a Tudor executive saying Tudor owns the majority of its supply chain, including at least one supplier for each category of components; it does not name which suppliers.
    excerpt: A Tudor executive revealed that Tudor owns majority of its supply chain, including at least one supplier for each category of components
    source: tudor-sjx-le-locle-2023
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-rolex-cases-history
    statement: The same report says Tudor historically relied on Rolex cases and outsourced movements; it does not say when that ended.
    excerpt: Historically the brand relied on Rolex cases and outsourced movements, and operated from several floors inside the Rolex campus in Geneva.
    source: tudor-sjx-le-locle-2023
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-industrial-production
    statement: The same report describes the Tudor manufacture as industrial production, with movements assembled by hand.
    excerpt: Make no mistake, the manufacture is all about industrial production – although movements are assembled by hand
    source: tudor-sjx-le-locle-2023
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-habillage-partners
    statement: A 2026 specialist report says Tudor has strategic partners for all external components (the habillage), separate from the movement ecosystem.
    excerpt: Alongside the ecosystem linked to the movements we just discussed, Tudor has also identified strategic partners for all external components
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-partners-other-brands
    statement: The same report says the habillage suppliers it visited work with other brands and have built strong partnerships with Tudor.
    excerpt: These visits allowed us to discover suppliers who work with different brands in the watch industry but have built particularly strong partnerships with Tudor.
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-no-shared-lines
    statement: The same report says Tudor and Rolex do not share production lines for key components.
    excerpt: There is no broad industrial synergy in the sense of shared production lines for key components.
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-case-blanks-joseph-baume
    statement: A 2026 supplier-tour report says Joseph Baume produces Tudor's case blanks.
    excerpt: Joseph Baume, the company tasked with producing Tudor’s case blanks
    source: tudor-fratello-suppliers-2026
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-cases-orolux-finishing
    statement: The same report says the case blanks go to Orolux, which mills and finishes the cases before they are shipped to Tudor's manufacture in Le Locle.
    excerpt: These case blanks then go across the road to Orolux.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-case-edges-by-hand
    statement: The same report says the final case finishing step at Orolux, mostly removing sharp edges, is done by hand.
    excerpt: The final touch (mostly removing any sharp edges) is done by hand.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-bracelets-detech
    statement: The same report says Detech manufactures Tudor's bracelets and clasp components.
    excerpt: Our final stop for the first day of our tour was Detech, which manufactures Tudor’s bracelets and clasp components.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-dials-montremo-supplier
    statement: The same report calls Montremo, in La Chaux-de-Fonds, Tudor's dial supplier.
    excerpt: The second day of our tour began in La Chaux-de-Fonds at Montremo, Tudor’s dial supplier.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-chrono-subdials-montremo
    statement: The same report, describing Montremo's dial work, says a galvanic black finish is applied there to the sub-dials of Tudor's chronograph models.
    excerpt: This is reserved for dials with metallic or sun-brushed finishes, as well as the sub-dials of the chronograph models.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-dials-hands-attached
    statement: The same report says dials and hands are attached and the certified movements cased by hand on the Tudor side of the Le Locle building.
    excerpt: Here, dials and hands are attached, and the now-certified movements are cased by hand.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - DH
      - WE
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-emp-decoration
    statement: The same report says EMP, a Tudor subsidiary making movement blanks, also sandblasts, diamond-bevels and laser-engraves those parts.
    excerpt: EMP also handles the sandblasting, diamond beveling, and laser engraving of these parts before sending them to a partner company for galvanization.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-silicon-elsewhere
    statement: The same report says Tudor's hairsprings are now all silicon and are therefore produced outside Kenitec.
    excerpt: This provides exceptional antimagnetism, but it also means that they are produced elsewhere.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - MM
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: tbbc-buys-cases
    statement: A 2022 article says Tudor today buys watch cases and other components from Swiss suppliers, which has not always been so.
    excerpt: Today (though it hasn't always), Tudor buys watch cases and other components from Swiss suppliers.
    source: tudor-gearpatrol-rolex-vs-tudor-2022
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
