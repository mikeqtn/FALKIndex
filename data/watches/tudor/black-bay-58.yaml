id: tudor/black-bay-58
brand: tudor
model: Black Bay 58
caliber: MT5402
notes: Handbook v0.2 §8 lists this record as "Tudor — Black Bay 58 / MT5402".
claims:
  - id: tbb58-mt5402
    statement: A launch review reports that the Black Bay Fifty-Eight introduced a new Tudor manufacture movement, calibre MT5402.
    excerpt: It's also now powered by a brand-new Tudor manufacture movement, the calibre MT5402.
    source: tudor-tt-bb58-2018
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-silicon-cosc
    statement: The same review lists a silicon balance spring and COSC certification for the MT5402.
    excerpt: a silicon balance spring, and COSC accuracy
    source: tudor-tt-bb58-2018
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-case-39
    statement: The same review gives a 39 mm case diameter.
    excerpt: The case of the Black Bay Fifty-Eight measures a very friendly 39mm across.
    source: tudor-tt-bb58-2018
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-kenissi-founded
    statement: A specialist site reports that Kenissi was founded in 2016 to develop and produce Tudor's movements.
    excerpt: In 2016, Kenissi was founded to handle the development and production of Tudor's movements
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - MA
      - MM
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-kenissi-all
    statement: "A factory-visit report states that Kenissi produces all of Tudor's in-house movements."
    excerpt: "Kenissi produces all of Tudor\u2019s in-house movements."
    source: tudor-sjx-le-locle-2023
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
    status: superseded
    superseded_by: tbb58-kenissi-all-others
  - id: tbb58-kenissi-all-others
    statement: "A factory-visit report states that Kenissi produces all of Tudor's in-house movements and also supplies movements to Chanel, Breitling and TAG Heuer, among others."
    excerpt: "Kenissi produces all of Tudor\u2019s in-house movements and also supplies movements to Chanel, Breitling, and TAG Heuer, amongst others."
    source: tudor-sjx-le-locle-2023
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-kenissi-assembly
    statement: The specialist site says Kenissi manufactures and assembles movements at its Le Locle facility.
    excerpt: Kenissi focuses on the manufacturing and assembly of movements at its Le Locle facility
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-kenissi-holding
    statement: The specialist site names Kenissi holding companies making movement blanks (EMP), oscillators (Kenitec) and stamped movement parts (Golay-Tec).
    excerpt: EMP manufactures movement blanks, Kenitec oscillators, and Golay-Tec small-stamped movement components.
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-silicon-supplier
    statement: The specialist site says the silicon components come from an external Swiss supplier.
    excerpt: These silicon components are produced by a specialised external Swiss supplier dedicated to silicon micro-components.
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-silicon-two-specialists
    statement: A 2023 factory-visit report says Tudor uses two silicon hairspring specialists and owns one of them.
    excerpt: Tudor relies on two specialists for silicon hairsprings, but owns one of them outright.
    source: tudor-sjx-le-locle-2023
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-cases-orolux
    statement: The specialist site names Orolux (Le Noirmont) as a case maker and Joseph Baume (Le Noirmont) as a case-blank maker among the suppliers visited; it does not tie them to a specific model.
    excerpt: Orolux in Le Noirmont, which manufactures watch cases
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-dials-montremo
    statement: The specialist site names Montremo (La Chaux-de-Fonds) as a dial maker among the suppliers visited; it does not tie it to a specific model.
    excerpt: Montremo in La Chaux-de-Fonds, which manufactures dials
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-bracelet-detech
    statement: The specialist site says Detech produces components for Tudor bracelets and clasps.
    excerpt: Detech, a company specialising in bar milling and screw machining, which produces components for Tudor bracelets and clasps
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-watch-assembly
    statement: The factory-visit report says Tudor watches are assembled and tested in the Tudor building in Le Locle before shipping.
    excerpt: where Tudor watches are assembled and tested before being despatched to retailers.
    source: tudor-sjx-le-locle-2023
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: tbb58-tudor-assembled-tested
    statement: Tudor states that every Tudor watch is assembled and fully tested at its watch manufacture in Le Locle.
    excerpt: "Every TUDOR watch is assembled and fully tested to TUDOR’s superior standards and at the brand’s watch Manufacture located in Le Locle, Switzerland."
    source: tudor-watch-manufacture-page
    dimensions:
      - WE
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-tudor-owned-affiliates
    statement: Tudor states that with Kenissi and a network of Tudor-owned affiliates it has integrated the development and production of its mechanical calibres.
    excerpt: With Kenissi and a network of TUDOR-owned affiliates, the brand has been able to integrate the development and production of high-performance mechanical calibers.
    source: tudor-watch-manufacture-page
    dimensions:
      - MM
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-only-assembly
    statement: A 2023 factory-visit report says only assembly and quality control are performed at the Tudor manufacture, which relies on components from a network of suppliers.
    excerpt: Only assembly and quality control at performed at the manufacture, which relies on components from a network of suppliers mostly located in the Vallee de Joux.
    source: tudor-sjx-le-locle-2023
    dimensions:
      - EX
      - DH
      - CF
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-owns-supply-chain
    statement: The same report quotes a Tudor executive saying Tudor owns the majority of its supply chain, including at least one supplier for each category of components; it does not name which suppliers.
    excerpt: A Tudor executive revealed that Tudor owns majority of its supply chain, including at least one supplier for each category of components
    source: tudor-sjx-le-locle-2023
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-rolex-cases-history
    statement: The same report says Tudor historically relied on Rolex cases and outsourced movements; it does not say when that ended.
    excerpt: Historically the brand relied on Rolex cases and outsourced movements, and operated from several floors inside the Rolex campus in Geneva.
    source: tudor-sjx-le-locle-2023
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-industrial-production
    statement: The same report describes the Tudor manufacture as industrial production, with movements assembled by hand.
    excerpt: "Make no mistake, the manufacture is all about industrial production – although movements are assembled by hand"
    source: tudor-sjx-le-locle-2023
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-habillage-partners
    statement: A 2026 specialist report says Tudor has strategic partners for all external components (the habillage), separate from the movement ecosystem.
    excerpt: Alongside the ecosystem linked to the movements we just discussed, Tudor has also identified strategic partners for all external components
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-partners-other-brands
    statement: The same report says the habillage suppliers it visited work with other brands and have built strong partnerships with Tudor.
    excerpt: These visits allowed us to discover suppliers who work with different brands in the watch industry but have built particularly strong partnerships with Tudor.
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
      - DH
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-no-shared-lines
    statement: The same report says Tudor and Rolex do not share production lines for key components.
    excerpt: There is no broad industrial synergy in the sense of shared production lines for key components.
    source: tudor-monochrome-kenissi-ecosystem
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-case-blanks-joseph-baume
    statement: A 2026 supplier-tour report says Joseph Baume produces Tudor's case blanks.
    excerpt: "Joseph Baume, the company tasked with producing Tudor’s case blanks"
    source: tudor-fratello-suppliers-2026
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-cases-orolux-finishing
    statement: The same report says the case blanks go to Orolux, which mills and finishes the cases before they are shipped to Tudor's manufacture in Le Locle.
    excerpt: These case blanks then go across the road to Orolux.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-case-edges-by-hand
    statement: The same report says the final case finishing step at Orolux, mostly removing sharp edges, is done by hand.
    excerpt: The final touch (mostly removing any sharp edges) is done by hand.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-bracelets-detech
    statement: The same report says Detech manufactures Tudor's bracelets and clasp components.
    excerpt: "Our final stop for the first day of our tour was Detech, which manufactures Tudor’s bracelets and clasp components."
    source: tudor-fratello-suppliers-2026
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-dials-montremo-supplier
    statement: The same report calls Montremo, in La Chaux-de-Fonds, Tudor's dial supplier.
    excerpt: "The second day of our tour began in La Chaux-de-Fonds at Montremo, Tudor’s dial supplier."
    source: tudor-fratello-suppliers-2026
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-dials-hands-attached
    statement: The same report says dials and hands are attached and the certified movements cased by hand on the Tudor side of the Le Locle building.
    excerpt: Here, dials and hands are attached, and the now-certified movements are cased by hand.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - DH
      - WE
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-emp-decoration
    statement: The same report says EMP, a Tudor subsidiary making movement blanks, also sandblasts, diamond-bevels and laser-engraves those parts.
    excerpt: EMP also handles the sandblasting, diamond beveling, and laser engraving of these parts before sending them to a partner company for galvanization.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-silicon-elsewhere
    statement: The same report says Tudor's hairsprings are now all silicon and are therefore produced outside Kenitec.
    excerpt: This provides exceptional antimagnetism, but it also means that they are produced elsewhere.
    source: tudor-fratello-suppliers-2026
    dimensions:
      - MM
    date_checked: 2026-11-17
    editor: falk-index
  - id: tbb58-buys-cases
    statement: A 2022 article says Tudor today buys watch cases and other components from Swiss suppliers, which has not always been so.
    excerpt: Today (though it hasn't always), Tudor buys watch cases and other components from Swiss suppliers.
    source: tudor-gearpatrol-rolex-vs-tudor-2022
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
