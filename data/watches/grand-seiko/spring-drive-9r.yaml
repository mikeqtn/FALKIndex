        value: 5
        rationale: Grand Seiko says the 9R is manufactured at the studio, including its IC and oscillator, developed with an IC Development Division. Who forms the Spron springs is not stated. Every non-U score here assumes the Shinshu Watch Studio, inside a Seiko Epson facility, counts as Grand Seiko's own or in-group work. The provenance records it as contract until that relationship is reviewed; if it stays contract, MM, EX, DH, CF and WE fall to 0.
        evidence:
          - claim: gs9r-made-assembled
            stance: supports
            note: Movement made at the studio.
          - claim: gs9r-studio-scope
