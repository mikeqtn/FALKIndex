id: grand-seiko/spring-drive-9r
brand: grand-seiko
model: Spring Drive
caliber: 9R
route_label: Shinshu
notes: Handbook v0.2 §8 lists this record as "Grand Seiko — Spring Drive 9R (Shinshu)".
claims:
  - id: gs9r-studio-scope
    statement: Grand Seiko says the Shinshu Watch Studio makes all its Spring Drive and quartz watches in-house.
    excerpt: makes all Grand Seiko’s Spring Drive and quartz watches in-house
    source: grand-seiko-shinshu
    dimensions:
      - MA
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-studio-functions
    statement: Grand Seiko says the studio covers movement development, design and production, and the manufacture, assembly and adjustment of complete watches including cases, dials, hands and indexes.
    excerpt: from the development, design and production of movements to the manufacture, assembly and adjustment of complete watches, including cases, dials, hands and indexes
    source: grand-seiko-shinshu
    dimensions:
      - MA
      - MM
      - EX
      - DH
      - WE
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-epson-facility
    statement: Grand Seiko says the Shinshu Watch Studio is located in a Seiko Epson facility in Shiojiri, Nagano.
    excerpt: The Shinshu Watch Studio is located in a Seiko Epson facility in the town of Shiojiri in Nagano Prefecture
    source: grand-seiko-shinshu
    dimensions:
      - MA
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-dial-assembly
    statement: Grand Seiko says studio staff plate and coat dial base plates and set the indexes and hands by hand.
    excerpt: they assemble each part, including the indexes and hands, by hand
    source: grand-seiko-shinshu
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-zaratsu
    statement: Grand Seiko says the studio carries out Zaratsu polishing of cases.
    excerpt: The studio is also expert in Zaratsu polishing.
    source: grand-seiko-shinshu
    dimensions:
      - EX
      - CF
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-made-assembled
    statement: Grand Seiko says the 9R Spring Drive movement is manufactured and hand-assembled at the Shinshu Watch Studio.
    excerpt: manufactured and hand-assembled at the Shinshu Watch Studio
    source: grand-seiko-spring-drive-page
    dimensions:
      - MA
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-ic-regulation
    statement: "Grand Seiko describes the 9R regulator: an IC compares a quartz reference signal with the rotation speed of the glide wheel."
    excerpt: The IC compares this reference signal with the actual rotation speed of the glide wheel.
    source: grand-seiko-spring-drive-page
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-ic-development
    statement: A Grand Seiko feature on Spring Drive says the studio worked with an IC Development Division to develop the integrated circuits.
    excerpt: we teamed up with the IC Development Division in moving to develop package integrated circuits
    source: grand-seiko-nagano-vol1
    dimensions:
      - MA
      - MM
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-craftsman-studio
    statement: A Grand Seiko feature says movement assembly, adjustment, casing and inspection are handled by the Craftsman Studio.
    excerpt: It likewise oversees movement assembly, adjustment, casing, and inspections by the Craftsman Studio
    source: grand-seiko-nagano-vol1
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-epson-plant
    statement: A visit report says Seiko Epson's Shiojiri plant houses most of Seiko's watch operation.
    excerpt: With over 800 employee's, Seiko Epson's Shiojiri Plant houses the bulk of Seiko's watch operation.
    source: watchonista-grand-seiko-visit
    dimensions:
      - MA
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-dials-cases
    statement: A visit report says cases and dials are produced at the Shiojiri plant.
    excerpt: At the brand's Shiojiri plant everything from cases to dials are produced
    source: watchonista-grand-seiko-visit
    dimensions:
      - EX
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: gs9r-spron
    statement: A visit report says a cobalt-nickel alloy (Spron) is used for the balance springs and mainsprings in all Grand Seiko watches.
    excerpt: This Cobalt-Nickel alloy is used for the balance and main springs in all Grand Seiko timepieces.
    source: watchonista-grand-seiko-visit
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
