    change_note: "First evidenced profile, drafted with AI from primary and secondary sources. Changes from version 1: MA 5 \u2192 4; MM 5 \u2192 0; EX 5 \u2192 0; DH 5 \u2192 0; CF 4 \u2192 0; WE 5 \u2192 0; PD 5 \u2192 4; confidence A \u2192 B; classification Integrated Manufacture \u2192 Design-led \u00c9tablisseur. The Shinshu Watch Studio is recorded as Seiko Epson contract work, so manufacturing is not credited as Grand Seiko's own; this is open for an editor to settle. Each score's rationale names its evidence."
    created_on: 2026-10-21
    scores:
      MA:
        value: 4
        rationale: "The 9R and its Tri-synchro regulator, an IC comparing a quartz reference with the glide wheel, are a calibre proprietary to Grand Seiko, but the provenance records their development at the Shinshu Watch Studio as Seiko Epson contract work. Under the rule that authorship is not manufacture, this is a proprietary calibre with substantial external engineering: 4."
        evidence:
          - claim: gs9r-ic-regulation
            stance: supports
            note: "Proprietary regulator."
          - claim: gs9r-studio-functions
            stance: supports
            note: "Development at the studio."
          - claim: gs9r-epson-facility
            stance: supports
            note: "The studio is in a Seiko Epson facility."
      MM:
        value: 0
        rationale: "The 9R, including its IC, oscillator and glide wheel, is made at the Shinshu Watch Studio, which a visit report places in Seiko Epson's Shiojiri plant and the provenance records as contract work. Who forms the Spron springs is not stated. The provenance records the Shinshu Watch Studio as Seiko Epson contract work. If an editor establishes it as Grand Seiko's own, this score rises."
        evidence:
