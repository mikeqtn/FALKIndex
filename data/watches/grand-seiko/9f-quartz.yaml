id: grand-seiko/9f-quartz
brand: grand-seiko
model: Quartz
caliber: 9F
route_label: Shinshu
notes: Handbook v0.2 §8 lists this record as "Grand Seiko — 9F Quartz (Shinshu)".
claims:
  - id: gs9f-origin
    statement: Grand Seiko says Caliber 9F is an exclusive Grand Seiko quartz movement first made in 1993.
    excerpt: Caliber 9F is an exclusive Grand Seiko quartz movement born in 1993.
    source: grand-seiko-quartz-9f
    dimensions:
      - MA
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-shinshu-made
    statement: Grand Seiko says the 9F is manufactured and assembled into complete watches at the Shinshu Watch Studio in Shiojiri.
    excerpt: It is manufactured and assembled into complete timepieces at the Shinshu Watch Studio, located in Shiojiri, Nagano Prefecture.
    source: grand-seiko-quartz-9f
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-oscillators
    statement: Grand Seiko says the quartz oscillators are made in-house and aged for three months before testing and selection.
    excerpt: As part of the process, quartz oscillators made in-house are first 'aged' for three months,
    source: grand-seiko-quartz-9f
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-twin-pulse
    statement: Grand Seiko describes a Twin Pulse Control Motor and a Backlash Auto-Adjust Mechanism in the 9F.
    excerpt: The 9F quartz movement makes this possible through its Twin Pulse Control Motor,
    source: grand-seiko-quartz-9f
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-studio-epson
    statement: Grand Seiko says the Shinshu Watch Studio is located in a Seiko Epson facility in Shiojiri.
    excerpt: The Shinshu Watch Studio is located in a Seiko Epson facility in the town of Shiojiri in Nagano Prefecture
    source: grand-seiko-shinshu
    dimensions:
      - WE
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-studio-complete
    statement: Grand Seiko says the studio handles manufacture, assembly and adjustment of complete watches including cases, dials, hands and indexes.
    excerpt: the manufacture, assembly and adjustment of complete watches, including cases, dials, hands and indexes
    source: grand-seiko-shinshu
    dimensions:
      - EX
      - DH
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-hand-assembled
    statement: Grand Seiko says the 9F is assembled and adjusted by hand.
    excerpt: Hand assembled and adjusted, Caliber 9F is the ultimate quartz movement.
    source: grand-seiko-shinshu
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-zaratsu
    statement: Grand Seiko says the studio does Zaratsu case polishing.
    excerpt: The studio is also expert in Zaratsu polishing.
    source: grand-seiko-shinshu
    dimensions:
      - EX
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-autoclaves
    statement: A specialist article says Seiko grows its quartz crystals in-house in large autoclaves.
    excerpt: Seiko makes its quartz crystals in-house, growing them in massive autoclaves that are some four stories high.
    source: sjx-seiko-9f-explained
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-ic-paired
    statement: The same article says each oscillator is paired with an integrated circuit programmed for that oscillator's behaviour.
    excerpt: Each quartz oscillator is then paired with an integrated circuit specially programmed for that particular oscillator's frequency and behaviour.
    source: sjx-seiko-9f-explained
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: gs9f-epson-assembly
    statement: The same article says all 9F movements are hand-assembled at Seiko Epson in Shiojiri.
    excerpt: All 9F movements are hand-assembled at Seiko Epson in Shiojiri, not far from Nagano.
    source: sjx-seiko-9f-explained
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
