  - dimension: EX
    component: Case (incl. Zaratsu polishing)
    performer: seiko-epson
    relationship: contract
    note: Grand Seiko says the Shinshu studio makes cases for its quartz and Spring Drive watches.
    claims:
      - gs9f-studio-complete
      - gs9f-zaratsu
  - dimension: DH
    component: Dial, hands and indexes
    performer: seiko-epson
    relationship: contract
    claims:
      - gs9f-studio-complete
  - dimension: CF
    component: Case polishing (Zaratsu)
    performer: seiko-epson
    relationship: contract
    claims:
      - gs9f-zaratsu
  - dimension: WE
