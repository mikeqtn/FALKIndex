    claims:
      - gs9f-hand-assembled
      - gs9f-epson-assembly
      - gs9f-studio-epson
      - gs9f-oscillators
  - dimension: PD
    component: Product design and development
    performer: grand-seiko
    relationship: internal
    claims:
      - gs9f-origin
