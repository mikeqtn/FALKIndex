    scores:
      MA:
        value: 1
        rationale: The calibre is a Sellita SW300-1 Elaborated (zmn64-sw300), but ZRC says it developed a specifically balanced oscillating mass with Sellita for the MN64 watches (zmn64-rotor). That is a custom specification of a stock calibre, so 1; nothing suggests a meaningful module or modification, so not 2.
        evidence:
          - claim: zmn64-sw300
            stance: supports
            note: Sellita SW300-1 base.
          - claim: zmn64-rotor
            stance: supports
            note: Custom oscillating mass developed with Sellita, naming the MN64 watches.
      MM:
        value: 0
        rationale: The movement is Sellita's (zmn64-sw300). ZRC's rotor claim (zmn64-rotor) describes development with Sellita, not internal parts manufacture, so the complete movement stays external.
        evidence:
          - claim: zmn64-sw300
            stance: supports
            note: External movement.
          - claim: zmn64-rotor
            stance: context
            note: Co-development; maker of the mass not named.
      EX:
        value: null
        rationale: The monobloc case, bracelet and clasp are specified, but no maker is named (zmn64-case, zmn64-bracelet, zmn64-clasp). Paperjam says the ZRC group mainly supplies cases and bracelets (zmn64-group-components, zmn64-case-knowhow), and that the 2015 relaunch model was made by an unnamed subcontractor (zmn64-relaunch-subcontractor); neither ties the current MN64 Metal's exterior to a maker, so EX stays U.
        evidence:
          - claim: zmn64-case
            stance: context
            note: Maker not named.
          - claim: zmn64-historic-cases
            stance: context
            note: Historical.
          - claim: zmn64-group-components
            stance: context
            note: Group capability, not tied to this watch.
          - claim: zmn64-case-knowhow
            stance: context
            note: Group know-how, not tied to this watch.
          - claim: zmn64-relaunch-subcontractor
            stance: context
            note: 2015 relaunch model, not this watch.
      DH:
        value: null
        rationale: No source names the dial or hand maker.
        evidence: []
      CF:
        value: null
        rationale: No source documents any finishing.
        evidence: []
      WE:
        value: null
        rationale: ZRC says its watches are assembled and produced in Switzerland without naming the workshop (zmn64-assembled, zmn64-swiss). Paperjam reports that the 2015 relaunch model's production was entrusted to an unnamed subcontractor (zmn64-relaunch-subcontractor), which points toward external production, but it concerns the 300-piece relaunch edition, not the current MN64 Metal. WE stays U until a source covers this watch.
        evidence:
          - claim: zmn64-assembled
            stance: context
            note: No workshop named.
          - claim: zmn64-swiss
            stance: context
            note: Country only.
          - claim: zmn64-relaunch-subcontractor
            stance: context
            note: Subcontracted production of the 2015 relaunch model.
      PD:
        value: 3
        rationale: ZRC specifies a Crown Protection System with the crown at 6 o'clock, an own clasp and an expandable dive link (zmn64-cps, zmn64-clasp, zmn64-bracelet), and says it developed a specific oscillating mass with Sellita (zmn64-rotor). Bespoke components and supplier-directed development around a stock movement give 3; no proprietary system of the depth needed for 4 is documented.
        evidence:
          - claim: zmn64-cps
            stance: supports
            note: Crown Protection System.
          - claim: zmn64-clasp
            stance: supports
            note: Own clasp.
          - claim: zmn64-bracelet
            stance: supports
            note: Dive link.
          - claim: zmn64-rotor
            stance: supports
            note: Supplier-directed rotor development.
