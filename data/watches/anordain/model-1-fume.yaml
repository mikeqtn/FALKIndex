claims:
  - id: ao-swiss-movements
    statement: Watches use Swiss movements from La Joux-Perret, Sellita and ETA.
    excerpt: Our watches run on good quality Swiss movements from La Joux-Perret G101, Sellita and ETA
    source: anordain-watchmaking
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-glasgow-modified
    statement: Movements are modified, regulated and assembled into watches at the Glasgow workshop.
    excerpt: We receive them at our Glasgow workshop, where they are modified to our needs, regulated and assembled into cased-up watches.
    source: anordain-watchmaking
    dimensions:
      - WE
      - MA
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-six-watchmakers
    statement: Each watch is hand-assembled by one of six in-house watchmakers.
    excerpt: Regardless of movement, each watch is carefully hand-assembled by one of our six in-house watchmakers.
    source: anordain-watchmaking
    dimensions:
      - WE
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-regulated
    statement: Every watch is regulated after assembly.
    excerpt: Once assembled, every watch is regulated to suit the wearer.
    source: anordain-watchmaking
    dimensions:
      - WE
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-amplitude
    statement: Balance amplitude is checked on a timegraph before assembly.
    excerpt: Before assembly, the amplitude – the swinging rate of the balance wheel – is checked with our timegraph
    source: anordain-watchmaking
    dimensions:
      - WE
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-hands
    statement: Hands are thermally treated to specific colours.
    excerpt: Our watch hands are thermally treated to specific colours
    source: anordain-watchmaking
    dimensions:
      - DH
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-enamellers
    statement: Three named enamellers make the enamel dials.
    excerpt: our three expert enamellers – Morna, Nicky and Sally – have spent years refining the practice of enamel dial making.
    source: anordain-enamelling
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-blank
    statement: Dial blanks are stamped from fine silver in the Glasgow studio.
    excerpt: We start by stamping a dial from a sheet of fine silver using a hydraulic press and a custom-made die at our Glasgow studio.
    source: anordain-enamelling
    dimensions:
      - DH
      - PD
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-fume
    statement: Fumé dials use the same vitreous enamel method on a domed silver base.
    excerpt: With the fumé dial, we follow our existing enamel method, but using a domed silver base.
    source: anordain-enamelling
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ao-fired-printed
    statement: Dials are fired, printed and cured before going to the watchmakers.
    excerpt: After enamelling, the dials are fired, printed and cured, then passed on to our watchmakers for assembly.
    source: anordain-enamelling
    dimensions:
      - DH
      - WE
    date_checked: 2026-10-13
    editor: ai-draft
