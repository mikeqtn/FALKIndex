id: anordain/model-1-fabrik
brand: anordain
model: Model 1 Fabrik
notes: Handbook v0.2 §8 lists this record as "anOrdain — Model 1 Fabrik".
claims:
  - id: am1f-dial-cador
    statement: A retailer's collection page says the Fabrik dials came from a relationship with Cador, a German dial manufacturer.
    excerpt: This quest led to a relationship with Cador, a German dial manufacturer known for its skill in precious metals.
    source: coveted-anordain-fabrik-model-1
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am1f-lacquer-process
    statement: The same page describes the dial finish as many stacked and cured lacquer coats.
    excerpt: The semi-matte and transparent lacquer finishes are obtained by stacking and curing many coatings
    source: coveted-anordain-fabrik-model-1
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am1f-ljp-g101
    statement: The same page lists the La Joux-Perret G101 automatic as the Fabrik Model 1 movement.
    excerpt: The watch is driven by the La Joux-Perret G101 movement, an automatic caliber known for its dependability and quality.
    source: coveted-anordain-fabrik-model-1
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am1f-case
    statement: The same page lists a 38 mm stainless steel case carried over from the Model 1, without naming its maker.
    excerpt: The Fabrik Model 1 retains the characteristic 38mm stainless steel casing of the original Model 1
    source: coveted-anordain-fabrik-model-1
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am1f-gmt-lacquer
    statement: A launch article for the Fabrik Model 1 GMT variant describes a German-made lacquer dial and varnished brass hands.
    excerpt: The Fabrik Model 1 GMT features a deep purple dial that is finished in a German-made lacquer
    source: acquire-anordain-fabrik-gmt
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am1f-swiss-movements
    statement: The maker says its watches use Swiss movements from La Joux-Perret (G101), Sellita and ETA.
    excerpt: Our watches run on good quality Swiss movements from La Joux-Perret G101, Sellita and ETA
    source: anordain-watchmaking
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am1f-modified-regulated
    statement: The maker says movements are modified to its needs, regulated and cased up in its Glasgow workshop.
    excerpt: where they are modified to our needs, regulated and assembled into cased-up watches
    source: anordain-watchmaking
    dimensions:
      - WE
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am1f-hand-assembled
    statement: The maker says each watch is hand-assembled by one of six in-house watchmakers.
    excerpt: each watch is carefully hand-assembled by one of our six in-house watchmakers
    source: anordain-watchmaking
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am1f-hands-designed
    statement: A review reports anOrdain designed and prototyped its Model 1 and Model 2 hands in-house; it does not say who manufactures them.
    excerpt: These hands were designed and prototyped in-house, with both the Model 1 and Model 2 featuring different styles.
    source: deployant-anordain-model-2-mkii
    dimensions:
      - DH
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
