id: anordain/model-1-fabrik
brand: anordain
model: Model 1 Fabrik
notes: Handbook v0.2 §8 lists this record as "anOrdain — Model 1 Fabrik".
claims:
  - id: am1f-dial-cador
    statement: A retailer's collection page says the Fabrik dials came from a relationship with Cador, a German dial manufacturer.
    excerpt: This quest led to a relationship with Cador, a German dial manufacturer known for its skill in precious metals.
    source: coveted-anordain-fabrik-model-1
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-lacquer-process
    statement: The same page describes the dial finish as many stacked and cured lacquer coats.
    excerpt: The semi-matte and transparent lacquer finishes are obtained by stacking and curing many coatings
    source: coveted-anordain-fabrik-model-1
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-ljp-g101
    statement: The same page lists the La Joux-Perret G101 automatic as the Fabrik Model 1 movement.
    excerpt: The watch is driven by the La Joux-Perret G101 movement, an automatic caliber known for its dependability and quality.
    source: coveted-anordain-fabrik-model-1
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-case
    statement: The same page lists a 38 mm stainless steel case carried over from the Model 1, without naming its maker.
    excerpt: The Fabrik Model 1 retains the characteristic 38mm stainless steel casing of the original Model 1
    source: coveted-anordain-fabrik-model-1
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-gmt-lacquer
    statement: A launch article for the Fabrik Model 1 GMT variant describes a German-made lacquer dial and varnished brass hands.
    excerpt: The Fabrik Model 1 GMT features a deep purple dial that is finished in a German-made lacquer
    source: acquire-anordain-fabrik-gmt
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-swiss-movements
    statement: The maker says its watches use Swiss movements from La Joux-Perret (G101), Sellita and ETA.
    excerpt: Our watches run on good quality Swiss movements from La Joux-Perret G101, Sellita and ETA
    source: anordain-watchmaking
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-modified-regulated
    statement: The maker says movements are modified to its needs, regulated and cased up in its Glasgow workshop.
    excerpt: where they are modified to our needs, regulated and assembled into cased-up watches
    source: anordain-watchmaking
    dimensions:
      - WE
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-hand-assembled
    statement: The maker says each watch is hand-assembled by one of six in-house watchmakers.
    excerpt: each watch is carefully hand-assembled by one of our six in-house watchmakers
    source: anordain-watchmaking
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-hands-designed
    statement: A review reports anOrdain designed and prototyped its Model 1 and Model 2 hands in-house; it does not say who manufactures them.
    excerpt: These hands were designed and prototyped in-house, with both the Model 1 and Model 2 featuring different styles.
    source: deployant-anordain-model-2-mkii
    dimensions:
      - DH
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: am1f-v3-cador-partnership
    statement: anOrdain's launch post says the Fabrik collection continues its partnership with Cador, with dials in semi-matte and transparent coloured lacquers.
    excerpt: The Fabrik collection continues our partnership with Cador, forming a new series of non-limited watches in a range of semi-matte and transparent coloured lacquers
    source: anordain-introducing-fabrik
    dimensions:
      - DH
      - PD
    date_checked: 2026-11-17
    editor: falk-index
  - id: am1f-v3-out-of-house
    statement: The same post calls the Fabrik dial production out-of-house, contrasting it with the brand's own enamel dials.
    excerpt: This out-of-house production means a considerably shorter lead time than you’ll be used to with our enamel dials.
    source: anordain-introducing-fabrik
    dimensions:
      - DH
      - CF
    date_checked: 2026-11-17
    editor: falk-index
  - id: am1f-v3-made-in-germany
    statement: The same post says the Fabrik name refers to the dials being made in Germany.
    excerpt: the name Fabrik is a nod to the impeccable quality of these made-in-Germany dials
    source: anordain-introducing-fabrik
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
  - id: am1f-v3-lacquer-sprayed
    statement: The same post says the Fabrik Model 1 dial is made by spraying layers of semi-opaque lacquer, then curing and printing the dial; it describes this alongside the out-of-house dial production.
    excerpt: multiple layers of semi-opaque lacquer are sprayed with great precision onto the dial surface before the dial is cured and printed
    source: anordain-introducing-fabrik
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
  - id: am1f-v3-handset-thermal
    statement: The same post says that once the dials arrive in Scotland, anOrdain's watchmakers thermally treat the handset and then assemble and regulate each Fabrik watch.
    excerpt: "When the dials arrive in Scotland, the rest of the watch is then assembled like any other anOrdain model: our watchmakers thermally treat the handset before the assembly and regulation of each piece."
    source: anordain-introducing-fabrik
    dimensions:
      - DH
      - CF
      - WE
    date_checked: 2026-11-17
    editor: falk-index
  - id: am1f-v3-ljp-g101-brand
    statement: The same post names the La Joux-Perret G101 as the movement of the Fabrik series.
    excerpt: The movement used for the Fabrik series is the LJP-G101, a new high-beat offering from La Joux-Perret
    source: anordain-introducing-fabrik
    dimensions:
      - MA
      - MM
    date_checked: 2026-11-17
    editor: falk-index
  - id: am1f-v3-contour-grooves
    statement: The same post says the concentric grooves on the Fabrik outer dial were drawn from the contour lines of antique Ordnance Survey maps.
    excerpt: "The contour lines on those old OS maps also inspired another key detail of the Fabrik watches: the concentric grooves, which bring a sense of depth and texture to the outer dial."
    source: anordain-introducing-fabrik
    dimensions:
      - PD
    date_checked: 2026-11-17
    editor: falk-index
  - id: am1f-v3-hands-estima
    statement: A 2018 Quill & Pad long-term test of the first-generation Model 1 reports its hands were designed by anOrdain and made by Estima in Switzerland; it predates the Fabrik and does not cover it.
    excerpt: The distinctive hands were designed by anOrdain and manufactured by specialist producer Estima in Switzerland
    source: quillandpad-anordain-model-1-long-term
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
