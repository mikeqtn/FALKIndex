id: anordain/model-2-porcelain
brand: anordain
model: Model 2 Porcelain
notes: Handbook v0.2 §8 lists this record as "anOrdain — Model 2 Porcelain".
claims:
  - id: am2p-dial-inhouse
    statement: A specialist site reports the porcelain dials are produced in-house by porcelain artist Cara Louise.
    excerpt: The dials are produced in-house by porcelain artist Cara Louise
    source: crownwatchblog-anordain-model-2-porcelain
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am2p-pottery-space
    statement: The same article reports the studio set up its own pottery space and had produced 40 dials meeting its standard at launch.
    excerpt: The studio set up its own pottery space to develop this craft and has produced 40 dials that are up to their standard so far.
    source: crownwatchblog-anordain-model-2-porcelain
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am2p-ljp-g101
    statement: The same article reports a La Joux-Perret G101 movement.
    excerpt: The anOrdain Model 2 Porcelain is equipped with a La Joux-Perret G101 movement
    source: crownwatchblog-anordain-model-2-porcelain
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am2p-stoke
    statement: A review reports the porcelain dials were developed with help from artisans in Stoke-on-Trent.
    excerpt: with the help of artisans from Stoke-on-Trent
    source: timeandtide-anordain-model-2-porcelain
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am2p-firing
    statement: The same review describes a clay base with a vitreous glaze fired at up to 1,300 °C.
    excerpt: to which a vitreous glaze is applied and fired up to 1,300 degrees Celsius.
    source: timeandtide-anordain-model-2-porcelain
    dimensions:
      - DH
      - CF
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am2p-swiss-movements
    statement: The maker says its watches use Swiss movements from La Joux-Perret (G101), Sellita and ETA.
    excerpt: Our watches run on good quality Swiss movements from La Joux-Perret G101, Sellita and ETA
    source: anordain-watchmaking
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am2p-modified-regulated
    statement: The maker says movements are modified to its needs, regulated and cased up in its workshop.
    excerpt: where they are modified to our needs, regulated and assembled into cased-up watches
    source: anordain-watchmaking
    dimensions:
      - WE
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am2p-hand-assembled
    statement: The maker says each watch is hand-assembled by one of six in-house watchmakers.
    excerpt: each watch is carefully hand-assembled by one of our six in-house watchmakers
    source: anordain-watchmaking
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
  - id: am2p-hands-designed
    statement: A review of the Model 2 mkII reports the hands were designed and prototyped in-house; it does not say who manufactures them.
    excerpt: These hands were designed and prototyped in-house, with both the Model 1 and Model 2 featuring different styles.
    source: deployant-anordain-model-2-mkii
    dimensions:
      - DH
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
