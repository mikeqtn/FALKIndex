      MA:
        value: 5
        rationale: A specialist review describes calibre 3230 as a new in-house Rolex calibre with the Rolex-patented Chronergy escapement (rsub-3230, rsub-chronergy). Rolex says its Bienne site is entirely dedicated to developing and manufacturing Rolex movements (rsub-geo-bienne-dev), a brand-wide statement that covers this calibre.
