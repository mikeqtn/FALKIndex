            stance: supports
            note: Rolex says it develops all its movements at Bienne.
      MM:
        value: 5
        rationale: Rolex says its movements are developed and manufactured at Bienne, with components manufactured there and then assembled by hand (rsub-geo-bienne-dev, rsub-geo-bienne-hand). A specialist review says the Parachrom hairspring is made by Rolex and the Chronergy escapement is Rolex's own (rsub-parachrom, rsub-chronergy), which is the escapement depth level 5 asks for.
        evidence:
          - claim: rsub-geo-bienne-dev
            stance: supports
            note: Movement manufacture at Bienne, Rolex's own words.
          - claim: rsub-geo-bienne-hand
            stance: supports
            note: Components manufactured at Bienne.
          - claim: rsub-parachrom
            stance: supports
            note: Own hairspring.
          - claim: rolex-bienne
            stance: supports
            note: Movement manufacture (2014 report).
          - claim: rsub-chronergy
            stance: supports
            note: Own escapement.
          - claim: rsub-3230
            stance: supports
            note: In-house calibre.
      EX:
        value: 4
        rationale: Rolex says all case and bracelet development and production happens at Plan-les-Ouates (rsub-geo-plo-finishing), and the 124060 product page says its Cerachrom bezel insert is manufactured by Rolex (rsub-page-cerachrom, rsub-geo-cerachrom). No source reached names who makes the sapphire crystal, so this stays at 4 rather than 5.
        evidence:
          - claim: rsub-geo-plo-finishing
            stance: supports
            note: Cases and bracelets made at Plan-les-Ouates, Rolex's own words.
          - claim: rsub-page-cerachrom
            stance: supports
            note: This model's bezel insert made by Rolex.
          - claim: rsub-geo-cerachrom
            stance: supports
            note: Cerachrom inserts produced at Chêne-Bourg.
          - claim: rolex-plo-cases
            stance: supports
            note: Cases and bracelets (2014 report).
          - claim: rsub-steel
            stance: context
            note: 904L steel.
          - claim: rsub-bracelet
            stance: context
            note: Redesigned bracelet.
      DH:
        value: 3
        rationale: Rolex says all dial development and production happens at Chêne-Bourg (rsub-geo-dials, rolex-chene-bourg). A 2014 report says Rolex buys its hands from a specialist producer (rolex-hands-bought), and no newer source reached says otherwise, so hand manufacture is not credited and this is not 4.
        evidence:
          - claim: rsub-geo-dials
            stance: supports
            note: Dial production in-house, Rolex's own words.
          - claim: rolex-chene-bourg
            stance: supports
            note: Dials in-house (2014 report).
          - claim: rolex-hands-bought
            stance: context
            note: Hands bought in (2014).
          - claim: rsub-lume
            stance: context
            note: Lume.
      CF:
        value: 2
        rationale: Rolex says completed case and bracelet parts are finished manually at its Plan-les-Ouates site (rsub-geo-plo-finishing), a brand-wide statement that covers this model's case and bracelet. That is regular skilled handwork done internally, but no source reached describes hand finishing or decoration of calibre 3230, and finishing is not presented as central to the product, so this is 2 rather than 3. Borderline with 1, read as 2 because the manual finishing applies to every case and bracelet.
        evidence:
          - claim: rsub-geo-plo-finishing
            stance: supports
            note: Manual finishing of cases and bracelets in-house.
      WE:
        value: 3
        rationale: Rolex says movements are assembled by hand at Bienne and finished watches are tested at Acacias before Superlative Chronometer certification (rsub-geo-bienne-hand, rsub-geo-acacias-tests); the product page lists Rolex certification after casing (rsub-page-certification). No claim describes regulation, adjustment or complication work, which caps this at 3.
        evidence:
