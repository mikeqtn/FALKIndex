    scores:
      MA:
        value: 4
        rationale: The SXH5 was designed from scratch by Czapek's own constructor, a proprietary caliber whose parts are made by partners ("designed in-house, made by partners"). Level 5 is arguable since the engineering is internal; it is held at 4 until the scope of partner engineering is known.
        evidence:
          - claim: cz-ant-martinez
            stance: supports
            note: In-house design.
          - claim: cz-ant-first-in-house
            stance: context
            note: Marketing term; the design claim above carries the score.
      MM:
        value: 0
        rationale: The movement parts are made by named partners, and no part is documented as made by Czapek.
        evidence:
          - claim: cz-ant-partners
            stance: supports
            note: External parts manufacture.
          - claim: cz-ant-chronode-past
            stance: context
            note: Earlier calibers were also made with a partner.
      EX:
        value: null
        rationale: No source names the case or bracelet maker. U until found (handbook score was 0).
        evidence: []
      DH:
        value: 0
        rationale: The dial is made by Metalem.
        evidence:
          - claim: cz-ant-dial
            stance: supports
            note: External dial maker.
      CF:
        value: null
        rationale: The movement is hand-finished, but no source says whether Czapek or a partner does it. U (handbook score was 3).
        evidence:
          - claim: cz-ant-finishing
            stance: context
            note: Finishing exists; performer unknown.
      WE:
        value: 4
        rationale: A Czapek watchmaker assembled the SXH5 prototype, and the movement is presented as assembled in-house. Series assembly and adjustment are not described directly.
        evidence:
          - claim: cz-ant-assembly
            stance: supports
            note: In-house assembly of the movement.
      PD:
        value: 5
        rationale: Czapek conceived the caliber from scratch and directs a network of specialist suppliers.
        evidence:
          - claim: cz-ant-martinez
            stance: supports
            note: Original engineering.
          - claim: cz-ant-partners
            stance: supports
            note: Supplier direction.
