claims:
  - id: cz-ant-martinez
    statement: The SXH5 was designed from scratch by Czapek's constructor, Dan Martinez.
    excerpt: It was conceived from scratch by the brand's constructor Dan Martinez
    source: monochrome-czapek-antarctique
    dimensions:
      - MA
      - PD
    date_checked: 2026-10-13
    editor: falk-index
  - id: cz-ant-partners
    statement: SXH5 parts are made by partners including AB Product, Générale Ressorts and Atokalpa.
    excerpt: "with parts manufactured by several partners: AB product, Générale de resort or Atokalpa"
    source: monochrome-czapek-antarctique
    dimensions:
      - MM
      - PD
    date_checked: 2026-10-13
    editor: falk-index
  - id: cz-ant-first-in-house
    statement: The SXH5 is described as the brand's first in-house movement.
    excerpt: the brand's first in-house movement
    source: monochrome-czapek-antarctique
    dimensions:
      - MA
    date_checked: 2026-10-13
    editor: falk-index
  - id: cz-ant-assembly
    statement: A Czapek watchmaker assembled the first Antarctique prototype.
    excerpt: Czapek's watchmaker, Julian, assembling the first Antarctique prototype, equipped with the calibre SXH5.
    source: monochrome-czapek-antarctique
    dimensions:
      - WE
    date_checked: 2026-10-13
    editor: falk-index
  - id: cz-ant-finishing
    statement: The movement has hand-chamfered inward angles and drawn flanks.
    excerpt: It is modern but elaborate with hand chamfering of the inward angles and drawing of the flanks.
    source: monochrome-czapek-antarctique
    dimensions:
      - CF
    date_checked: 2026-10-13
    editor: falk-index
  - id: cz-ant-dial
    statement: The dial is made by Metalem in Le Locle.
    excerpt: The dial of the Czapek Antarctique is made by Metalem (a Le Locle-based dial maker and long-standing Czapek partner).
    source: monochrome-czapek-antarctique
    dimensions:
      - DH
    date_checked: 2026-10-13
    editor: falk-index
  - id: cz-ant-chronode-past
    statement: Before the SXH5, Czapek made its movements with Chronode.
    excerpt: Until now, Czapek has been manufacturing its movements with Chronode
    source: monochrome-czapek-antarctique
    dimensions:
      - MM
    date_checked: 2026-10-13
    editor: falk-index
