    created_on: 2026-11-17
    scores:
      MA:
        value: 4
        rationale: The SXH5 was designed from scratch by Czapek's own constructor (cz-ant-martinez), a proprietary caliber whose parts are made by partners. Level 5 is arguable since the engineering is internal; it is held at 4 until the scope of partner engineering is known.
        evidence:
          - claim: cz-ant-martinez
            stance: supports
            note: In-house design.
          - claim: cz-ant-first-in-house
            stance: context
            note: Marketing term; the design claim above carries the score.
      MM:
        value: 0
        rationale: The movement parts are made by named partners (cz-ant-partners), and no part is documented as made by Czapek. Earlier calibers were also made with a partner (cz-ant-chronode-past).
        evidence:
          - claim: cz-ant-partners
            stance: supports
            note: External parts manufacture.
          - claim: cz-ant-chronode-past
            stance: context
            note: Earlier calibers were also made with a partner.
      EX:
        value: 3
        rationale: Deployant reported in 2024 that Czapek makes the steel Antarctique cases and bracelets in-house, while titanium cases and bracelets are made by AB Concept / AB Product (cz-ant-steel-case, cz-ant-ti-case-ab). Case and bracelet are two principal exterior families, which reads as level 3 for the steel version. It is not 4 because the claim rests on one secondary report, does not cover crowns or other hardware, does not state when in-house case making began relative to the 2020 launch, and titanium versions are external. Borderline between 3 and 4.
        evidence:
          - claim: cz-ant-steel-case
            stance: supports
            note: Steel case and bracelet made in-house; titanium outsourced.
          - claim: cz-ant-ti-case-ab
            stance: context
            note: Names the external maker of titanium cases and bracelets.
      DH:
        value: 0
        rationale: The dial is made by Metalem (cz-ant-dial). No dial or hand work is documented as internal.
        evidence:
          - claim: cz-ant-dial
            stance: supports
            note: External dial maker.
      CF:
        value: 0
        rationale: The SXH5 is hand-finished (cz-ant-finishing), and Czapek's own blog says Chronode won a blind test to decorate the SXH5 bridges and does its beveling, chamfering and drawing by hand (cz-ant-chronode-bridges, cz-ant-chronode-handwork). External artisan work does not raise CF, so no internal craft is documented. The score is borderline because another Czapek post says of the bridges "we will finish them by hand" (cz-ant-jewel-bridge), which may mean the Czapek supplier network rather than Czapek's own bench; it is read as context, not as internal craft.
        evidence:
          - claim: cz-ant-chronode-bridges
            stance: supports
            note: Bridge decoration awarded to an external specialist.
          - claim: cz-ant-chronode-handwork
            stance: supports
            note: The hand finishing is Chronode's work.
          - claim: cz-ant-finishing
            stance: context
            note: Finishing exists.
          - claim: cz-ant-jewel-bridge
            stance: context
            note: Ambiguous "we"; does not name an internal performer.
      WE:
        value: 4
        rationale: A Czapek watchmaker assembled the SXH5 prototype (cz-ant-assembly), and Czapek says it extended running-in and quality testing so its watchmakers can fine-tune the caliber (cz-ant-lapping). Fine-tuning by the brand's watchmakers is the adjustment work that §5 requires above 3. Not 5 because no complication work or end-to-end construction is documented.
        evidence:
          - claim: cz-ant-assembly
            stance: supports
            note: In-house assembly of the movement.
          - claim: cz-ant-lapping
            stance: supports
            note: Adjustment by Czapek's watchmakers.
      PD:
        value: 5
        rationale: Czapek conceived the caliber from scratch (cz-ant-martinez) and directs a network of specialist suppliers (cz-ant-partners), including choosing the bridge finisher by blind test (cz-ant-chronode-bridges).
        evidence:
          - claim: cz-ant-martinez
            stance: supports
            note: Original engineering.
          - claim: cz-ant-partners
            stance: supports
            note: Supplier direction.
          - claim: cz-ant-chronode-bridges
            stance: supports
            note: Czapek selected the finisher.
    classification:
      - design_led_etablisseur
      - independent_manufacture
