claims:
  - id: cz-ant-martinez
    statement: The SXH5 was designed from scratch by Czapek's constructor, Dan Martinez.
    excerpt: It was conceived from scratch by the brand's constructor Dan Martinez
    source: monochrome-czapek-antarctique
    dimensions:
      - MA
      - PD
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: cz-ant-partners
    statement: SXH5 parts are made by partners including AB Product, Générale Ressorts and Atokalpa.
    excerpt: "with parts manufactured by several partners: AB product, Générale de resort or Atokalpa"
    source: monochrome-czapek-antarctique
    dimensions:
      - MM
      - PD
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: cz-ant-first-in-house
    statement: The SXH5 is described as the brand's first in-house movement.
    excerpt: the brand's first in-house movement
    source: monochrome-czapek-antarctique
    dimensions:
      - MA
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: cz-ant-assembly
    statement: A Czapek watchmaker assembled the first Antarctique prototype.
    excerpt: Czapek's watchmaker, Julian, assembling the first Antarctique prototype, equipped with the calibre SXH5.
    source: monochrome-czapek-antarctique
    dimensions:
      - WE
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: cz-ant-finishing
    statement: The movement has hand-chamfered inward angles and drawn flanks.
    excerpt: It is modern but elaborate with hand chamfering of the inward angles and drawing of the flanks.
    source: monochrome-czapek-antarctique
    dimensions:
      - CF
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: cz-ant-dial
    statement: The dial is made by Metalem in Le Locle.
    excerpt: The dial of the Czapek Antarctique is made by Metalem (a Le Locle-based dial maker and long-standing Czapek partner).
    source: monochrome-czapek-antarctique
    dimensions:
      - DH
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: cz-ant-chronode-past
    statement: Before the SXH5, Czapek made its movements with Chronode.
    excerpt: Until now, Czapek has been manufacturing its movements with Chronode
    source: monochrome-czapek-antarctique
    dimensions:
      - MM
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: cz-ant-chronode-bridges
    statement: Czapek's Antarctique blog says Chronode won a blind test among craftsmen to decorate the SXH5 bridges.
    excerpt: And it comes with no bias and no surprise that one of Czapek’s “historical” first partners, Chronode, triumphed.
    source: czapek-blog-antarctique-episode-3
    dimensions:
      - CF
      - PD
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: cz-ant-chronode-handwork
    statement: Czapek's Antarctique blog says Chronode specializes in beveling, chamfering, metal drawing and other finishing done by hand.
    excerpt: They specialize in beveling, chamfering, metal drawing and other finishings, all done manually by hand.
    source: czapek-blog-antarctique-episode-3
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: cz-ant-jewel-bridge
    statement: Czapek's Antarctique blog says the SXH5 bridges arrive pre-chamfered, sand-blasted and engraved, and are then finished by hand.
    excerpt: A jewel set on beautiful bridge that has been pre-champfered (we will finish them by hand of course), sand-blasted and engraved!
    source: czapek-blog-setting-jewels-on-bridges
    dimensions:
      - CF
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: cz-ant-lapping
    statement: Czapek says it extended running-in and quality testing so its watchmakers can fine-tune the SXH5.
    excerpt: This longer process allows our watchmakers to fine tune the caliber even better and detect possible issues.
    source: czapek-blog-perpetual-improvement
    dimensions:
      - WE
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: cz-ant-steel-case
    statement: A 2024 Deployant report says Czapek makes the steel Antarctique cases and bracelets in-house and outsources the titanium ones.
    excerpt: While the steel Antarctique cases and bracelets are made in-house in Czapek, they outsource the titanium cases and bracelets as these require special techniques and know-how.
    source: deployant-czapek-suppliers-2024
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: cz-ant-ti-case-ab
    statement: A 2024 Deployant report says Czapek's titanium cases and bracelets are made at AB Concept and AB Product.
    excerpt: Again, we were fortunate that Czapek CEO, Xavier de Roquemaurel goes in-depth to show us how the enamel dials are made at Donzé Cadrans and how the titanium case and bracelets are made at ABConcept & ABProduct.
    source: deployant-czapek-suppliers-2024
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
