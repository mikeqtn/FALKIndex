        rationale: Baltic lists Hong Kong for most of its components and France only for assembly, adjustment and straps (aqs-hk-components, aqs-france-scope), and says it partners with outside manufacturers (aqs-partner-makers). Europa Star reports the components are shipped from Hong Kong to Besançon for assembly (aqs-es-components-hk). Read together, these place dial and hand making outside Baltic. Borderline with U, because no source names the dial or hand maker and none speaks of the dial or hands specifically.
