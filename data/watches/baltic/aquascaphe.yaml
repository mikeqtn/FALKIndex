        rationale: The complete movement is bought in (aqs-miyota-9039), a Time+Tide review says movements come from Asia (aqs-parts-asia), and Baltic says most components are made in Hong Kong (aqs-hk-components). No movement part is documented as made by Baltic.
        evidence:
