    independent_watchmaker: false
    status: published
    editor: mikeqtn
    change_note: "First evidenced profile. Proposed: MA 4 → 3 (sources describe a modified Chronode C101, not a new caliber); EX 0 → U and WE 1 → U (no source on the case maker or assembly); PD 5 → 4 (the engineering is Chronode's). Confidence B → C: all evidence is secondary, and the brand site could not be read. Reviewed and approved by mikeqtn on 2026-10-14."
    created_on: 2026-10-13
    scores:
      MA:
        value: 3
        rationale: The FM-01 is Chronode's C101 with a new balance bridge, click spring assembly and power reserve indication, developed with Jean-François Mojon. That is more than a cosmetic change but not a new caliber. Level 2 is defensible; 4 would need a source showing broader re-engineering.
        evidence:
          - claim: fl-s1-c101
            stance: supports
            note: Base caliber.
          - claim: fl-s1-modified
            stance: supports
            note: Extent of modification.
          - claim: fl-s1-mojon
            stance: context
            note: Engineering partner.
      MM:
        value: 0
        rationale: The movement is made by Chronode; no movement part is made by the brand.
        evidence:
          - claim: fl-s1-chronode
            stance: supports
            note: Movement created by Chronode.
      EX:
        value: null
        rationale: The case is the brand's design, but no source names who makes it. U until a source is found (handbook score was 0).
        evidence:
          - claim: fl-s1-case-design
            stance: context
            note: Design only, not manufacture.
      DH:
        value: 0
        rationale: All dials are made by Comblémine. Hands are not covered by any source.
        evidence:
          - claim: fl-s1-dials
            stance: supports
            note: External dial maker.
      CF:
        value: 0
        rationale: No internal craft is documented; the hand finishing belongs to Comblémine and Chronode.
        evidence:
          - claim: fl-s1-dials
            stance: supports
            note: Dial craft is external.
          - claim: fl-s1-not-watchmaker
            stance: context
            note: No in-house workshop is described.
      WE:
        value: null
        rationale: No source says where the watch is assembled or regulated. U (handbook score was 1).
        evidence:
          - claim: fl-s1-not-watchmaker
            stance: context
            note: The brand has no described watchmaking team.
      PD:
        value: 4
        rationale: The brand designed the watch, held the case to its design through two years of development, and commissioned the movement modifications. The deep engineering is Chronode's, so 5 is not supported on current evidence.
        evidence:
          - claim: fl-s1-case-design
            stance: supports
            note: Original design direction.
          - claim: fl-s1-mojon
            stance: supports
            note: Commissioned technical development.
    classification:
      - design_led_etablisseur
