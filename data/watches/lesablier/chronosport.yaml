        rationale: The brand lists the case finishes, but no source says who applies them or documents any craft work done by Lesablier.
        evidence: []
      WE:
        value: null
        rationale: No source says where or by whom the Chronosport is assembled. The brand says the later Travelgraph is built in the Washington, D.C. area, but does not say this for the Chronosport.
        evidence: []
      PD:
        value: 3
        rationale: The founder designs the watches (lschrono-founder-design), and Lesablier says it designed, moulded and tooled every component of the case, bracelet and handset, so nothing apart from the movement is off the shelf (lschrono-tooled-components, lschrono-only-third-party), with a case developed over several prototypes and a three-layer dial (lschrono-case-prototypes, lschrono-dial-layers). That is bespoke components around a stock movement; no proprietary technical system, so not 4. Rests on brand statements only; borderline with 2.
        evidence:
