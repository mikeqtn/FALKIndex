        value: 0
        rationale: The complete movement is a bought-in Seiko VK64A (lschrono-vk64, lschrono-only-third-party) and is replaced whole at service (lschrono-vk64-service). No movement parts are made by the brand.
        evidence:
          - claim: lschrono-vk64
            stance: supports
            note: External movement.
          - claim: lschrono-only-third-party
            stance: supports
            note: Movement is third-party.
          - claim: lschrono-vk64-service
            stance: context
            note: Replaced whole.
      EX:
        value: null
        rationale: Lesablier says it designed, moulded and tooled every component and that only the movement is third-party (lschrono-tooled-components, lschrono-only-third-party), and the case took several prototypes (lschrono-case-prototypes). These describe custom design and tooling, not who physically makes the case and bracelet; no source names a maker or describes Lesablier case production, and the brand's later Travelgraph says its parts are sourced from overseas. "Only third-party component" is read as a design claim, not as evidence of who manufactures the parts, so the dimension stays U.
        evidence:
          - claim: lschrono-tooled-components
            stance: context
            note: Custom tooling; maker not named.
          - claim: lschrono-only-third-party
            stance: context
            note: Marketing statement; no production described.
          - claim: lschrono-case-prototypes
            stance: context
            note: Development, not maker.
      DH:
        value: null
        rationale: The three-layer dial is described (lschrono-dial-layers) and the brand says the handset was tooled for the watch (lschrono-tooled-components), but no source names the dial or hand maker or says any dial or hand stage is done by Lesablier.
        evidence:
          - claim: lschrono-dial-layers
            stance: context
            note: Construction, not maker.
          - claim: lschrono-tooled-components
            stance: context
