id: lesablier/chronosport
brand: lesablier
model: Chronosport
notes: Handbook v0.2 §8 lists this record as "Lesablier — Chronosport".
claims:
  - id: lschrono-vk64
    statement: The brand lists the Seiko VK64A Mecaquartz as the Chronosport's movement.
    excerpt: 'Movement: Seiko VK64A Mecaquartz'
    source: lesablier-chronosport-page
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: lschrono-vk64-review
    statement: A review identifies the movement as the Seiko VK64A, a quartz chronograph with a mechanical chronograph module.
    excerpt: The quartz movement in the watch is the Seiko VK64A Mechaquartz movement.
    source: watchclicker-lesablier-chronosport
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: lschrono-vk64-service
    statement: A review states that servicing the VK64 involves replacing the whole movement.
    excerpt: With a 3-year battery life and service that involves swapping the entire movement, the Seiko VK64 is reliable and keeps owners’ costs low.
    source: timebum-lesablier-chronosport
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: lschrono-case-prototypes
    statement: The brand says the case finishing took over a year and several case prototypes to develop.
    excerpt: It took us over a year and mutliple case prototypes to get this right
    source: lesablier-chronosport-page
    dimensions:
      - EX
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: lschrono-dial-layers
    statement: The brand describes a three-layer dial with applied faceted indices and a serial number on each dial.
    excerpt: 'Each dial has 3 layers: The base, recessed subdials, and elevated rehault tachymeter ring.'
    source: lesablier-chronosport-page
    dimensions:
      - DH
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: lschrono-founder-design
    statement: The founder states that he designs the watches himself, based on his own design preferences.
    excerpt: after collecting for many years I decided to take the leap and design my own perfect watch
    source: lesablier-our-story
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: lschrono-production
    statement: The brand says 50 Chronosport watches were produced in each colour.
    excerpt: 50 were produced in each color.
    source: lesablier-our-story
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: lschrono-tooled-components
    statement: Lesablier says that, because of the case design, finishes, integrated bracelet and handset, it had to design, mould and tool every component of the Chronosport. It does not say who manufactured the parts.
    excerpt: Due to the complexity of the Chronosport's case design, the variety of brushed, polished, and sandblasted finishes, the distinctive integrated bracelet and the unique handset, we had to design, mould and tool every last component.
    source: lesablier-chronosport-landing
    dimensions:
      - EX
      - DH
      - PD
    date_checked: 2026-11-17
    editor: falk-index
  - id: lschrono-only-third-party
    statement: Lesablier says no part of the Chronosport is off the shelf and that the Seiko VK64A movement is its only third-party component. The page does not name any case, bracelet, dial or hand maker or describe Lesablier production facilities.
    excerpt: This means that nothing you see on the Chronosport is an off-the-shelf part. The only third-party component in the Chronosport is the Seiko VK64A Mecaquartz movement.
    source: lesablier-chronosport-landing
    dimensions:
      - MA
      - MM
      - EX
      - DH
      - PD
    date_checked: 2026-11-17
    editor: falk-index
provenance:
  - dimension: MA
    component: Movement design (Seiko VK64A)
    performer: seiko-group
    relationship: external_specialist
    note: Stock Seiko (SII / Time Module) quartz chronograph caliber.
    claims:
      - lschrono-vk64
      - lschrono-vk64-review
      - lschrono-only-third-party
  - dimension: MM
    component: Complete movement
    performer: seiko-group
    relationship: external_specialist
    claims:
      - lschrono-vk64
      - lschrono-vk64-review
      - lschrono-only-third-party
  - dimension: EX
    component: Case and integrated bracelet
    relationship: unknown
    note: The brand describes developing the case over several prototypes and says it designed, moulded and tooled every component, with the movement as the only third-party part. No source names the case or bracelet maker or describes Lesablier making cases; the later Travelgraph page says that model's parts are sourced from overseas.
    claims:
      - lschrono-case-prototypes
      - lschrono-tooled-components
      - lschrono-only-third-party
  - dimension: DH
    component: Dial and hands
    relationship: unknown
    note: The dial construction is described by the brand, and it says the handset was tooled for the watch; the dial and hand maker is not named.
    claims:
      - lschrono-dial-layers
      - lschrono-tooled-components
      - lschrono-only-third-party
  - dimension: WE
    component: Assembly and casing
    relationship: unknown
    note: No source says where the Chronosport is assembled. The brand says the later Travelgraph is assembled in the Washington, D.C. area, but does not say this for the Chronosport.
    claims: []
  - dimension: PD
    component: Product design
    performer: lesablier
    relationship: internal
    claims:
      - lschrono-founder-design
      - lschrono-case-prototypes
      - lschrono-dial-layers
      - lschrono-tooled-components
