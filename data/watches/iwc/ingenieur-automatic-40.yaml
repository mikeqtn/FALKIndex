id: iwc/ingenieur-automatic-40
brand: iwc
model: Ingenieur Automatic 40
notes: Handbook v0.2 §8 lists this record as "IWC Schaffhausen — Ingenieur Automatic 40".
claims:
  - id: iwci40-valfleurier
    statement: A specialist site reports cal. 32111 is a variant of a movement created by ValFleurier, the Richemont-owned movement factory.
    excerpt: The cal. 32111 is proprietary but not exactly in-house, rather it is a variant of a movement created by ValFleurier, the movement factory owned by Richemont
    source: sjx-iwc-ingenieur-40-intro
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-32000-family
    statement: A specialist review says cal. 32111 is produced by ValFleurier, the movement maker owned by IWC's parent company.
    excerpt: Because the cal. 32111 is produced by ValFleurier, the movement maker owned by IWC’s parent company
    source: sjx-iwc-ingenieur-40-review
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-silicon
    statement: The review reports a silicon escape wheel and pallet lever.
    excerpt: The movement sports an escape wheel and pallet lever in silicon
    source: sjx-iwc-ingenieur-40-review
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-dial
    statement: The review reports the dial is soft iron, stamped with the grid pattern and then galvanised.
    excerpt: Made of soft iron, the dial is first stamped to create the pattern and then galvanised to give it colour.
    source: sjx-iwc-ingenieur-40-review
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-bracelet
    statement: The review describes an integrated bracelet with a hidden butterfly clasp, without naming its maker.
    excerpt: The Ingenieur 40 has an integrated bracelet with a hidden butterfly clasp
    source: sjx-iwc-ingenieur-40-review
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-case
    statement: A specialist site reports a 40 mm case containing a soft-iron inner cage, without naming its maker.
    excerpt: all sharing the same case measuring 40 mm wide and 10.8 mm thick that contains a soft-iron inner cage.
    source: sjx-iwc-ingenieur-40-intro
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-genta
    statement: The same site notes the original Ingenieur SL of 1976 was designed by Gérald Genta.
    excerpt: the original Ingenieur SL from 1976 that was famously designed by Gérald Genta
    source: sjx-iwc-ingenieur-40-intro
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-merishausen-cases
    statement: A 2018 report says IWC's Merishausen manufacture includes case production (not tied to this model).
    excerpt: Raw materials (primarily bars of metal) and case production are located at the basement.
    source: sjx-iwc-merishausen
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-merishausen-parts
    statement: The same report says about 1,500 different parts for IWC's calibres are made there (not tied to cal. 32111).
    excerpt: a total of 1500 different parts for IWC's range of calibres are made
    source: sjx-iwc-merishausen
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-merishausen-assembly
    statement: The same report describes a movement assembly department at Merishausen.
    excerpt: That's followed by the movement assembly department.
    source: sjx-iwc-merishausen
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: iwci40-press-manufactured
    statement: IWC calls cal. 32111 "IWC-manufactured", which conflicts with specialist reports that ValFleurier produces it.
    excerpt: The Ingenieur Automatic 40 is powered by the IWC-manufactured 32111 calibre with a power reserve of 120 hours.
    source: iwc-ingenieur-40-press
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-29
    editor: ai-draft
    status: disputed
  - id: iwci40-calibre32-developed
    statement: IWC says its watchmakers developed the calibre 32 family, which conflicts with specialist reports that it is a ValFleurier creation.
    excerpt: The next challenge for IWC watchmakers was to develop a simpler, basic movement with only time and date functions.
    source: iwc-journal-mechanical-marvels-2
    dimensions:
      - MA
      - PD
    date_checked: 2026-10-29
    editor: ai-draft
    status: disputed
  - id: iwci40-press-engineering
    statement: IWC says it put substantial engineering effort into the case proportions, ergonomics and finishing of the new model.
    excerpt: we invested a lot of time and effort into engineering a new automatic model with perfect case proportions and ergonomics
    source: iwc-ingenieur-40-press
    dimensions:
      - PD
    date_checked: 2026-10-29
    editor: ai-draft
  - id: iwci40-press-middle-link
    statement: IWC says the model has a newly engineered middle-link bracelet attachment in place of the original's horns.
    excerpt: the new Ingenieur Automatic 40 features a newly engineered middle-link attachment.
    source: iwc-ingenieur-40-press
    dimensions:
      - PD
      - EX
    date_checked: 2026-10-29
    editor: ai-draft
  - id: iwci40-press-bezel-screws
    statement: IWC says five functional screws now secure the bezel to the case.
    excerpt: With the Ingenieur Automatic 40, five screws secure the bezel to the case.
    source: iwc-ingenieur-40-press
    dimensions:
      - PD
      - EX
    date_checked: 2026-10-29
    editor: ai-draft
  - id: iwci40-press-dial
    statement: IWC says the grid pattern is stamped into the soft-iron dial blank before galvanising, without naming who does it.
    excerpt: it is stamped into the soft iron blank before it is galvanised.
    source: iwc-ingenieur-40-press
    dimensions:
      - DH
    date_checked: 2026-10-29
    editor: ai-draft
  - id: iwc-cases-from-bars
    statement: IWC says its stainless-steel and titanium cases are machined from bars on its CNC lathes and milling machines.
    excerpt: Stainless-steel and titanium cases are made from bars, specially produced for IWC, which are machined on CNC lathe and milling machines to an accuracy of one-hundredth of a millimetre.
    source: iwc-manufacture-process
    dimensions:
      - EX
    date_checked: 2026-10-29
    editor: ai-draft
  - id: iwc-cases-ingenieur
    statement: IWC's case-making description names the Ingenieur cases as an example of its milling work.
    excerpt: to create the complex open surfaces, such as those on the cases of the Ingenieur watches.
    source: iwc-manufacture-process
    dimensions:
      - EX
    date_checked: 2026-10-29
    editor: ai-draft
  - id: iwc-case-finishing
    statement: IWC says its case production grinds, polishes, satin-finishes and blasts the case surfaces, and specialists add decoration such as circular graining.
    excerpt: Specialists now apply decorative surfaces such as circular graining to certain parts of the case, including places not visible from outside.
    source: iwc-manufacture-process
    dimensions:
      - CF
    date_checked: 2026-10-29
    editor: ai-draft
  - id: iwc-casing-up
    statement: IWC says its specialists mount dials and hands on the timed and regulated movement and case it.
    excerpt: specialists mount the dials on the fully timed and regulated movement by hand or using special tools.
    source: iwc-manufacture-process
    dimensions:
      - WE
    date_checked: 2026-10-29
    editor: ai-draft
