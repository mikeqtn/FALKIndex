id: iwc/ingenieur-automatic-40
brand: iwc
model: Ingenieur Automatic 40
notes: Handbook v0.2 §8 lists this record as "IWC Schaffhausen — Ingenieur Automatic 40".
claims:
  - id: iwci40-valfleurier
    statement: A specialist site reports cal. 32111 is a variant of a movement created by ValFleurier, the Richemont-owned movement factory.
    excerpt: The cal. 32111 is proprietary but not exactly in-house, rather it is a variant of a movement created by ValFleurier, the movement factory owned by Richemont
    source: sjx-iwc-ingenieur-40-intro
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-32000-family
    statement: A specialist review says cal. 32111 is produced by ValFleurier, the movement maker owned by IWC's parent company.
    excerpt: Because the cal. 32111 is produced by ValFleurier, the movement maker owned by IWC’s parent company
    source: sjx-iwc-ingenieur-40-review
    dimensions:
      - MA
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-silicon
    statement: The review reports a silicon escape wheel and pallet lever.
    excerpt: The movement sports an escape wheel and pallet lever in silicon
    source: sjx-iwc-ingenieur-40-review
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-dial
    statement: The review reports the dial is soft iron, stamped with the grid pattern and then galvanised.
    excerpt: Made of soft iron, the dial is first stamped to create the pattern and then galvanised to give it colour.
    source: sjx-iwc-ingenieur-40-review
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-bracelet
    statement: The review describes an integrated bracelet with a hidden butterfly clasp, without naming its maker.
    excerpt: The Ingenieur 40 has an integrated bracelet with a hidden butterfly clasp
    source: sjx-iwc-ingenieur-40-review
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-case
    statement: A specialist site reports a 40 mm case containing a soft-iron inner cage, without naming its maker.
    excerpt: all sharing the same case measuring 40 mm wide and 10.8 mm thick that contains a soft-iron inner cage.
    source: sjx-iwc-ingenieur-40-intro
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-genta
    statement: The same site notes the original Ingenieur SL of 1976 was designed by Gérald Genta.
    excerpt: the original Ingenieur SL from 1976 that was famously designed by Gérald Genta
    source: sjx-iwc-ingenieur-40-intro
    dimensions:
      - PD
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-merishausen-cases
    statement: A 2018 report says IWC's Merishausen manufacture includes case production (not tied to this model).
    excerpt: Raw materials (primarily bars of metal) and case production are located at the basement.
    source: sjx-iwc-merishausen
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-merishausen-parts
    statement: The same report says about 1,500 different parts for IWC's calibres are made there (not tied to cal. 32111).
    excerpt: a total of 1500 different parts for IWC's range of calibres are made
    source: sjx-iwc-merishausen
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: ai-draft
  - id: iwci40-merishausen-assembly
    statement: The same report describes a movement assembly department at Merishausen.
    excerpt: That's followed by the movement assembly department.
    source: sjx-iwc-merishausen
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: ai-draft
