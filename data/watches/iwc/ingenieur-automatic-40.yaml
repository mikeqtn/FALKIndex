  - version: 3
    methodology: v0.2
    confidence: C
    independent_watchmaker: false
    status: draft
    editor: ai-draft
    change_note: "Adds IWC's Ingenieur Automatic 40 press release, its manufacture-process page and its movement journal. Changes from version 2: EX U → 2; CF U → 1; WE U → 2; PD U → 3; confidence D → C. Two of seven dimensions remain U (MM, DH). IWC's own claims about cal. 32111 conflict with specialist reports and are marked disputed."
    created_on: 2026-10-29
    scores:
      MA:
        value: 1
        rationale: Two specialist reports say cal. 32111 is a variant of a ValFleurier movement, in-group at Richemont. IWC's own pages say its watchmakers developed the calibre 32 family and call the 32111 IWC-manufactured, which contradicts them; until a source settles who designed it, the score stays on the specific reports. Borderline with 0, and could rise if IWC's development claim is confirmed.
        evidence:
          - claim: iwci40-valfleurier
            stance: supports
            note: ValFleurier origin.
          - claim: iwci40-32000-family
            stance: supports
            note: Produced by ValFleurier.
          - claim: iwci40-calibre32-developed
            stance: contradicts
            note: IWC says its watchmakers developed it.
      MM:
        value: null
        rationale: Specialist reports put production at ValFleurier, while IWC calls the 32111 IWC-manufactured. No source says where its parts are made, and IWC's Merishausen parts production is described for its own calibre families. U until the conflict is resolved.
        evidence:
          - claim: iwci40-press-manufactured
            stance: context
            note: Disputed brand claim.
          - claim: iwci40-valfleurier
            stance: context
            note: ValFleurier origin.
          - claim: iwci40-merishausen-parts
            stance: context
            note: Not tied to this calibre.
      EX:
        value: 2
        rationale: IWC says it machines all its stainless-steel and titanium cases from bars and names the Ingenieur cases as an example, so the case is internal. No source names the bracelet maker, so not 3.
        evidence:
          - claim: iwc-cases-from-bars
            stance: supports
            note: Universal for steel and titanium cases.
          - claim: iwc-cases-ingenieur
            stance: supports
            note: Names Ingenieur cases.
          - claim: iwci40-merishausen-cases
            stance: context
            note: Case production site.
          - claim: iwci40-bracelet
            stance: context
            note: Bracelet maker not named.
      DH:
        value: null
        rationale: IWC describes the stamped, galvanised grid dial but no source names who makes the dial or the hands.
        evidence:
          - claim: iwci40-press-dial
            stance: context
            note: Process, not performer.
          - claim: iwci40-dial
            stance: context
            note: Maker not named.
      CF:
        value: 1
        rationale: IWC's case production grinds, polishes, satin-finishes and blasts its cases, with specialists adding circular graining. That is limited decorative handwork on the case, counted here as craft and separately from case manufacture under EX. No source describes movement finishing, so not 2.
        evidence:
          - claim: iwc-case-finishing
            stance: supports
            note: Internal case finishing.
      WE:
        value: 2
        rationale: IWC says its specialists mount dials and hands on the regulated movement and case every watch. No source says where cal. 32111 is assembled or regulated, so this is casing and assembly, not 3.
        evidence:
          - claim: iwc-casing-up
            stance: supports
            note: Casing up by IWC.
          - claim: iwci40-merishausen-assembly
            stance: context
            note: Movement assembly not tied to this calibre.
      PD:
        value: 3
        rationale: IWC re-engineered the 1976 Genta design with new case proportions, a newly engineered middle-link bracelet attachment and functional bezel screws. That is bespoke development around a group-supplied calibre; 4 would need proprietary technical systems, which the disputed movement claims cannot yet support.
        evidence:
          - claim: iwci40-press-engineering
            stance: supports
            note: Case engineering.
          - claim: iwci40-press-middle-link
            stance: supports
            note: New bracelet attachment.
          - claim: iwci40-press-bezel-screws
            stance: supports
            note: Functional bezel screws.
          - claim: iwci40-genta
            stance: context
            note: Original design by Genta.
    classification:
      - industrial_manufacture
