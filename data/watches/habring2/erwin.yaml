        rationale: Habring² says the movement is finished by hand with polished bevels, decorative grinding and perlage. That is substantial hand finishing.
        evidence:
          - claim: h2erw-finishing
            stance: supports
            note: Hand finishing.
      WE:
        value: 5
        rationale: Escapement parts are hand-mounted and adjusted, hairsprings scaled and paired with balances, and every movement is regulated to chronometer standard.
        evidence:
          - claim: h2erw-escapement
            stance: supports
            note: Hand-mounted escapement.
          - claim: h2erw-hairspring-scaling
            stance: supports
            note: Scaling and pairing.
          - claim: h2erw-regulation
            stance: supports
