id: habring2/five-minute-repeater
brand: habring2
model: Five Minute Repeater
notes: Handbook v0.2 §8 lists this record as "Habring² — Five Minute Repeater".
claims:
  - id: h2rep-a11-d90
    statement: A review reports the current repeater uses Habring²'s A11 base with a Dubois-Depraz D90 five-minute repeater module.
    excerpt: The base movement is the in-house A11, with the D90 5 minute repeater module by Dubuis-Depraz.
    source: deployant-habring2-repeater
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-earlier-eta
    statement: The same review says an earlier Habring² five-minute repeater used an ETA base with a Dubois-Depraz module.
    excerpt: the base movement used was the ubiquitious ETA with a Dubuis Depraz module.
    source: deployant-habring2-repeater
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-buys-module
    statement: The review reports Habring² buys the module and finishes and assembles the movement in-house.
    excerpt: Habring2 buys the module from DD, and completely finish and assemble the movement in-house.
    source: deployant-habring2-repeater
    dimensions:
      - MM
      - CF
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-final-assembly
    statement: The review reports Richard Habring does final assembly, and understands he does the final tuning of the sound.
    excerpt: Further final assembly is done by Richard himself, and we understanding the final tuning of the sound too.
    source: deployant-habring2-repeater
    dimensions:
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-hands
    statement: The review describes hand-blued steel hands, without naming their maker.
    excerpt: A set of very elegant, swallow hands, made in hand blued steel graces the dial side.
    source: deployant-habring2-repeater
    dimensions:
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-module-spec
    statement: Habring² lists the Dubois-Depraz D90 module in the A11B/D90 movement.
    excerpt: Dubois-Depraz 5-minutes-repeater module D90 (measuring 36 mm in diameter and 3.75 mm in height)
    source: habring2-repeater-page
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-carl-haas
    statement: Habring² lists a Carl Haas hairspring for the repeater's escapement.
    excerpt: Anti-magnetic escapement with a Carl Haas hairspring in chronometer quality
    source: habring2-repeater-page
    dimensions:
      - MM
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-finishing
    statement: Habring² says the movement is finished by hand with polished edges, engravings and perlage.
    excerpt: Elaborately refined by hand with polished edges, decorative engravings, perlage, etc.
    source: habring2-repeater-page
    dimensions:
      - CF
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-case
    statement: Habring² lists a titanium case (grade 2 middle, grade 5 back and bezel), without naming its maker.
    excerpt: Titan Grade 2 (middle part) and Grade 5 (caseback and bezel polished)
    source: habring2-repeater-page
    dimensions:
      - EX
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-25-suppliers
    statement: A lecture recap reports that about 25 suppliers work with Habring².
    excerpt: There are about 25 suppliers that work with the brand
    source: hsny-habring2-a11
    dimensions:
      - MM
      - EX
      - DH
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-hairspring-scaling
    statement: A manufacture visit reports that Habring² scales hairsprings and pairs them with individually adjusted balance wheels.
    excerpt: the scaling of hairsprings, as well as the pairing of those springs with individually adjusted balance wheels.
    source: ablogtowatch-habring2-felix-visit
    dimensions:
      - MM
      - WE
    date_checked: 2026-10-21
    editor: falk-index
  - id: h2rep-a11-specialists
    statement: Habring² says all components of the A11 movement family are produced with the help of specialists in the DACH region, most of them small family-owned businesses.
    excerpt: All components of the A11-family are produced with the help of skilled specialists in the DACH-region, most of them small family owned businesses.
    source: habring2-faqs
    dimensions:
      - MM
      - PD
    date_checked: 2026-11-17
    editor: falk-index
  - id: h2rep-a11-drawings
    statement: Habring² says all A11 components are produced under its direction and to production drawings issued by Habring Uhrentechnik OG.
    excerpt: All components of the A11 are produced under direction and following production drawings issued by Habring Uhrentechnik OG.
    source: habring2-faqs
    dimensions:
      - MM
      - PD
    date_checked: 2026-11-17
    editor: falk-index
  - id: h2rep-ultra-rotating
    statement: A lecture recap reports that a supplier called Ultra makes all of Habring²'s rotating parts such as the pinions.
    excerpt: Ultra now makes all of Habring²’s rotating parts such as the pinions.
    source: hsny-habring2-a11
    dimensions:
      - MM
    date_checked: 2026-11-17
    editor: falk-index
  - id: h2rep-anchors
    statement: A 2014 manufacture visit reports seeing Habring² manufacture anchors (pallet forks) for its escapements.
    excerpt: specifically, the manufacturing of unique anchors, the scaling of hairsprings
    source: ablogtowatch-habring2-felix-visit
    dimensions:
      - MM
    date_checked: 2026-11-17
    editor: falk-index
  - id: h2rep-plates-modified
    statement: The same 2014 visit reports that Habring² receives raw base materials for movement plates, balance wheels and balance springs and modifies them in its workshops.
    excerpt: the Habring2 manufacture receives base materials for movement plates, balance wheels and balance springs in a relatively raw form, meaning that they are all painstakingly modified in the workshops.
    source: ablogtowatch-habring2-felix-visit
    dimensions:
      - MM
    date_checked: 2026-11-17
    editor: falk-index
  - id: h2rep-wheels-2014
    statement: The same 2014 visit reports trainee watchmakers crafting wheels for the then-new A11 movement.
    excerpt: we were greeted by two young watchmakers-to-be, in the process of crafting wheels for the new movement.
    source: ablogtowatch-habring2-felix-visit
    dimensions:
      - MM
    date_checked: 2026-11-17
    editor: falk-index
  - id: h2rep-benzinger-hands
    statement: An aBlogtoWatch article on the Habring² Benzinger edition of the five-minute repeater reports that Maria Habring flame-blues the hands, while Jochen Benzinger does the engraving, guilloche and skeletonising.
    excerpt: The hands are flame-blued by Maria Habring, while the engravings, guilloche, and skeleton aspects are handled by Jochen according to the customer’s wishes.
    source: ablogtowatch-habring2-benzinger-repeater
    dimensions:
      - DH
      - CF
    date_checked: 2026-11-17
    editor: falk-index
  - id: h2rep-benzinger-a11
    statement: The same article reports the Benzinger edition of the repeater comes in three designs in a 42 mm grade 5 titanium case.
    excerpt: Offered in three different designs, the Repeater comes in a 42mm Grade 5 Titanium case that features a matte finish.
    source: ablogtowatch-habring2-benzinger-repeater
    dimensions:
      - DH
    date_checked: 2026-11-17
    editor: falk-index
