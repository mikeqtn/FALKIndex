claims:
  - id: ak-koi-ljp
    statement: The Eternal Koi uses the La Joux-Perret F200 manual-wind movement.
    excerpt: The reverse side reveals the manual winding La Joux-Perret F200 calibre movement
    source: horologybythesea-akmaev-koi
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ak-koi-movement-engraving
    statement: Akmaev hand-relief engraves the bridges, barrel and balance bridge.
    excerpt: Artur further extends his talents to fully hand-relief engraving the bridges, spring barrel and balance bridge.
    source: horologybythesea-akmaev-koi
    dimensions:
      - CF
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ak-koi-dial
    statement: The dial is a hand-engraved spring-steel surface with silver and gold inlays.
    excerpt: Pure silver and gold inlays form the flowing waves on a hand-engraved spring steel surface.
    source: horologybythesea-akmaev-koi
    dimensions:
      - CF
      - DH
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ak-koi-sculpted
    statement: The koi are sculpted from silver with gold and copper highlights.
    excerpt: The koi themselves are sculpted from silver, with individual scales highlighted in pure yellow gold and copper.
    source: horologybythesea-akmaev-koi
    dimensions:
      - CF
      - DH
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ak-koi-hands
    statement: The hands are heat-blued or purpled steel, finished by hand.
    excerpt: Completing the composition is a set of traditionally heat-blued or purpled steel hands, finished by hand.
    source: horologybythesea-akmaev-koi
    dimensions:
      - DH
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ak-process-strip
    statement: Akmaev strips the movement and engraves each component individually.
    excerpt: The movement is then stripped down to its bare bones where each component is then engraved and skeletonized individually.
    source: ablogtowatch-akmaev-2015
    dimensions:
      - CF
      - WE
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ak-process-reassembly
    statement: The movement is reassembled and tested after engraving.
    excerpt: The movement is then meticulously reassembled and tested to ensure everything runs smoothly.
    source: ablogtowatch-akmaev-2015
    dimensions:
      - WE
    date_checked: 2026-10-13
    editor: ai-draft
  - id: ak-process-sketch
    statement: Akmaev plans and sketches the whole design, from dial to movement parts.
    excerpt: He begins by planning out and sketching everything from the dial and main plate to the crown wheel and drum barrel.
    source: ablogtowatch-akmaev-2015
    dimensions:
      - PD
    date_checked: 2026-10-13
    editor: ai-draft
