      MA:
        value: 0
        rationale: Stock La Joux-Perret F200 movement.
        evidence:
          - claim: ak-koi-ljp
            stance: supports
            note: Names the stock caliber.
      MM:
        value: 0
        rationale: The complete movement is bought in; engraving changes its decoration, not its manufacture.
        evidence:
          - claim: ak-koi-ljp
            stance: supports
            note: External movement.
      EX:
        value: null
        rationale: No source names the case maker. U until found (handbook score was 0).
        evidence: []
      DH:
        value: null
        rationale: The engraving and inlay on the dial are counted under CF. No source says who makes the dial base or the hands, so DH is U (handbook score was 0). If Akmaev fabricates the dial himself, DH would rise to 2–3.
        evidence:
          - claim: ak-koi-hands
            stance: context
            note: Hands finished by hand; maker not named.
      CF:
        value: 5
        rationale: Akmaev personally engraves and inlays the dial, sculpts the koi, and relief-engraves the movement. This master-level craft defines the watch.
        evidence:
          - claim: ak-koi-dial
            stance: supports
            note: Dial engraving and inlay.
          - claim: ak-koi-sculpted
            stance: supports
            note: Sculpted silver koi.
          - claim: ak-koi-movement-engraving
            stance: supports
            note: Movement engraving.
      WE:
        value: 3
        rationale: Movements are stripped, engraved, reassembled and tested by Akmaev. The process description dates from 2015 and ETA-based pieces, so it should be reconfirmed for the F200.
        evidence:
          - claim: ak-process-strip
            stance: supports
            note: Full strip-down in-house.
          - claim: ak-process-reassembly
            stance: supports
            note: Reassembly and testing.
      PD:
        value: 3
        rationale: Akmaev designs the whole watch, from dial to movement decoration, around a supplier movement.
        evidence:
          - claim: ak-process-sketch
            stance: supports
            note: Original design work.
