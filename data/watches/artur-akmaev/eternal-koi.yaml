    component: Dial engraving, silver and gold inlay, sculpted koi
    performer: artur-akmaev
    relationship: internal
    claims:
      - ak-koi-dial
      - ak-koi-sculpted
  - dimension: CF
    component: Movement relief engraving
    performer: artur-akmaev
    relationship: internal
    claims:
      - ak-koi-movement-engraving
  - dimension: WE
    component: Movement strip-down, reassembly and testing
    performer: artur-akmaev
    relationship: internal
    note: Described in 2015 for ETA-based pieces.
    claims:
      - ak-process-strip
      - ak-process-reassembly
claims:
  - id: ak-koi-ljp
    statement: The Eternal Koi uses the La Joux-Perret F200 manual-wind movement.
    excerpt: The reverse side reveals the manual winding La Joux-Perret F200 calibre movement
    source: horologybythesea-akmaev-koi
    dimensions:
      - MA
      - MM
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: ak-koi-movement-engraving
    statement: Akmaev hand-relief engraves the bridges, barrel and balance bridge.
    excerpt: Artur further extends his talents to fully hand-relief engraving the bridges, spring barrel and balance bridge.
    source: horologybythesea-akmaev-koi
    dimensions:
      - CF
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: ak-koi-dial
    statement: The dial is a hand-engraved spring-steel surface with silver and gold inlays.
    excerpt: Pure silver and gold inlays form the flowing waves on a hand-engraved spring steel surface.
    source: horologybythesea-akmaev-koi
    dimensions:
      - CF
      - DH
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: ak-koi-sculpted
    statement: The koi are sculpted from silver with gold and copper highlights.
    excerpt: The koi themselves are sculpted from silver, with individual scales highlighted in pure yellow gold and copper.
    source: horologybythesea-akmaev-koi
    dimensions:
      - CF
      - DH
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: ak-koi-hands
    statement: The hands are heat-blued or purpled steel, finished by hand.
    excerpt: Completing the composition is a set of traditionally heat-blued or purpled steel hands, finished by hand.
    source: horologybythesea-akmaev-koi
    dimensions:
      - DH
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: ak-process-strip
    statement: Akmaev strips the movement and engraves each component individually.
    excerpt: The movement is then stripped down to its bare bones where each component is then engraved and skeletonized individually.
    source: ablogtowatch-akmaev-2015
    dimensions:
      - CF
      - WE
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: ak-process-reassembly
    statement: The movement is reassembled and tested after engraving.
    excerpt: The movement is then meticulously reassembled and tested to ensure everything runs smoothly.
    source: ablogtowatch-akmaev-2015
    dimensions:
      - WE
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: ak-process-sketch
    statement: Akmaev plans and sketches the whole design, from dial to movement parts.
    excerpt: He begins by planning out and sketching everything from the dial and main plate to the crown wheel and drum barrel.
    source: ablogtowatch-akmaev-2015
    dimensions:
      - PD
    date_checked: 2026-10-13
    editor: falk-index
    status: active
  - id: ak-cases-own-design
    statement: In a 2023 Monochrome interview, Akmaev says his first few watches had cases of his own design.
    excerpt: My first few watches had cases of my own design; they were nicely machined.
    source: monochrome-akmaev-interview-2023
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: ak-cases-german-supplier
    statement: In the same interview, Akmaev says he set aside self-designed cases as too labour-intensive, found a supplier in Germany, and has worked with that supplier since.
    excerpt: So I found a supplier in Germany, and since then, I have been working with them.
    source: monochrome-akmaev-interview-2023
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: ak-cases-expand-options
    statement: Akmaev said in 2023 that he was working on expanding his options for movements and cases.
    excerpt: Right now, I am focused on how I can expand my options for the movements and cases.
    source: monochrome-akmaev-interview-2023
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
  - id: ak-cases-sjx-stock
    statement: SJX Watches reported in 2020 that the cases Akmaev uses are stock offerings from a Swiss supplier. This differs from the German supplier Akmaev named in 2023.
    excerpt: The watch cases he uses are stock offerings from a Swiss supplier, while his favoured movement is the large and common ETA Unitas.
    source: sjx-akmaev-battle-city
    dimensions:
      - EX
    date_checked: 2026-11-17
    editor: falk-index
    status: active
