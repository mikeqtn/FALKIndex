id: artur-akmaev/eternal-koi
brand: artur-akmaev
model: Eternal Koi
caliber: La Joux-Perret F200
notes: Handbook v0.2 §8 lists this record as "Artur Akmaev — Koi / Tide". Narrowed on 2026-10-14 to the Eternal Koi (La Joux-Perret F200), the only route with evidence. No source for a "Tide" by Akmaev was found; it can be added as its own record if one appears. Akmaev is also credited with movement engraving on the J.N. Shapiro Infinity.
provenance:
  - dimension: MA
    component: Movement (La Joux-Perret F200)
    performer: la-joux-perret
    relationship: external_specialist
    claims:
      - ak-koi-ljp
  - dimension: MM
    component: Complete movement
    performer: la-joux-perret
    relationship: external_specialist
    claims:
      - ak-koi-ljp
  - dimension: EX
    component: Case (stainless steel, 37 mm)
    relationship: external_specialist
    note: No source names the maker of this 37 mm case. Akmaev says in a 2023 interview that after his first few self-designed cases he has bought cases from a supplier in Germany; SJX (2020) describes his cases as stock parts from a Swiss supplier. Both statements cover his cases in general and predate this model; the supplier is not named.
    claims:
      - ak-cases-own-design
      - ak-cases-german-supplier
      - ak-cases-sjx-stock
      - ak-cases-expand-options
  - dimension: DH
    component: Dial blank
    relationship: unknown
    note: Who makes the spring-steel dial base is not stated.
    claims: []
