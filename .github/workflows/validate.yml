name: validate
# Pull requests run once; pushes only for main, so a PR branch isn't checked twice.
on:
  push: { branches: [main] }
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # a normal run takes about 2; the default lets a hung step run for 6 hours
    # Playwright's image ships WebKit and its system libraries; installing them from Ubuntu's mirror took up to 20 minutes.
    # Keep the tag in step with the playwright version in package.json.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      # Placeholder Clerk keys: the tests only make anonymous requests, which never reach Clerk.
      CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run db:setup
      - run: npm run db:import
      - run: npm run build
      - run: npm test
      # Every public page on phone-sized screens in WebKit, Safari's engine.
      # A browser request with a development Clerk key starts a handshake with Clerk's servers and gets a 400.
      # A production-format placeholder key (for clerk.example.com) skips it; requests stay anonymous.
      - run: npm run test:phone
        env:
          CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_live_ci_placeholder
